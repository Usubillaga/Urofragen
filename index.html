iner Lymphadenektomie stellt sich ein 64-jähriger Patient mit einseitiger Beinschwellung links, Druckgefühl im Unterbauch und subfebrilen Temperaturen vor. Das CT zeigt eine glatt begrenzte Flüssigkeitsansammlung von 8 cm im linken Becken mit Kompression der Iliakalvene.","lead_in":"Wie ist vorzugehen?","options":{"A":{"text":"Thrombose ausschließen, dann perkutan drainieren","rationale":"Die Kompression begünstigt eine Thrombose, die getrennt zu behandeln wäre. Symptomatische Lymphozelen werden drainiert, asymptomatische beobachtet. Die Kompression der Iliakalvene begünstigt eine tiefe Venenthrombose, die getrennt zu behandeln wäre. Bei der Drainage wird Material zur Erregerdiagnostik gewonnen; bei Rezidiv folgt die laparoskopische Marsupialisation mit peritonealem Fenster."},"B":{"text":"Sofortige offene Revision mit Ausräumung der Höhle","rationale":"Ein unnötig invasiver erster Schritt; die perkutane Drainage löst den überwiegenden Teil der Fälle."},"C":{"text":"Antibiotisch behandeln und die Rückbildung abwarten","rationale":"Das gilt für kleine, asymptomatische Ansammlungen. Hier bestehen Kompression und Symptome."},"D":{"text":"Therapeutische Antikoagulation ohne weitere Diagnostik","rationale":"Ohne gesicherte Thrombose nicht begründet, und sie behandelt die Ursache der Schwellung nicht."}},"explanation":{"core":"Die Lymphozele ist die häufigste Komplikation der pelvinen Lymphadenektomie. Die meisten bleiben asymptomatisch und bedürfen keiner Behandlung. Symptomatisch wird sie durch Kompression von Vene, Ureter oder Nerv oder durch Infektion. Prophylaktisch wirken Clips oder Versiegelung der Lymphbahnen statt bipolarer Koagulation und ein peritoneales Fenster.","teaching_point":"Nicht jede Lymphozele wird behandelt. Behandelt wird, was drückt oder infiziert ist."},"flag_note":null},"en":{"vignette":"Three weeks after radical prostatectomy with extended pelvic lymph node dissection a 64-year-old man presents with unilateral left leg swelling, lower abdominal pressure and low-grade fever. CT shows a smoothly bordered 8 cm fluid collection in the left pelvis compressing the iliac vein.","lead_in":"How should management proceed?","options":{"A":{"text":"Exclude thrombosis, then drain percutaneously","rationale":"Compression predisposes to thrombosis, which would need separate treatment. Symptomatic lymphoceles are drained, asymptomatic ones observed. Compression of the iliac vein predisposes to deep vein thrombosis, which would need separate treatment. Material for microbiology is taken at drainage; recurrence is managed by laparoscopic marsupialisation with a peritoneal window."},"B":{"text":"Immediate open revision with evacuation of the cavity","rationale":"An unnecessarily invasive first step; percutaneous drainage resolves the majority of cases."},"C":{"text":"Treat with antibiotics and await spontaneous resolution","rationale":"That applies to small asymptomatic collections. Here there is compression and there are symptoms."},"D":{"text":"Therapeutic anticoagulation without further investigation","rationale":"Unjustified without proven thrombosis, and it does not treat the cause of the swelling."}},"explanation":{"core":"Lymphocele is the commonest complication of pelvic lymph node dissection. Most remain asymptomatic and need no treatment. They become symptomatic through compression of vein, ureter or nerve, or through infection. Prevention rests on clips or sealing of lymphatics instead of bipolar coagulation, and on a peritoneal window.","teaching_point":"Not every lymphocele is treated. Treat what compresses or is infected."},"flag_note":null}}},{"id":"uro-ope-00017","version":1,"status":"published","taxonomy":{"subdomain":"Rektumverletzung","tags":["operationstechnik","komplikationsmanagement","notfall"],"domain":"operativ"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2029-09-06"},"content":{"de":{"vignette":"Bei der Präparation der Prostatarückfläche entsteht eine etwa ein Zentimeter große Rektumläsion, die sofort erkannt wird. Der Patient ist nicht vorbestrahlt, der Darm war präoperativ nicht vorbereitet, es besteht keine grobe Stuhlkontamination.","lead_in":"Wie ist zu verfahren?","options":{"A":{"text":"Die Läsion belassen und lediglich eine Drainage einlegen","rationale":"Ein nicht verschlossener Defekt führt regelhaft zur rektourethralen Fistel und zur Beckensepsis."},"B":{"text":"Grundsätzlich ein protektives Stoma anlegen und später nähen","rationale":"Bei kleiner, sofort erkannter Läsion ohne Vorbestrahlung ist die primäre Versorgung ohne Stoma möglich; das Stoma bleibt Risikokonstellationen vorbehalten."},"C":{"text":"Mehrschichtiger Verschluss mit Gewebeinterposition","rationale":"Die Trennung der beiden Nahtreihen durch Gewebe ist der entscheidende Schritt gegen die Fistelbildung, weil sonst zwei Nähte direkt aufeinanderliegen. Zwischen Darm- und Harnröhrennaht wird Omentum oder Fettgewebe eingebracht, damit nicht zwei Nahtreihen aufeinanderliegen. Dazu kommen ausgiebige Spülung, breite antibiotische Abdeckung, Drainage und verlängerte Katheterableitung; ein Stoma nur bei großem Defekt, Vorbestrahlung oder grober Kontamination."},"D":{"text":"Abbruch der Operation und Verschiebung der Prostatektomie","rationale":"Der Abbruch löst das Problem der bereits bestehenden Läsion nicht und schafft ein zweites Operationsereignis."}},"explanation":{"core":"Die intraoperativ erkannte Rektumverletzung ist beherrschbar, die übersehene nicht. Entscheidend sind drei Dinge: sicherer mehrschichtiger Verschluss, Interposition von vitalem Gewebe zwischen die beiden Nahtreihen und die Entscheidung über ein Stoma anhand von Defektgröße, Vorbestrahlung und Kontamination.","teaching_point":"Zwei Nähte dürfen nicht aufeinanderliegen. Zwischen sie gehört Gewebe."},"flag_note":null},"en":{"vignette":"During dissection of the posterior prostatic surface a rectal injury of about one centimetre occurs and is recognised immediately. The patient has not been irradiated, the bowel was not prepared preoperatively, and there is no gross faecal contamination.","lead_in":"How should this be managed?","options":{"A":{"text":"Leave the lesion and simply insert a drain","rationale":"An unclosed defect regularly leads to rectourethral fistula and pelvic sepsis."},"B":{"text":"Always create a stoma and repair the defect later","rationale":"With a small, immediately recognised lesion in a non-irradiated patient, primary repair without a stoma is feasible; the stoma is reserved for high-risk constellations."},"C":{"text":"Multilayer closure with tissue interposition","rationale":"Separating the two suture lines with tissue is the decisive step against fistula formation, since otherwise two suture lines lie directly on each other. Omentum or fat is placed between the bowel and urethral suture lines so that two suture lines do not lie on each other. Generous irrigation, broad antibiotic cover, drainage and prolonged catheter drainage are added; a stoma only for a large defect, previous radiotherapy or gross contamination."},"D":{"text":"Abandon the operation and postpone the prostatectomy","rationale":"Abandoning does not solve the existing injury and creates a second operative event."}},"explanation":{"core":"A rectal injury recognised intraoperatively is manageable; one that is missed is not. Three things matter: secure multilayer closure, interposition of viable tissue between the two suture lines, and the stoma decision based on defect size, previous radiotherapy and contamination.","teaching_point":"Two suture lines must not lie on each other. Tissue belongs between them."},"flag_note":null}}},{"id":"uro-ope-00018","version":1,"status":"published","taxonomy":{"subdomain":"TUR-Syndrom","tags":["notfall","komplikationsmanagement","labordiagnostik","endourologisch"],"domain":"operativ"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Management of Non-neurogenic Male LUTS","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2029-09-06"},"content":{"de":{"vignette":"Während einer monopolaren transurethralen Prostataresektion mit einer Resektionszeit von 85 Minuten wird der Patient in Spinalanästhesie zunehmend unruhig und verwirrt, klagt über Übelkeit und Sehstörungen. Der Blutdruck steigt, die Herzfrequenz fällt auf 48 pro Minute. Das Serumnatrium beträgt 116 mmol/l.","lead_in":"Was ist zu tun?","options":{"A":{"text":"Natrium rasch in den Normbereich anheben, binnen Stunden","rationale":"Die zu schnelle Korrektur kann eine osmotische Demyelinisierung auslösen; der Anstieg wird auf etwa 8 bis 10 mmol/l in 24 Stunden begrenzt."},"B":{"text":"Resektion beenden, Spülung stoppen, Natrium langsam heben","rationale":"Ursache ist die Einschwemmung hypotoner Spülflüssigkeit über eröffnete Prostatasinus. Der erste und wirksamste Schritt ist, die Quelle zu schließen. Der Anstieg wird auf etwa 8 bis 10 mmol/l in 24 Stunden begrenzt, um eine osmotische Demyelinisierung zu vermeiden. Bei Volumenüberladung kommt ein Schleifendiuretikum hinzu, dazu intensivmedizinische Überwachung."},"C":{"text":"Resektion bis zur vollständigen Adenomentfernung fortsetzen","rationale":"Jede weitere Minute Spülung verschlechtert die Situation; ein Resttumoradenom kann später nachreseziert werden."},"D":{"text":"Freies Wasser und Volumen zur Kreislaufstabilisierung geben","rationale":"Damit wird die Hyponatriämie weiter verstärkt und das Hirnödem verschlimmert."}},"explanation":{"core":"Das TUR-Syndrom entsteht durch Resorption hypotoner, elektrolytfreier Spülflüssigkeit und äußert sich mit Verwirrtheit, Übelkeit, Sehstörungen, Hypertonie und Bradykardie. Risikofaktoren sind lange Resektionszeit, große Drüse, hoher Spüldruck und eröffnete Sinus. Die bipolare Resektion mit isotoner Kochsalzspülung vermeidet das Syndrom weitgehend und ist deshalb der bessere Ausgangspunkt.","teaching_point":"Erst die Spülung stoppen, dann das Natrium korrigieren, und dieses langsam."},"flag_note":null},"en":{"vignette":"During monopolar transurethral resection of the prostate lasting 85 minutes the patient under spinal anaesthesia becomes increasingly restless and confused, complains of nausea and visual disturbance. Blood pressure rises and heart rate falls to 48 per minute. Serum sodium is 116 mmol/l.","lead_in":"What should be done?","options":{"A":{"text":"Raise sodium into the normal range within a few hours","rationale":"Over-rapid correction can precipitate osmotic demyelination; the rise is limited to roughly 8 to 10 mmol/l over 24 hours."},"B":{"text":"Stop resecting, stop irrigation, raise sodium slowly","rationale":"The cause is absorption of hypotonic irrigation fluid through opened prostatic sinuses. The first and most effective step is closing the source. The rise is limited to roughly 8 to 10 mmol/l over 24 hours to avoid osmotic demyelination. A loop diuretic is added for fluid overload, together with intensive care monitoring."},"C":{"text":"Continue resecting until the adenoma is fully removed","rationale":"Every further minute of irrigation worsens the situation; residual adenoma can be resected later."},"D":{"text":"Give free water and volume to stabilise the circulation","rationale":"This further aggravates the hyponatraemia and worsens cerebral oedema."}},"explanation":{"core":"TUR syndrome arises from absorption of hypotonic, electrolyte-free irrigation fluid and presents with confusion, nausea, visual disturbance, hypertension and bradycardia. Risk factors are long resection time, large gland, high irrigation pressure and opened sinuses. Bipolar resection with isotonic saline largely avoids the syndrome and is therefore the better starting point.","teaching_point":"Stop the irrigation first, then correct the sodium, and correct it slowly."},"flag_note":null}}},{"id":"uro-ope-00019","version":1,"status":"published","taxonomy":{"subdomain":"Blutung nach PCNL","tags":["notfall","komplikationsmanagement","bildgebung","endourologisch"],"domain":"operativ"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Urolithiasis","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2029-09-06"},"content":{"de":{"vignette":"Zehn Tage nach perkutaner Nephrolitholapaxie stellt sich ein 57-jähriger Patient mit plötzlicher schwerer Makrohämaturie, Koagelabgang und Kreislaufreaktion vor. Der postoperative Verlauf war zunächst unauffällig, das Hämoglobin ist um 3 g/dl gefallen.","lead_in":"Was ist die wahrscheinlichste Ursache und die richtige Maßnahme?","options":{"A":{"text":"Diffuse Sickerblutung; Spülkatheter und Bettruhe genügen","rationale":"Eine früh auftretende Sickerblutung sistiert meist spontan. Eine schwere Blutung nach Tagen spricht für eine umschriebene Gefäßläsion."},"B":{"text":"Harnwegsinfekt mit hämorrhagischer Zystitis; Antibiose","rationale":"Der zeitliche Verlauf und die Kreislaufreaktion passen nicht; eine Zystitis erklärt keinen Hämoglobinabfall dieser Größenordnung."},"C":{"text":"Steinrezidiv mit Schleimhautverletzung; erneute Endoskopie","rationale":"Ein Rezidiv innerhalb von zehn Tagen ist unwahrscheinlich und verursacht keine massive Blutung."},"D":{"text":"Pseudoaneurysma oder Fistel; Angiographie und Embolisation","rationale":"Die verzögerte, plötzlich einsetzende schwere Blutung ist typisch. Die superselektive Embolisation stillt die Blutung und erhält den größten Teil des Parenchyms. Die verzögerte, plötzlich einsetzende schwere Blutung nach Tagen bis Wochen ist typisch für eine arterielle Läsion nach Punktion oder Dilatation. Die superselektive Embolisation stillt die Blutung und erhält den größten Teil des Parenchyms."}},"explanation":{"core":"Blutungen nach perkutaner Nephrolitholapaxie folgen zwei Mustern. Die frühe, venöse Blutung sistiert meist unter Bettruhe und Abklemmen der Nephrostomie. Die späte, arterielle Blutung nach Tagen bis Wochen weist auf Pseudoaneurysma oder arteriovenöse Fistel hin und verlangt Angiographie mit Embolisation. Der Zugang durch die Kelchspitze statt durch den Kelchhals senkt das Risiko von vornherein.","teaching_point":"Frühe Blutung venös und konservativ, späte Blutung arteriell und interventionell."},"flag_note":null},"en":{"vignette":"Ten days after percutaneous nephrolithotomy a 57-year-old man presents with sudden severe macroscopic haematuria, clot passage and a circulatory reaction. The early postoperative course had been uneventful; haemoglobin has fallen by 3 g/dl.","lead_in":"What is the most likely cause and the correct measure?","options":{"A":{"text":"Diffuse oozing; irrigation catheter and bed rest suffice","rationale":"Early oozing usually stops spontaneously. Severe bleeding after days points to a circumscribed vascular lesion."},"B":{"text":"Urinary infection with haemorrhagic cystitis; antibiotics","rationale":"The timing and circulatory reaction do not fit, and cystitis does not explain a haemoglobin drop of this magnitude."},"C":{"text":"Recurrent stone with mucosal injury; repeat endoscopy","rationale":"Recurrence within ten days is unlikely and does not cause massive bleeding."},"D":{"text":"Pseudoaneurysm or fistula; angiography and embolisation","rationale":"Delayed, sudden severe bleeding is typical. Superselective embolisation stops the bleeding and preserves most of the parenchyma. Delayed, sudden severe bleeding after days to weeks is typical of an arterial lesion following puncture or dilatation. Superselective embolisation stops the bleeding and preserves most of the parenchyma."}},"explanation":{"core":"Bleeding after percutaneous nephrolithotomy follows two patterns. Early venous bleeding usually stops with bed rest and clamping the nephrostomy. Late arterial bleeding after days to weeks indicates pseudoaneurysm or arteriovenous fistula and requires angiography with embolisation. Access through the calyceal tip rather than the infundibulum reduces the risk in the first place.","teaching_point":"Early bleeding venous and conservative, late bleeding arterial and interventional."},"flag_note":null}}},{"id":"uro-ope-00020","version":1,"status":"published","taxonomy":{"subdomain":"pelvine Lymphadenektomie","tags":["operationstechnik","komplikationsmanagement"],"domain":"operativ"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2029-09-06"},"content":{"de":{"vignette":"Bei der erweiterten pelvinen Lymphadenektomie wird der N. obturatorius auf der rechten Seite versehentlich vollständig durchtrennt. Der Defekt beträgt wenige Millimeter, die Enden liegen spannungsfrei nebeneinander.","lead_in":"Wie ist zu verfahren, und welcher Ausfall wäre sonst zu erwarten?","options":{"A":{"text":"Keine Maßnahme; der Nerv ist funktionell entbehrlich","rationale":"Der Ausfall führt zu einer Adduktorenschwäche mit unsicherem Gangbild und einer Sensibilitätsstörung an der Innenseite des Oberschenkels."},"B":{"text":"Ligatur beider Enden zur Vermeidung eines Neuroms","rationale":"Die Ligatur verhindert jede Regeneration und schafft genau das Defizit, das vermeidbar wäre."},"C":{"text":"Sofortige mikrochirurgische Naht in derselben Sitzung","rationale":"Die primäre Naht bei frischer, scharfer Durchtrennung ohne Spannung hat die besten Aussichten auf funktionelle Erholung. Ein späterer Eingriff wäre technisch schwieriger und weniger erfolgreich. Die spannungsfreie End-zu-End-Naht des Epineuriums bei frischer, scharfer Durchtrennung hat die besten Aussichten auf Erholung. Unbehandelt drohen Adduktorenschwäche und Sensibilitätsstörung an der Oberschenkelinnenseite."},"D":{"text":"Sekundäre Rekonstruktion mit Interponat nach drei Monaten","rationale":"Ein Interponat ist bei größeren Defekten oder verspäteter Diagnose nötig; hier wird die einfachere und bessere Primärversorgung verschenkt."}},"explanation":{"core":"Der N. obturatorius verläuft an der Beckenwand mitten durch das Ausräumungsgebiet der Fossa obturatoria und ist die am häufigsten verletzte Nervenstruktur dieses Eingriffs. Er wird vor Beginn der Ausräumung dargestellt und über den gesamten Verlauf im Blick behalten. Wird er dennoch durchtrennt und sofort erkannt, ist die primäre Naht die Behandlung der Wahl.","teaching_point":"Erst darstellen, dann ausräumen. Und wenn er doch durchtrennt ist, sofort nähen."},"flag_note":null},"en":{"vignette":"During extended pelvic lymph node dissection the obturator nerve on the right is inadvertently transected completely. The defect is a few millimetres and the ends lie adjacent without tension.","lead_in":"How should this be handled, and what deficit would otherwise be expected?","options":{"A":{"text":"No action; the nerve is functionally dispensable","rationale":"Loss causes adductor weakness with an unsteady gait and sensory loss on the medial thigh."},"B":{"text":"Ligate both ends to prevent neuroma formation","rationale":"Ligation prevents any regeneration and creates exactly the deficit that could have been avoided."},"C":{"text":"Immediate microsurgical repair in the same session","rationale":"Primary repair of a fresh, sharp, tension-free transection offers the best prospect of functional recovery. A later procedure would be technically harder and less successful. Tension-free end-to-end epineural repair of a fresh, sharp transection offers the best prospect of recovery. Untreated, adductor weakness and medial thigh sensory loss are to be expected."},"D":{"text":"Secondary reconstruction with a graft after three months","rationale":"A graft is needed for larger defects or delayed diagnosis; here the simpler and better primary repair is squandered."}},"explanation":{"core":"The obturator nerve runs along the pelvic sidewall through the middle of the obturator fossa dissection field and is the nerve most often injured in this operation. It is exposed before dissection begins and kept in view throughout. If it is nevertheless transected and recognised at once, primary repair is the treatment of choice.","teaching_point":"Expose first, then dissect. And if it is cut, repair it immediately."},"flag_note":null}}}]};</script>
<script>
(function () {
  'use strict';
  var KEY = 'urofragen.progress.v1';
  var CODE_KEY = 'urofragen.code.v1';

  /* ---------- localStorage (Standard) ---------- */

  function LocalProgressStore() {
    this.state = this._load();
  }

  LocalProgressStore.prototype._load = function () {
    try {
      var raw = window.localStorage.getItem(KEY);
      if (!raw) return { answers: {} };
      var parsed = JSON.parse(raw);
      return parsed && parsed.answers ? parsed : { answers: {} };
    } catch (e) {
      return { answers: {} };
    }
  };

  LocalProgressStore.prototype._save = function () {
    try {
      window.localStorage.setItem(KEY, JSON.stringify(this.state));
    } catch (e) {
      /* Privater Modus oder voller Speicher: Sitzung laeuft weiter, nichts wird persistiert. */
    }
  };

  LocalProgressStore.prototype.recordAnswer = function (event) {
    this.state.answers[event.questionId] = {
      domain: event.domain,
      version: event.questionVersion,
      correct: event.correct,
      selected: event.selected,
      lastSeen: new Date().toISOString()
    };
    this._save();
    return Promise.resolve();
  };

  LocalProgressStore.prototype.getDomainProgress = function () {
    var out = {};
    var answers = this.state.answers;
    for (var id in answers) {
      if (!Object.prototype.hasOwnProperty.call(answers, id)) continue;
      var a = answers[id];
      if (!out[a.domain]) out[a.domain] = { seen: 0, correct: 0 };
      out[a.domain].seen += 1;
      if (a.correct) out[a.domain].correct += 1;
    }
    return Promise.resolve(out);
  };

  LocalProgressStore.prototype.getAnswered = function () {
    return Promise.resolve(new Set(Object.keys(this.state.answers)));
  };

  LocalProgressStore.prototype.reset = function () {
    this.state = { answers: {} };
    this._save();
    return Promise.resolve();
  };

  window.LocalProgressStore = LocalProgressStore;
})();

</script>
<script>
(function () {

  var UI = {

      intro: 'Fallbasierte Fragen auf Facharztniveau. Jede Antwortoption ist begründet, jede Frage nennt ihre Quelle und ihr Überprüfungsdatum. Der Lernfortschritt bleibt in diesem Browser.',
      inventory: function (n, d) { return n + ' Fragen in ' + d + ' Gebieten'; },
      questions: 'Fragen',

      mixedSession: 'Gemischte Sitzung',

      question: function (i, n) { return 'Frage ' + i + ' von ' + n; },

      resetConfirm: 'Gesamten Lernfortschritt löschen?',
      legend: function () {
        return '⚠ markiert Fragen zu Themen mit uneinheitlicher Datenlage oder ohne randomisierte Bestätigung.';
      },
      evidence: 'Evidenz',
      yourAnswer: 'Ihre Antwort',
      correctAnswer: 'Richtige Antwort',

      sheetResult: 'Ergebnis',

      disclaimer: 'Lehrmaterial. Keine Handlungsanweisung für die Behandlung einzelner Patienten. Arzneimitteldosierungen sind vor jeder Anwendung gegen die Fachinformation zu prüfen.'
    },
    en: {
      intro: 'Case-based questions at board level. Every answer option is explained, every question states its source and review date. Your progress stays in this browser.',
      inventory: function (n, d) { return n + ' questions across ' + d + ' areas'; },
      questions: 'questions',
      empty: 'in preparation',
      allEntities: 'all entities',
      mixed: 'Mixed session across all areas',
      mixedSession: 'Mixed session',
      progress: function (s, t, c) { return s + ' of ' + t + ' done, ' + c + ' correct'; },
      question: function (i, n) { return 'Question ' + i + ' of ' + n; },
      next: 'Next question',
      back: 'Back',
      finish: 'See results',
      stop: 'End session',
      score: function (c, t) { return c + ' of ' + t + ' correct'; },
      repeat: 'Retry incorrect',
      home: 'Back to overview',
      printPdf: 'Print as PDF',
      download: 'Save as file',
      reset: 'Clear progress',
      resetConfirm: 'Clear all stored progress?',
      legend: function () {
        return '⚠ marks questions on topics with inconsistent evidence or without randomised confirmation.';
      },
      evidence: 'Evidence',
      yourAnswer: 'Your answer',
      correctAnswer: 'Correct answer',
      sheetTitle: 'Result',
      sheetDate: 'Date',
      sheetArea: 'Area',
      sheetResult: 'Score',
      stand: 'Questions as of',
      disclaimer: 'Teaching material for board exam preparation. Not a treatment instruction for individual patients. Verify all drug doses against the current product information before use.'
    }
  };

  var LANG_KEY = 'urofragen.lang.v1';
  var root = document.getElementById('app');
  var inventoryEl = document.getElementById('inventory');
  var langBox = document.getElementById('lang');
  var store = new window.LocalProgressStore();

  var bank = window.QUESTION_BANK;
  var pool = [];
  var counts = {};
  var session = null;
  var lang = readLang();
  var t = UI[lang];

  function readLang() {
    var saved = null;
    try { saved = window.localStorage.getItem(LANG_KEY); } catch (e) { /* egal */ }
    if (saved === 'de' || saved === 'en') return saved;
    var nav = (window.navigator && window.navigator.language) || 'de';
    return nav.indexOf('de') === 0 ? 'de' : 'en';
  }

  function setLang(next) {
    lang = next;
    t = UI[lang];
    try { window.localStorage.setItem(LANG_KEY, next); } catch (e) { /* egal */ }
    document.documentElement.lang = next;
    renderLangSwitch();
    updateInventory();
    if (session) renderQuestion(); else renderHome();
  }

  function el(tag, className, text) {
    var n = document.createElement(tag);
    if (className) n.className = className;
    if (text != null) n.textContent = text;
    return n;
  }

  function shuffle(list) {
    var a = list.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var x = a[i]; a[i] = a[j]; a[j] = x;
    }
    return a;
  }

  function isLive(q) {
    if (q.status !== 'published') return false;
    var e = q.review && q.review.expires;
    return e ? new Date(e) >= new Date() : false;
  }

  /* Sprachabhängige Textfelder. Fällt auf Deutsch zurück, falls eine Übersetzung fehlt. */
  function c(q) { return (q.content && (q.content[lang] || q.content.de)) || {}; }
  function label(obj) { return (obj && (obj[lang] || obj.de)) || ''; }

  function domainOf(slug) {
    return bank.domains.filter(function (d) { return d.slug === slug; })[0];
  }
  function domainLabel(slug) {
    var d = domainOf(slug);
    return d ? label(d.label) : slug;
  }
  function optionByKey(q, key) {
    return q.options.filter(function (o) { return o.key === key; })[0];
  }

  function questionsOf(slug) {
    return pool.filter(function (q) { return q.taxonomy.domain === slug; });
  }

  function sourceLine(q) {
    return q.sources.map(function (s) {
      var p = [];
      if (s.title) p.push(s.title);
      if (s.citation) p.push(s.citation);
      if (s.code) p.push(s.code);
      if (s.version) p.push('Version ' + s.version);
      if (s.year) p.push(String(s.year));
      if (s.section) p.push('Abschnitt ' + s.section);
      return p.join(', ');
    }).join(' · ');
  }

  /* ---------- Kopf ---------- */

  function renderLangSwitch() {
    langBox.innerHTML = '';
    ['de', 'en'].forEach(function (code) {
      var b = el('button', code === lang ? 'on' : null, code.toUpperCase());
      b.type = 'button';
      b.setAttribute('aria-pressed', code === lang ? 'true' : 'false');
      b.addEventListener('click', function () { if (code !== lang) setLang(code); });
      langBox.appendChild(b);
    });
  }

  function updateInventory() {
    var withContent = bank.domains.filter(function (d) { return counts[d.slug] > 0; }).length;
    inventoryEl.textContent = t.inventory(pool.length, withContent) + ' · ' + t.stand + ' ' + bank.generated;
  }

  /* ---------- Übersicht ---------- */

  function renderHome() {
    session = null;
    store.getDomainProgress().then(function (progress) {
      root.innerHTML = '';
      root.appendChild(el('p', 'intro', t.intro));

      var board = el('div', 'board');

      function row(domain, nested) {
        var count = counts[domain.slug];
        var open = count > 0;
        var done = progress[domain.slug] || { seen: 0, correct: 0 };

        var btn = el('button', 'domain' + (open ? '' : ' locked') + (nested ? ' nested' : ''));
        btn.type = 'button';
        btn.disabled = !open;

        var head = el('div', 'domain-head');
        head.appendChild(el('span', 'domain-name', label(domain.label)));
        head.appendChild(el('span', 'domain-count', open ? count + ' ' + t.questions : t.empty));
        btn.appendChild(head);
        if (domain.hint) btn.appendChild(el('div', 'domain-hint', label(domain.hint)));

        if (open && done.seen > 0) {
          var bar = el('div', 'bar');
          var fill = el('span');
          fill.style.width = Math.min(100, Math.round((done.seen / count) * 100)) + '%';
          bar.appendChild(fill);
          btn.appendChild(bar);
          btn.appendChild(el('div', 'domain-hint', t.progress(done.seen, count, done.correct)));
        }

        if (open) {
          btn.addEventListener('click', function () {
            startSession(domain.slug, questionsOf(domain.slug));
          });
        }
        return btn;
      }

      (bank.groups || []).forEach(function (group) {
        var members = bank.domains.filter(function (d) { return d.group === group.slug; });
        if (!members.length) return;

        var total = 0;
        members.forEach(function (m) { total += counts[m.slug]; });

        var head = el('button', 'domain group' + (total ? '' : ' locked'));
        head.type = 'button';
        head.disabled = !total;
        var hr = el('div', 'domain-head');
        hr.appendChild(el('span', 'domain-name', label(group.label)));
        hr.appendChild(el('span', 'domain-count',
          total ? total + ' ' + t.questions + ', ' + t.allEntities : t.empty));
        head.appendChild(hr);
        if (total) {
          head.addEventListener('click', function () {
            var all = [];
            members.forEach(function (m) { all = all.concat(questionsOf(m.slug)); });
            startSession(null, all);
          });
        }
        board.appendChild(head);
        members.forEach(function (m) { board.appendChild(row(m, true)); });
      });

      bank.domains.forEach(function (d) {
        if (!d.group) board.appendChild(row(d, false));
      });

      root.appendChild(board);

      var populated = bank.domains.filter(function (d) { return counts[d.slug] > 0; });
      if (populated.length > 1) {
        var all = [];
        populated.forEach(function (d) { all = all.concat(questionsOf(d.slug)); });
        var mixed = el('button', 'btn', t.mixed);
        mixed.type = 'button';
        mixed.style.marginTop = '1.75rem';
        mixed.addEventListener('click', function () { startSession(null, all); });
        root.appendChild(mixed);
      }

      root.appendChild(el('div', 'legend', t.legend()));

      var reset = el('button', 'btn quiet', t.reset);
      reset.type = 'button';
      reset.style.marginTop = '1.25rem';
      reset.addEventListener('click', function () {
        if (window.confirm(t.resetConfirm)) store.reset().then(renderHome);
      });
      root.appendChild(reset);

      root.appendChild(el('div', 'footnote', t.disclaimer));
    });
  }

  /* ---------- Sitzung ---------- */

  function pick(questions, size) {
    return store.getAnswered().then(function (answered) {
      var fresh = shuffle(questions.filter(function (q) { return !answered.has(q.id); }));
      if (fresh.length >= size) return fresh.slice(0, size);
      var rest = shuffle(questions.filter(function (q) { return answered.has(q.id); }));
      return fresh.concat(rest).slice(0, size);
    });
  }

  function startSession(slug, questions) {
    pick(questions, bank.session_size).then(function (items) {
      if (!items.length) { renderHome(); return; }
      session = {
        domain: slug,
        items: items,
        index: 0,
        given: new Array(items.length).fill(null),
        /* Anzeigereihenfolge der Optionen, pro Frage einmal gewuerfelt und dann stabil.
           Verhindert, dass man sich beim Wiederholen die Position statt der Sache merkt. */
        order: items.map(function (q) { return shuffle(q.options.map(function (o) { return o.key; })); }),
        startedAt: new Date()
      };
      renderQuestion();
      window.scrollTo(0, 0);
    });
  }

  function answeredCount() {
    return session.given.filter(function (g) { return g; }).length;
  }

  function renderQuestion() {
    var q = session.items[session.index];
    var body = c(q);
    var given = session.given[session.index];
    var shownAt = Date.now();

    root.innerHTML = '';

    var bar = el('div', 'session-bar');
    bar.appendChild(el('span', null, session.domain ? domainLabel(session.domain) : domainLabel(q.taxonomy.domain)));
    bar.appendChild(el('span', null, t.question(session.index + 1, session.items.length)));
    root.appendChild(bar);

    /* Navigationsleiste: zeigt den Stand und erlaubt den Sprung zurück. */
    var strip = el('div', 'navstrip');
    session.items.forEach(function (item, i) {
      var g = session.given[i];
      var cls = i === session.index ? 'here' : g ? (g.correct ? 'done-ok' : 'done-no') : null;
      var b = el('button', cls, String(i + 1));
      b.type = 'button';
      b.setAttribute('aria-label', t.question(i + 1, session.items.length));
      /* Vorwärts nur bis zur ersten unbeantworteten Frage. */
      var reachable = i <= session.index || session.given[i] !== null;
      b.disabled = !reachable;
      b.addEventListener('click', function () {
        if (i === session.index) return;
        session.index = i;
        renderQuestion();
        window.scrollTo(0, 0);
      });
      strip.appendChild(b);
    });
    root.appendChild(strip);

    var card = el('div', 'card');
    card.appendChild(el('p', 'vignette', body.vignette));
    card.appendChild(el('p', 'lead-in', body.lead_in));

    var list = el('div', 'options');
    var buttons = {};
    var order = session.order[session.index];

    order.forEach(function (key, pos) {
      var opt = optionByKey(q, key);
      var text = (body.options && body.options[key]) || {};
      var letter = String.fromCharCode(65 + pos);
      var b = el('button', 'option');
      b.type = 'button';
      b.appendChild(el('span', 'key', letter));
      var inner = el('span');
      inner.appendChild(el('span', null, text.text));
      b.appendChild(inner);
      b.addEventListener('click', function () {
        if (session.given[session.index]) return;
        session.given[session.index] = { key: key, letter: letter, correct: !!opt.correct };
        store.recordAnswer({
          questionId: q.id,
          questionVersion: q.version,
          domain: q.taxonomy.domain,
          selected: key,
          correct: !!opt.correct,
          msSpent: Date.now() - shownAt
        });
        reveal(q, body, buttons, card);
      });
      buttons[key] = { button: b, inner: inner, option: opt, text: text, letter: letter };
      list.appendChild(b);
    });

    card.appendChild(list);
    root.appendChild(card);

    if (given) reveal(q, body, buttons, card);
  }

  function reveal(q, body, buttons, card) {
    var given = session.given[session.index];

    Object.keys(buttons).forEach(function (key) {
      var e = buttons[key];
      e.button.disabled = true;
      if (e.option.correct) e.button.classList.add('is-correct');
      else if (key === given.key) e.button.classList.add('is-wrong');
      if (e.option.correct || key === given.key) {
        e.inner.appendChild(el('span', 'rationale', e.text.rationale));
      }
    });

    var explain = el('div', 'explain');

    if (q.evidence && q.evidence.flag) {
      explain.appendChild(el('p', 'flagline',
        '⚠ ' + t.evidence + ': ' + q.evidence.certainty + ' — ' + (body.flag_note || '')));
    }

    explain.appendChild(el('p', null, body.explanation.core));
    if (body.explanation.teaching_point) {
      explain.appendChild(el('p', 'teaching', body.explanation.teaching_point));
    }
    explain.appendChild(el('p', 'sourceline', sourceLine(q)));

    var actions = el('div', 'actions');

    if (session.index > 0) {
      var back = el('button', 'btn ghost', t.back);
      back.type = 'button';
      back.addEventListener('click', function () {
        session.index -= 1;
        renderQuestion();
        window.scrollTo(0, 0);
      });
      actions.appendChild(back);
    }

    var last = session.index === session.items.length - 1;
    var next = el('button', 'btn', last ? t.finish : t.next);
    next.type = 'button';
    next.addEventListener('click', function () {
      if (last) { renderResult(); return; }
      session.index += 1;
      renderQuestion();
      window.scrollTo(0, 0);
    });
    actions.appendChild(next);

    if (!last) {
      var stop = el('button', 'btn quiet', t.stop);
      stop.type = 'button';
      stop.addEventListener('click', renderResult);
      actions.appendChild(stop);
    }

    explain.appendChild(actions);
    card.appendChild(explain);
    next.focus();
  }

  /* ---------- Auswertung ---------- */

  function answeredItems() {
    var out = [];
    session.items.forEach(function (q, i) {
      if (session.given[i]) out.push({ question: q, given: session.given[i], order: session.order[i] });
    });
    return out;
  }

  function renderResult() {
    var done = answeredItems();
    var correct = done.filter(function (a) { return a.given.correct; }).length;

    root.innerHTML = '';
    root.appendChild(el('p', 'score', t.score(correct, done.length)));
    root.appendChild(el('p', 'score-note',
      session.domain ? domainLabel(session.domain) : t.mixedSession));

    var list = el('div', 'review-list');
    done.forEach(function (a) {
      var item = el('div', 'review-item');
      item.appendChild(el('span', 'mark ' + (a.given.correct ? 'ok' : 'no'), a.given.correct ? '✓' : '✕'));
      var b = el('div');
      b.appendChild(el('div', 'stem', c(a.question).lead_in));
      b.appendChild(el('div', 'meta', domainLabel(a.question.taxonomy.domain) + ' · ' + a.question.id));
      item.appendChild(b);
      list.appendChild(item);
    });
    root.appendChild(list);

    var actions = el('div', 'actions');

    var pdf = el('button', 'btn', t.printPdf);
    pdf.type = 'button';
    pdf.addEventListener('click', function () { printSheet(done, correct); });
    actions.appendChild(pdf);

    var dl = el('button', 'btn ghost', t.download);
    dl.type = 'button';
    dl.addEventListener('click', function () { downloadSheet(done, correct); });
    actions.appendChild(dl);

    var wrong = done.filter(function (a) { return !a.given.correct; })
      .map(function (a) { return a.question; });

    if (wrong.length) {
      var again = el('button', 'btn ghost', t.repeat);
      again.type = 'button';
      again.addEventListener('click', function () {
        var items = shuffle(wrong);
        session = {
          domain: session.domain, items: items, index: 0,
          given: new Array(items.length).fill(null),
          order: items.map(function (q) { return shuffle(q.options.map(function (o) { return o.key; })); }),
          startedAt: new Date()
        };
        renderQuestion();
        window.scrollTo(0, 0);
      });
      actions.appendChild(again);
    }

    var home = el('button', 'btn quiet', t.home);
    home.type = 'button';
    home.addEventListener('click', function () { renderHome(); window.scrollTo(0, 0); });
    actions.appendChild(home);

    root.appendChild(actions);
    root.appendChild(el('div', 'footnote', t.disclaimer));
  }

  /* ---------- Ergebnis als Datei ---------- */

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function sheetHtml(done, correct) {
    var when = new Date();
    var area = session.domain ? domainLabel(session.domain) : t.mixedSession;

    var p = [];
    p.push('<!DOCTYPE html><html lang="' + lang + '"><head><meta charset="utf-8">');
    p.push('<title>' + esc(t.sheetTitle) + ' — ' + esc(area) + ' — ' + when.toISOString().slice(0, 10) + '</title>');
    p.push('<style>' +
      '@page{size:A4;margin:18mm 16mm}' +
      'body{font-family:Georgia,"Times New Roman",serif;max-width:44rem;margin:2rem auto;padding:0 1.5rem;color:#17201c;line-height:1.55;font-size:11.5pt}' +
      'h1{font-size:1.25rem;margin:0 0 .2rem}' +
      '.meta{color:#555f59;font-size:.85em;margin-bottom:1.8rem;padding-bottom:.8rem;border-bottom:1px solid #d9ded8}' +
      '.q{border-bottom:1px solid #e8ebe6;padding:1rem 0;break-inside:avoid;page-break-inside:avoid}' +
      '.qhead{color:#646d68;font-size:.78em;margin-bottom:.35rem}' +
      '.lead{font-weight:bold;margin:.5rem 0}' +
      '.opt{margin:.15rem 0 .15rem 1.1rem}' +
      '.ok{color:#1e5b3e}.no{color:#8c2f2a}' +
      '.rat{color:#646d68;font-size:.85em;margin:0 0 .3rem 2.2rem}' +
      '.note{color:#646d68;font-size:.85em}' +
      '.flag{color:#8a5e14}' +
      '.tp{font-style:italic;border-left:2px solid #2e4b7a;padding-left:.7rem;margin:.5rem 0}' +
      'footer{margin-top:2rem;border-top:1px solid #d9ded8;padding-top:.8rem;font-size:.78em;color:#646d68}' +
      '@media print{body{margin:0;max-width:none}}' +
      '</style></head><body>');
    p.push('<h1>Facharztfragen Urologie — ' + esc(t.sheetTitle) + '</h1>');
    p.push('<div class="meta">' +
      esc(t.sheetDate) + ': ' + esc(when.toLocaleString()) + '<br>' +
      esc(t.sheetArea) + ': ' + esc(area) + '<br>' +
      esc(t.sheetResult) + ': ' + correct + ' / ' + done.length + '</div>');

    done.forEach(function (a, i) {
      var q = a.question;
      var body = c(q);
      var order = a.order;
      var rightLetter = '';
      p.push('<div class="q">');
      p.push('<div class="qhead">' + (i + 1) + ' · ' + esc(domainLabel(q.taxonomy.domain)) +
        ' · ' + esc(q.id) + ' · ' + (a.given.correct ? '✓' : '✕') + '</div>');
      p.push('<p>' + esc(body.vignette) + '</p>');
      p.push('<p class="lead">' + esc(body.lead_in) + '</p>');
      order.forEach(function (key, pos) {
        var o = optionByKey(q, key);
        var letter = String.fromCharCode(65 + pos);
        if (o.correct) rightLetter = letter;
        var txt = (body.options && body.options[key]) || {};
        var mark = o.correct ? '✓' : (key === a.given.key ? '✕' : '·');
        var cls = o.correct ? 'ok' : (key === a.given.key ? 'no' : '');
        p.push('<div class="opt ' + cls + '">' + mark + ' ' + esc(letter) + ') ' + esc(txt.text) + '</div>');
        if (o.correct || key === a.given.key) {
          p.push('<div class="rat">' + esc(txt.rationale) + '</div>');
        }
      });
      p.push('<p class="note">' + esc(t.yourAnswer) + ': ' + esc(a.given.letter) +
        ' · ' + esc(t.correctAnswer) + ': ' + esc(rightLetter) + '</p>');
      if (q.evidence && q.evidence.flag) {
        p.push('<p class="flag">⚠ ' + esc(t.evidence) + ': ' + esc(q.evidence.certainty) +
          ' — ' + esc(body.flag_note) + '</p>');
      }
      p.push('<p>' + esc(body.explanation.core) + '</p>');
      if (body.explanation.teaching_point) {
        p.push('<p class="tp">' + esc(body.explanation.teaching_point) + '</p>');
      }
      p.push('<p class="note">' + esc(sourceLine(q)) + '</p>');
      p.push('</div>');
    });

    p.push('<footer>' + esc(t.disclaimer) + '</footer>');
    p.push('</body></html>');
    return p.join('\n');
  }

  function sheetName() {
    var slug = (session.domain || 'gemischt').replace(/[^a-z0-9]+/gi, '-');
    return 'urofragen-' + slug + '-' + new Date().toISOString().slice(0, 10);
  }

  /* Druckt über ein verstecktes Fenster. Im Druckdialog steht bei jedem Browser
     "Als PDF speichern" bzw. "Save as PDF" zur Verfügung. */
  function printSheet(done, correct) {
    var html = sheetHtml(done, correct);
    var frame = document.createElement('iframe');
    frame.setAttribute('aria-hidden', 'true');
    frame.style.position = 'fixed';
    frame.style.right = '0';
    frame.style.bottom = '0';
    frame.style.width = '0';
    frame.style.height = '0';
    frame.style.border = '0';
    document.body.appendChild(frame);

    var win = frame.contentWindow;
    try {
      win.document.open();
      win.document.write(html);
      win.document.close();
      win.focus();
      setTimeout(function () {
        try { win.print(); } catch (e) { openInTab(html); }
        setTimeout(function () {
          if (frame.parentNode) document.body.removeChild(frame);
        }, 2000);
      }, 250);
    } catch (e) {
      if (frame.parentNode) document.body.removeChild(frame);
      openInTab(html);
    }
  }

  /* Rückfalllösung, etwa wenn der Browser das Drucken aus einem Rahmen sperrt. */
  function openInTab(html) {
    var tab = window.open('', '_blank');
    if (!tab) { downloadBlob(html); return; }
    tab.document.open();
    tab.document.write(html);
    tab.document.close();
  }

  function downloadBlob(html) {
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = sheetName() + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function downloadSheet(done, correct) {
    downloadBlob(sheetHtml(done, correct));
  }

  /* ---------- Start ---------- */

  pool = bank.questions.filter(isLive);
  bank.domains.forEach(function (d) { counts[d.slug] = questionsOf(d.slug).length; });

  document.documentElement.lang = lang;
  renderLangSwitch();
  updateInventory();
  renderHome();
})();

</script>
