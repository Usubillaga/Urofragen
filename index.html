siko beschränkt; in der günstigen Gruppe war sie der Vergleichstherapie nicht überlegen."},"B":{"text":"Kombination aus Checkpointinhibitor und Tyrosinkinasehemmer","rationale":"Die IO/TKI-Kombinationen sind unabhängig vom IMDC-Risiko zugelassen und zeigten auch in der günstigen Gruppe hohe Ansprechraten. Zugelassen und hier passend ist etwa Pembrolizumab 200 mg alle drei Wochen plus Axitinib 2 × 5 mg täglich. Diese Kombinationen sind unabhängig vom IMDC-Risiko zugelassen."},"C":{"text":"Bei günstigem Risiko keine systemische Therapie beginnen","rationale":"Eine zeitlich begrenzte aktive Überwachung ist bei asymptomatischer, langsam wachsender Erkrankung eine erwogene Option, aber kein grundsätzlicher Therapieverzicht."},"D":{"text":"Sunitinib-Monotherapie als Standard bei günstigem Risiko","rationale":"Sunitinib ist inzwischen Vergleichsarm, nicht Standard; die Kombinationen sind ihm in Ansprechrate und progressionsfreiem Überleben überlegen."}},"explanation":{"core":"Das IMDC-Risikoprofil steuert beim metastasierten Nierenzellkarzinom nicht nur die Prognose, sondern die Zulassungsgrenzen. Die duale Immuntherapie ist an intermediäres oder ungünstiges Risiko gebunden, die IO/TKI-Kombinationen sind es nicht. Wer das Risiko nicht bestimmt, kann die Zulassung nicht prüfen.","teaching_point":"IMDC-Score vor der Therapieentscheidung berechnen, nicht danach."},"flag_note":null},"en":{"vignette":"62-year-old man with synchronous metastatic clear cell renal cell carcinoma, two pulmonary lesions, ECOG 0, diagnosed two months ago, with haemoglobin, calcium, neutrophils and platelets all within range. The IMDC profile is favourable risk.","lead_in":"Which statement about first-line therapy is correct?","options":{"A":{"text":"Ipilimumab plus nivolumab regardless of IMDC risk","rationale":"The approval of this combination in renal cell carcinoma is limited to intermediate and poor IMDC risk; in the favourable group it was not superior to the comparator."},"B":{"text":"A checkpoint inhibitor plus tyrosine kinase inhibitor","rationale":"IO/TKI combinations are approved irrespective of IMDC risk and showed high response rates in the favourable group as well. Approved and appropriate here is pembrolizumab 200 mg every three weeks plus axitinib 5 mg twice daily. These combinations are approved irrespective of IMDC risk."},"C":{"text":"No systemic therapy at all in favourable risk disease","rationale":"A period of active surveillance is a considered option in asymptomatic, slow-growing disease, but this is not a general withholding of treatment."},"D":{"text":"Sunitinib monotherapy as standard in favourable risk","rationale":"Sunitinib is now the comparator arm, not the standard; the combinations are superior in response rate and progression-free survival."}},"explanation":{"core":"In metastatic renal cell carcinoma the IMDC profile governs not only prognosis but the boundaries of the marketing authorisations. Dual immunotherapy is tied to intermediate or poor risk; IO/TKI combinations are not. Without determining the risk you cannot check the label.","teaching_point":"Calculate the IMDC score before the treatment decision, not after."},"flag_note":null}}},{"id":"uro-rcc-00003","version":1,"status":"published","taxonomy":{"subdomain":"Sammelrohrkarzinom","tags":["pathologie","pharmakologie","dosierung","leitlinie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"54-jähriger Patient mit einem zentral im Nierenmark gelegenen, infiltrativ wachsenden Tumor und ausgedehnter retroperitonealer Lymphadenopathie sowie Lungenmetastasen. Histologie: Sammelrohrkarzinom vom Bellini-Typ mit desmoplastischer Stromareaktion. ECOG 1, GFR 78 ml/min.","lead_in":"Welche Systemtherapie ist angezeigt?","options":{"A":{"text":"Ipilimumab plus Nivolumab wie beim klarzelligen Karzinom","rationale":"Die Zulassung und die Datenlage der dualen Immuntherapie beziehen sich auf das klarzellige Karzinom; beim Sammelrohrkarzinom fehlt der Wirksamkeitsnachweis."},"B":{"text":"Sunitinib als VEGF-gerichtete Monotherapie geben","rationale":"Die Ansprechraten der Tyrosinkinasehemmer sind bei diesem Subtyp niedrig und rechtfertigen den Verzicht auf die Chemotherapie nicht."},"C":{"text":"Platinbasierte Chemotherapie wie beim Urothelkarzinom","rationale":"Das Sammelrohrkarzinom entstammt dem distalen Nephron und teilt Verhalten und Chemotherapiesensibilität mit dem Urothelkarzinom. Konkret etwa Gemcitabin 1000 mg/m² an den Tagen 1 und 8 mit Cisplatin 70 mg/m² an Tag 1, alle drei Wochen. Der Tumor entstammt dem distalen Nephron und verhält sich entsprechend."},"D":{"text":"Aktive Überwachung wegen der schlechten Prognose","rationale":"Der aggressive Verlauf verlangt eine rasche Therapie, keine Beobachtung."}},"explanation":{"core":"Der histologische Subtyp entscheidet beim Nierenzellkarzinom über die gesamte Systemtherapie. Das Sammelrohrkarzinom und das eng verwandte medulläre Karzinom stammen aus dem distalen Nephron und werden platinbasiert chemotherapiert, während Checkpointinhibitoren und Tyrosinkinasehemmer beim klarzelligen Karzinom ihren Platz haben.","teaching_point":"Sammelrohrkarzinom heißt Chemotherapie, nicht Checkpointinhibition."},"flag_note":null},"en":{"vignette":"54-year-old man with an infiltrative tumour centred in the renal medulla, extensive retroperitoneal lymphadenopathy and pulmonary metastases. Histology: collecting duct (Bellini) carcinoma with desmoplastic stromal reaction. ECOG 1, GFR 78 ml/min.","lead_in":"Which systemic therapy is indicated?","options":{"A":{"text":"Ipilimumab plus nivolumab as in clear cell carcinoma","rationale":"The approval and the evidence for dual immunotherapy relate to clear cell carcinoma; in collecting duct carcinoma efficacy is unproven."},"B":{"text":"Sunitinib as VEGF-directed monotherapy","rationale":"Response rates to tyrosine kinase inhibitors are low in this subtype and do not justify omitting chemotherapy."},"C":{"text":"Platinum-based chemotherapy as in urothelial carcinoma","rationale":"Collecting duct carcinoma arises from the distal nephron and shares behaviour and chemosensitivity with urothelial carcinoma. Specifically gemcitabine 1000 mg/m² on days 1 and 8 with cisplatin 70 mg/m² on day 1, every three weeks. The tumour arises from the distal nephron and behaves accordingly."},"D":{"text":"Active surveillance because of the poor prognosis","rationale":"The aggressive course demands prompt treatment, not observation."}},"explanation":{"core":"Histological subtype determines the entire systemic strategy in renal cell carcinoma. Collecting duct carcinoma and the closely related medullary carcinoma arise from the distal nephron and are treated with platinum-based chemotherapy, whereas checkpoint inhibitors and tyrosine kinase inhibitors have their place in clear cell disease.","teaching_point":"Collecting duct carcinoma means chemotherapy, not checkpoint inhibition."},"flag_note":null}}},{"id":"uro-rcc-00004","version":1,"status":"published","taxonomy":{"subdomain":"medulläres Nierenkarzinom","tags":["pathologie","labordiagnostik","pharmakologie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"23-jähriger Patient mit Makrohämaturie und Flankenschmerz. Im CT ein zentraler, infiltrativer Nierentumor rechts mit Lymphknoten- und Lebermetastasen. In der Anamnese eine bekannte Sichelzell-Merkmalsträgerschaft. Die Immunhistochemie zeigt einen Verlust der INI1-Expression.","lead_in":"Um welche Entität handelt es sich und wie wird behandelt?","options":{"A":{"text":"Klarzelliges Karzinom; Checkpointinhibitor plus TKI","rationale":"Weder Alter noch Wachstumsmuster noch der INI1-Verlust passen zum klarzelligen Karzinom."},"B":{"text":"Medulläres Karzinom; platinbasierte Chemotherapie","rationale":"Die Trias aus jungem Alter, Sichelzell-Merkmal und Verlust von SMARCB1 beziehungsweise INI1 ist charakteristisch. Der Tumor spricht auf Platin an, nicht auf zielgerichtete oder Checkpointtherapie. Die Trias aus jungem Alter, Sichelzell-Merkmalsträgerschaft und Verlust von SMARCB1 beziehungsweise INI1 ist charakteristisch und schließt die anderen Entitäten aus."},"C":{"text":"Papilläres Karzinom Typ 2; Therapie mit Cabozantinib","rationale":"Der INI1-Verlust und die Assoziation zur Hämoglobinopathie schließen diese Zuordnung aus."},"D":{"text":"Nierenlymphom; rituximabhaltige Immunchemotherapie","rationale":"Die Immunhistochemie belegt einen epithelialen Tumor mit INI1-Verlust und kein lymphatisches Infiltrat."}},"explanation":{"core":"Das medulläre Nierenkarzinom tritt fast ausschließlich bei Trägern des Sichelzell-Merkmals auf, betrifft junge Patienten und ist definiert durch den Verlust von SMARCB1. Es verhält sich wie das Sammelrohrkarzinom, aus dem es abzugrenzen ist, und wird ebenfalls platinbasiert behandelt.","teaching_point":"Junger Patient, Sichelzell-Merkmal, zentraler Nierentumor: nach INI1 fragen."},"flag_note":null},"en":{"vignette":"23-year-old man with macroscopic haematuria and flank pain. CT shows a central infiltrative right renal tumour with nodal and hepatic metastases. He is a known sickle cell trait carrier. Immunohistochemistry shows loss of INI1 expression.","lead_in":"Which entity is this and how is it treated?","options":{"A":{"text":"Clear cell carcinoma; checkpoint inhibitor plus TKI","rationale":"Neither age nor growth pattern nor the INI1 loss fits clear cell carcinoma."},"B":{"text":"Renal medullary carcinoma; platinum chemotherapy","rationale":"The triad of young age, sickle cell trait and loss of SMARCB1 or INI1 is characteristic. The tumour responds to platinum, not to targeted or checkpoint therapy. The triad of young age, sickle cell trait and loss of SMARCB1 or INI1 is characteristic and excludes the other entities."},"C":{"text":"Papillary carcinoma type 2; treatment with cabozantinib","rationale":"INI1 loss and the association with a haemoglobinopathy exclude this classification."},"D":{"text":"Renal lymphoma; rituximab-based immunochemotherapy","rationale":"Immunohistochemistry demonstrates an epithelial tumour with INI1 loss, not a lymphoid infiltrate."}},"explanation":{"core":"Renal medullary carcinoma occurs almost exclusively in sickle cell trait carriers, affects young patients and is defined by loss of SMARCB1. It behaves like collecting duct carcinoma, from which it must be distinguished, and is likewise treated with platinum.","teaching_point":"Young patient, sickle cell trait, central renal tumour: ask for INI1."},"flag_note":null}}},{"id":"uro-rcc-00005","version":1,"status":"published","taxonomy":{"subdomain":"papilläres Nierenzellkarzinom","tags":["pathologie","pharmakologie","leitlinie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"PAPMET / SWOG 1500, Lancet 2021"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"61-jähriger Patient mit metastasiertem papillärem Nierenzellkarzinom, ECOG 1, intermediäres IMDC-Risiko. Molekularpathologisch besteht eine MET-Alteration.","lead_in":"Welche Erstlinientherapie ist am besten begründet?","options":{"A":{"text":"Interferon alfa als Monotherapie in der Erstlinie","rationale":"Historisch und heute ohne Stellenwert in der Erstlinie."},"B":{"text":"Platinbasierte Chemotherapie wie beim Sammelrohrkarzinom","rationale":"Die Chemotherapiesensibilität gilt für das Sammelrohr- und das medulläre Karzinom, nicht für das papilläre."},"C":{"text":"Ipilimumab plus Nivolumab für alle nicht klarzelligen Formen","rationale":"Die Wirksamkeit ist bei nicht klarzelligen Subtypen uneinheitlich und für das papilläre Karzinom schwächer belegt als die MET-gerichtete Therapie."},"D":{"text":"Cabozantinib wegen der MET-Achse beim papillären Karzinom","rationale":"Die MET-Achse ist beim papillären Karzinom der treibende Signalweg, und Cabozantinib hemmt neben VEGFR auch MET und AXL. In einem randomisierten Vergleich zeigte es gegenüber Sunitinib ein längeres progressionsfreies Überleben. Cabozantinib hemmt neben VEGFR auch MET und AXL."}},"explanation":{"core":"Nicht klarzellige Nierenzellkarzinome sind keine einheitliche Gruppe. Das papilläre Karzinom ist überwiegend MET-getrieben und spricht deshalb auf Cabozantinib besser an als auf reine VEGF-Hemmung. Diese Differenzierung setzt voraus, dass der Subtyp vor der Therapieentscheidung feststeht.","teaching_point":"Nicht klarzellig ist eine Sammelbezeichnung, keine Therapieentscheidung."},"flag_note":null},"en":{"vignette":"61-year-old man with metastatic papillary renal cell carcinoma, ECOG 1, intermediate IMDC risk. Molecular pathology shows a MET alteration.","lead_in":"Which first-line treatment is best justified?","options":{"A":{"text":"Interferon alfa as first-line monotherapy","rationale":"Historical and today of no first-line relevance."},"B":{"text":"Platinum chemotherapy as in collecting duct carcinoma","rationale":"Chemosensitivity applies to collecting duct and medullary carcinoma, not to papillary disease."},"C":{"text":"Ipilimumab plus nivolumab for all non-clear-cell forms","rationale":"Efficacy across non-clear-cell subtypes is inconsistent and less well established for papillary carcinoma than MET-directed therapy."},"D":{"text":"Cabozantinib for the MET axis in papillary carcinoma","rationale":"The MET axis is the driving pathway in papillary carcinoma, and cabozantinib inhibits MET and AXL in addition to VEGFR. In a randomised comparison it showed longer progression-free survival than sunitinib. Cabozantinib inhibits MET and AXL in addition to VEGFR."}},"explanation":{"core":"Non-clear-cell renal cell carcinomas are not a uniform group. Papillary carcinoma is predominantly MET-driven and therefore responds better to cabozantinib than to pure VEGF inhibition. This differentiation presupposes that the subtype is established before the treatment decision.","teaching_point":"Non-clear-cell is a collective label, not a treatment decision."},"flag_note":null}}},{"id":"uro-rcc-00006","version":1,"status":"published","taxonomy":{"subdomain":"sarkomatoide Differenzierung","tags":["pathologie","pharmakologie","leitlinie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"58-jährige Patientin mit metastasiertem klarzelligem Nierenzellkarzinom. Die Pathologie beschreibt einen sarkomatoiden Anteil von 30 Prozent. IMDC intermediäres Risiko, ECOG 1, keine Autoimmunerkrankung.","lead_in":"Wie beeinflusst der sarkomatoide Anteil die Therapiewahl?","options":{"A":{"text":"Er spricht für eine checkpointbasierte Kombination","rationale":"Sarkomatoide Tumoren zeigen häufiger eine PD-L1-Expression und in Subgruppenanalysen hohe Ansprech- und Komplettremissionsraten unter Immunkombinationen. Sarkomatoide Tumoren exprimieren häufiger PD-L1 und zeigen in Subgruppenanalysen hohe Ansprech- und Komplettremissionsraten unter Immunkombinationen, obwohl sie prognostisch ungünstig sind."},"B":{"text":"Er spricht gegen jede Form der Immuntherapie","rationale":"Das Gegenteil ist der Fall; gerade dieser Anteil ist ein Argument für die Immunkombination."},"C":{"text":"Er macht platinbasierte Chemotherapie zur Erstlinie","rationale":"Sarkomatoid ist kein eigener Subtyp, sondern eine Entdifferenzierung; die Chemotherapie ist dem Sammelrohr- und medullären Karzinom vorbehalten."},"D":{"text":"Er ist prognostisch relevant, aber ohne Therapiefolge","rationale":"Er beeinflusst beides, Prognose und Auswahl, und ist deshalb im Befund ausdrücklich zu nennen."}},"explanation":{"core":"Sarkomatoide Differenzierung ist kein Subtyp, sondern eine Entdifferenzierung, die in jedem Subtyp auftreten kann. Sie verschlechtert die Prognose deutlich, sagt aber zugleich ein überdurchschnittliches Ansprechen auf Checkpointinhibitoren voraus. Der Anteil gehört deshalb in jeden Pathologiebefund.","teaching_point":"Sarkomatoid ist prognostisch schlecht und prädiktiv gut. Beides gilt gleichzeitig."},"flag_note":null},"en":{"vignette":"58-year-old woman with metastatic clear cell renal cell carcinoma. Pathology reports a sarcomatoid component of 30 per cent. IMDC intermediate risk, ECOG 1, no autoimmune disease.","lead_in":"How does the sarcomatoid component influence treatment choice?","options":{"A":{"text":"It argues for a checkpoint-based combination","rationale":"Sarcomatoid tumours more often express PD-L1 and show high response and complete remission rates with immune combinations in subgroup analyses. Sarcomatoid tumours more often express PD-L1 and show high response and complete remission rates with immune combinations in subgroup analyses, despite their poor prognosis."},"B":{"text":"It argues against immunotherapy of any kind","rationale":"The opposite is true; this component is precisely an argument for immune combination therapy."},"C":{"text":"It makes platinum chemotherapy the first-line choice","rationale":"Sarcomatoid is not a separate subtype but a dedifferentiation; chemotherapy is reserved for collecting duct and medullary carcinoma."},"D":{"text":"It is prognostic but has no bearing on drug choice","rationale":"It influences both prognosis and selection and therefore belongs explicitly in the report."}},"explanation":{"core":"Sarcomatoid differentiation is not a subtype but a dedifferentiation that can arise in any subtype. It markedly worsens prognosis while predicting above-average response to checkpoint inhibitors. The percentage therefore belongs in every pathology report.","teaching_point":"Sarcomatoid is prognostically bad and predictively good. Both hold at once."},"flag_note":null}}},{"id":"uro-rcc-00007","version":1,"status":"published","taxonomy":{"subdomain":"chromophobes Karzinom","tags":["pathologie","pharmakologie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Eine 49-jährige Patientin wurde vor drei Jahren wegen eines chromophoben Nierenzellkarzinoms nephrektomiert. Jetzt zeigen sich zwei langsam wachsende Lungenmetastasen. Sie ist beschwerdefrei, ECOG 0.","lead_in":"Welche Aussage trifft zu?","options":{"A":{"text":"Besonders empfindlich gegenüber dualer Checkpointinhibition","rationale":"Die Ansprechraten sind bei diesem Subtyp niedriger als beim klarzelligen Karzinom."},"B":{"text":"Günstigere Prognose, aber schlechteres Ansprechen auf IO","rationale":"Der Subtyp verhält sich indolenter, und die Immuntherapie ist hier weniger wirksam. Bei langsamer Progression ohne Symptome bleibt Zeit für eine Verlaufsbeobachtung. Bei geringer Tumorlast ohne Symptome ist deshalb eine zeitlich begrenzte aktive Überwachung vertretbar, bevor VEGF-gerichtet behandelt wird."},"C":{"text":"Nicht von Onkozytomen zu unterscheiden und gleich behandelt","rationale":"Das Onkozytom ist gutartig; die Abgrenzung erfolgt histologisch und ist therapeutisch entscheidend."},"D":{"text":"Platinbasierte Chemotherapie ist hier der Standard","rationale":"Sie gilt für Sammelrohr- und medulläres Karzinom, nicht für den chromophoben Subtyp."}},"explanation":{"core":"Das chromophobe Karzinom entstammt wie das Onkozytom den Schaltzellen des Sammelrohrsystems, verhält sich indolenter als das klarzellige Karzinom und metastasiert seltener. Wenn es metastasiert, ist das Ansprechen auf Checkpointinhibitoren schwächer, sodass VEGF-gerichtete Substanzen und die zeitliche Verlaufsbeobachtung an Bedeutung gewinnen.","teaching_point":"Günstige Prognose bedeutet hier auch: weniger Ansprechen auf Immuntherapie."},"flag_note":null},"en":{"vignette":"A 49-year-old woman underwent nephrectomy three years ago for chromophobe renal cell carcinoma. Two slowly growing pulmonary metastases have now appeared. She is asymptomatic, ECOG 0.","lead_in":"Which statement is correct?","options":{"A":{"text":"Particularly sensitive to dual checkpoint inhibition","rationale":"Response rates in this subtype are lower than in clear cell carcinoma."},"B":{"text":"More favourable prognosis but poorer response to IO","rationale":"The subtype behaves more indolently and immunotherapy is less effective here. With slow, asymptomatic progression there is time to observe. With low tumour burden and no symptoms a limited period of active surveillance is therefore defensible before VEGF-directed treatment."},"C":{"text":"Indistinguishable from oncocytoma and treated the same","rationale":"Oncocytoma is benign; the distinction is histological and therapeutically decisive."},"D":{"text":"Platinum-based chemotherapy is the standard here","rationale":"That applies to collecting duct and medullary carcinoma, not to the chromophobe subtype."}},"explanation":{"core":"Like oncocytoma, chromophobe carcinoma arises from the intercalated cells of the collecting system, behaves more indolently than clear cell carcinoma and metastasises less often. When it does metastasise, response to checkpoint inhibitors is weaker, so VEGF-directed agents and a period of observation gain importance.","teaching_point":"A favourable prognosis here also means less response to immunotherapy."},"flag_note":null}}},{"id":"uro-rcc-00008","version":1,"status":"published","taxonomy":{"subdomain":"kleine Nierenraumforderung","tags":["bildgebung","pathologie","leitlinie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"82-jähriger Patient mit relevanten Komorbiditäten, Zufallsbefund einer soliden, kontrastmittelaufnehmenden Nierenraumforderung von 2,6 cm. Kein Fettanteil im CT. Eine Thermoablation oder eine aktive Überwachung wird erwogen.","lead_in":"Welcher Schritt ist sinnvoll?","options":{"A":{"text":"Direkte radikale Nephrektomie ohne weitere Diagnostik","rationale":"Bei einem Tumor dieser Größe wäre der Organverlust unnötig, und ein erheblicher Anteil solcher Läsionen ist gutartig oder niedrig maligne."},"B":{"text":"PET/CT zur Klärung der Dignität der Raumforderung","rationale":"Für die Dignitätsbeurteilung solider Nierenraumforderungen nicht etabliert."},"C":{"text":"Perkutane Nierenbiopsie vor Ablation oder Überwachung","rationale":"Sie klärt Dignität und Subtyp, verhindert die Behandlung gutartiger Läsionen und steuert die Intensität der Überwachung. Das Risiko einer Tumorzellverschleppung ist gering. Sie klärt Dignität und Subtyp, verhindert die Behandlung gutartiger Läsionen und steuert die Intensität der Überwachung; das Risiko einer Tumorzellverschleppung ist gering."},"D":{"text":"Bildgebende Kontrolle in zwölf Monaten ohne Histologie","rationale":"Ohne Histologie bleibt unklar, ob überhaupt und wie engmaschig kontrolliert werden muss."}},"explanation":{"core":"Bei kleinen Nierenraumforderungen ist die Biopsie dann sinnvoll, wenn ihr Ergebnis die Entscheidung verändert, also vor Ablation, vor aktiver Überwachung und vor Systemtherapie. Bei geplanter Operation eines eindeutigen Befundes ändert sie das Vorgehen dagegen nicht. Ein Fettanteil im CT weist auf ein Angiomyolipom und macht die Biopsie entbehrlich.","teaching_point":"Biopsieren, wenn nicht operiert wird. Nicht biopsieren, wenn ohnehin operiert wird."},"flag_note":null},"en":{"vignette":"82-year-old man with significant comorbidity and an incidental solid, contrast-enhancing renal mass of 2.6 cm. No fat component on CT. Thermal ablation or active surveillance is being considered.","lead_in":"Which step makes sense?","options":{"A":{"text":"Proceed straight to radical nephrectomy without workup","rationale":"At this size the loss of the organ would be unnecessary, and a substantial proportion of such lesions are benign or low grade."},"B":{"text":"PET/CT to determine whether the mass is malignant","rationale":"Not established for characterising solid renal masses."},"C":{"text":"Percutaneous renal biopsy before ablation or surveillance","rationale":"It establishes malignancy and subtype, avoids treating benign lesions and guides surveillance intensity. The risk of tumour seeding is low. It establishes malignancy and subtype, avoids treating benign lesions and guides surveillance intensity; the risk of tumour seeding is low."},"D":{"text":"Imaging follow-up in twelve months without histology","rationale":"Without histology it remains unclear whether and how closely surveillance is needed."}},"explanation":{"core":"In small renal masses biopsy is worthwhile when its result changes the decision: before ablation, before active surveillance and before systemic therapy. When surgery for an unequivocal lesion is planned it does not change management. A fat component on CT indicates angiomyolipoma and makes biopsy unnecessary.","teaching_point":"Biopsy when you are not operating. Do not biopsy when you are."},"flag_note":null}}},{"id":"uro-rcc-00009","version":1,"status":"published","taxonomy":{"subdomain":"Angiomyolipom","tags":["bildgebung","pharmakologie","notfall"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"35-jährige Patientin mit tuberöser Sklerose, beidseits multiple fetthaltige Nierenraumforderungen, die größte misst 6 cm. Sie ist beschwerdefrei, die Nierenfunktion ist normal. Vor drei Jahren war die größte Läsion 4 cm groß.","lead_in":"Wie ist vorzugehen?","options":{"A":{"text":"Beidseitige radikale Nephrektomie mit späterer Dialyse","rationale":"Der Organverlust wäre bei einer gutartigen Erkrankung mit erhaltener Funktion nicht zu rechtfertigen."},"B":{"text":"Perkutane Biopsie zur Klärung der Dignität vorab","rationale":"Der Fettanteil in der Bildgebung sichert die Diagnose; eine Biopsie ist entbehrlich und birgt Blutungsrisiken."},"C":{"text":"Behandeln, da Größe und Wachstum das Blutungsrisiko erhöhen","rationale":"Ab etwa vier Zentimetern steigt das Risiko einer Ruptur mit retroperitonealer Blutung. Bei tuberöser Sklerose wirkt der mTOR-Inhibitor auf alle Läsionen gleichzeitig. Bei tuberöser Sklerose wirkt ein mTOR-Inhibitor wie Everolimus auf alle Läsionen zugleich; bei akuter Blutung oder als organsparende Alternative kommt die selektive Angioembolisation infrage."},"D":{"text":"Kontrolle in fünf Jahren, da Angiomyolipome gutartig sind","rationale":"Gutartig heißt nicht harmlos: Die Hauptgefahr ist die spontane Blutung, nicht die Metastasierung."}},"explanation":{"core":"Das Angiomyolipom ist ein gutartiger Tumor mit einem gefäßbedingten Risiko. Entscheidend sind Größe, Wachstumsdynamik und Symptome, nicht die Dignität. Bei tuberöser Sklerose kommt die systemische Option mit einem mTOR-Inhibitor hinzu, weil dort typischerweise beidseits multiple Läsionen vorliegen.","teaching_point":"Beim Angiomyolipom wird die Blutung behandelt, nicht der Krebs."},"flag_note":null},"en":{"vignette":"35-year-old woman with tuberous sclerosis and multiple bilateral fat-containing renal lesions, the largest measuring 6 cm. She is asymptomatic with normal renal function. Three years ago the largest lesion was 4 cm.","lead_in":"How should this be managed?","options":{"A":{"text":"Bilateral radical nephrectomy with later dialysis","rationale":"Organ loss cannot be justified in a benign condition with preserved function."},"B":{"text":"Percutaneous biopsy to establish malignancy first","rationale":"The fat component on imaging establishes the diagnosis; biopsy is unnecessary and carries bleeding risk."},"C":{"text":"Treat, since size and growth raise the bleeding risk","rationale":"Above roughly four centimetres the risk of rupture with retroperitoneal haemorrhage rises. In tuberous sclerosis an mTOR inhibitor acts on all lesions simultaneously. In tuberous sclerosis an mTOR inhibitor such as everolimus acts on all lesions at once; selective angioembolisation applies to acute bleeding or as a nephron-sparing alternative."},"D":{"text":"Review in five years, since angiomyolipomas are benign","rationale":"Benign does not mean harmless: the main danger is spontaneous haemorrhage, not metastasis."}},"explanation":{"core":"Angiomyolipoma is a benign tumour with a vascular risk. Size, growth dynamics and symptoms decide management, not malignancy. In tuberous sclerosis the systemic option with an mTOR inhibitor is added, because lesions there are typically multiple and bilateral.","teaching_point":"In angiomyolipoma you treat the bleeding, not the cancer."},"flag_note":null}}},{"id":"uro-rcc-00010","version":1,"status":"published","taxonomy":{"subdomain":"zystische Läsionen","tags":["bildgebung","leitlinie","pathologie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"57-jährige Patientin mit einer zystischen Nierenläsion von 4 cm. Im CT zeigen sich mehrere verdickte, unregelmäßige Septen mit deutlicher Kontrastmittelaufnahme und ein solider, ebenfalls kontrastierender Anteil.","lead_in":"Wie ist die Läsion einzuordnen und zu behandeln?","options":{"A":{"text":"Bosniak I; keine weitere Abklärung erforderlich","rationale":"Bosniak I beschreibt die einfache Zyste ohne Septen und ohne Kontrastmittelaufnahme."},"B":{"text":"Bosniak II; bildgebende Kontrolle in sechs Monaten","rationale":"Bosniak II umfasst wenige dünne Septen ohne messbare Kontrastierung und gilt als gutartig."},"C":{"text":"Bosniak IIF; Verlaufskontrollen über fünf Jahre","rationale":"Bosniak IIF beschreibt minimal komplexe Zysten ohne soliden kontrastierenden Anteil; genau dieser liegt hier aber vor."},"D":{"text":"Bosniak IV; operative Behandlung, möglichst organerhaltend","rationale":"Ein solider kontrastierender Anteil definiert Bosniak IV mit sehr hoher Malignitätswahrscheinlichkeit. Die Behandlung folgt dem Vorgehen beim soliden Nierenzellkarzinom. Ein solider kontrastierender Anteil definiert Bosniak IV mit sehr hoher Malignitätswahrscheinlichkeit; das Vorgehen folgt dem soliden Nierenzellkarzinom."}},"explanation":{"core":"Die Bosniak-Klassifikation ordnet zystische Nierenläsionen nach Septendicke, Verkalkungen, Wandbeschaffenheit und vor allem nach Kontrastmittelaufnahme. Entscheidend ist die Grenze zwischen IIF und III: Ab Bosniak III steigt die Malignitätswahrscheinlichkeit auf etwa die Hälfte, bei Bosniak IV liegt sie deutlich darüber.","teaching_point":"Nicht die Größe entscheidet, sondern die Kontrastmittelaufnahme."},"flag_note":null},"en":{"vignette":"57-year-old woman with a 4 cm cystic renal lesion. CT shows several thickened irregular septa with marked contrast enhancement and a solid, also enhancing, component.","lead_in":"How should the lesion be classified and treated?","options":{"A":{"text":"Bosniak I; no further assessment required","rationale":"Bosniak I describes a simple cyst without septa and without enhancement."},"B":{"text":"Bosniak II; imaging follow-up in six months","rationale":"Bosniak II covers a few thin septa without measurable enhancement and is regarded as benign."},"C":{"text":"Bosniak IIF; surveillance imaging over five years","rationale":"Bosniak IIF describes minimally complex cysts without a solid enhancing component, which is precisely what is present here."},"D":{"text":"Bosniak IV; surgery, preferably nephron-sparing","rationale":"A solid enhancing component defines Bosniak IV with a very high probability of malignancy. Management follows that of solid renal cell carcinoma. A solid enhancing component defines Bosniak IV with a very high probability of malignancy; management follows that of solid renal cell carcinoma."}},"explanation":{"core":"The Bosniak classification grades cystic renal lesions by septal thickness, calcification, wall characteristics and above all contrast enhancement. The critical boundary lies between IIF and III: from Bosniak III the probability of malignancy rises to roughly half, and in Bosniak IV considerably higher.","teaching_point":"Size does not decide; enhancement does."},"flag_note":null}}},{"id":"uro-rcc-00011","version":1,"status":"published","taxonomy":{"subdomain":"Nierenteilresektion","tags":["operationstechnik","leitlinie"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"60-jähriger Patient mit einem exophytisch am Unterpol gelegenen Nierentumor von 5,5 cm, cT1b cN0 cM0. Die Gegenniere ist normal, die GFR beträgt 84 ml/min, keine Diabetes- oder Hypertoniefolgen.","lead_in":"Welches operative Vorgehen ist zu bevorzugen?","options":{"A":{"text":"Nierenteilresektion, sofern ein tumorfreier Rand gelingt","rationale":"Der Organerhalt ist bei cT1b bei geeigneter Lage etabliert und onkologisch der radikalen Nephrektomie gleichwertig. Der Erhalt von Parenchym schützt die spätere Nierenfunktion und damit die kardiovaskuläre Prognose. Onkologisch ist der Organerhalt bei geeigneter Lage der radikalen Nephrektomie gleichwertig."},"B":{"text":"Radikale Nephrektomie, da ab fünf Zentimetern unsicher","rationale":"Eine solche Größengrenze existiert nicht; entscheidend sind Lage, Zugänglichkeit und die Möglichkeit eines tumorfreien Randes."},"C":{"text":"Thermoablation des Tumors als Verfahren erster Wahl","rationale":"Sie ist bei kleinen Tumoren und Komorbidität eine Option, nicht bei einem 5,5 cm großen Tumor beim funktionell gesunden Patienten."},"D":{"text":"Aktive Überwachung mit halbjährlicher Bildgebung","rationale":"Sie kommt bei kleinen Läsionen und begrenzter Lebenserwartung infrage, hier nicht."}},"explanation":{"core":"Der Organerhalt ist beim lokalisierten Nierenzellkarzinom der Standard, solange er technisch möglich und onkologisch sicher ist. Der Nutzen liegt weniger in der Tumorkontrolle als in der Erhaltung der Nierenfunktion, weil eine niedrigere GFR mit erhöhter kardiovaskulärer Sterblichkeit einhergeht.","teaching_point":"Die Größe schließt den Organerhalt nicht aus. Lage und Rand entscheiden."},"flag_note":null},"en":{"vignette":"60-year-old man with an exophytic lower pole renal tumour of 5.5 cm, cT1b cN0 cM0. The contralateral kidney is normal, GFR is 84 ml/min, with no diabetic or hypertensive damage.","lead_in":"Which surgical approach is preferable?","options":{"A":{"text":"Partial nephrectomy, provided a clear margin is achievable","rationale":"Nephron-sparing surgery is established in cT1b with suitable tumour location and is oncologically equivalent to radical nephrectomy. Preserving parenchyma protects later renal function and thereby cardiovascular prognosis. With suitable tumour location it is oncologically equivalent to radical nephrectomy."},"B":{"text":"Radical nephrectomy, unsafe above five centimetres","rationale":"No such size threshold exists; location, accessibility and the achievability of a clear margin decide."},"C":{"text":"Thermal ablation of the tumour as the first choice","rationale":"An option for small tumours with comorbidity, not for a 5.5 cm tumour in a functionally healthy patient."},"D":{"text":"Active surveillance with six-monthly imaging","rationale":"Appropriate for small lesions and limited life expectancy, not here."}},"explanation":{"core":"Nephron-sparing surgery is the standard in localised renal cell carcinoma as long as it is technically feasible and oncologically safe. The benefit lies less in tumour control than in preserving renal function, since a lower GFR carries increased cardiovascular mortality.","teaching_point":"Size does not rule out organ preservation. Location and margin do."},"flag_note":null}}},{"id":"uro-rcc-00012","version":1,"status":"published","taxonomy":{"subdomain":"Tumorthrombus","tags":["operationstechnik","bildgebung","praeoperativ"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"66-jähriger Patient mit rechtsseitigem Nierenzellkarzinom und einem Tumorthrombus, der im MRT bis oberhalb des Zwerchfells in den rechten Vorhof reicht. Keine Fernmetastasen, ECOG 0.","lead_in":"Was folgt daraus für die Planung?","options":{"A":{"text":"Der Thrombus macht die Erkrankung inoperabel","rationale":"Auch ausgedehnte Thromben sind bei fehlender Metastasierung mit kurativer Absicht resezierbar."},"B":{"text":"Die kraniale Ausdehnung bestimmt Zugang und Team","rationale":"Die Höhe des Thrombus legt fest, ob ein rein abdomineller Zugang genügt oder ob Sternotomie und extrakorporale Zirkulation nötig werden. Bei atrialem Thrombus sind die Zusammenarbeit mit der Herzchirurgie und gegebenenfalls der Einsatz der Herz-Lungen-Maschine zu planen, ebenso Sternotomie und Aufklärung."},"C":{"text":"Der Thrombus erfordert immer eine Resektion der Cava","rationale":"Meist liegt der Thrombus frei im Lumen; eine Wandinfiltration kommt vor und wird intraoperativ entschieden."},"D":{"text":"Präoperative Antikoagulation löst den Thrombus auf","rationale":"Ein Tumorthrombus besteht aus Tumorgewebe und lässt sich nicht antikoagulatorisch auflösen."}},"explanation":{"core":"Der venöse Tumorthrombus ist eine Besonderheit des Nierenzellkarzinoms und schließt die kurative Operation nicht aus. Die Klassifikation nach der kranialen Ausdehnung von der Nierenvene bis in den rechten Vorhof steuert die gesamte Planung: Zugang, beteiligte Fachdisziplinen, Bereitstellung der Herz-Lungen-Maschine und Aufklärung.","teaching_point":"Die Höhe des Thrombus bestimmt das Operationsteam, nicht die Prognose allein."},"flag_note":null},"en":{"vignette":"66-year-old man with a right renal cell carcinoma and a tumour thrombus extending on MRI above the diaphragm into the right atrium. No distant metastases, ECOG 0.","lead_in":"What follows for planning?","options":{"A":{"text":"The thrombus renders the disease inoperable","rationale":"Even extensive thrombi are resectable with curative intent in the absence of metastases."},"B":{"text":"Cranial extent determines the approach and the team","rationale":"The level of the thrombus determines whether an abdominal approach suffices or whether sternotomy and extracorporeal circulation are required. With an atrial thrombus, collaboration with cardiac surgery and possible cardiopulmonary bypass must be planned, as must sternotomy and consent."},"C":{"text":"The thrombus always requires caval resection","rationale":"Usually the thrombus lies free in the lumen; wall invasion occurs and is decided intraoperatively."},"D":{"text":"Preoperative anticoagulation dissolves the thrombus","rationale":"A tumour thrombus consists of tumour tissue and cannot be dissolved by anticoagulation."}},"explanation":{"core":"Venous tumour thrombus is a peculiarity of renal cell carcinoma and does not preclude curative surgery. Classification by cranial extent from the renal vein to the right atrium drives the whole plan: approach, disciplines involved, availability of cardiopulmonary bypass and consent.","teaching_point":"The level of the thrombus determines the operating team, not the prognosis alone."},"flag_note":null}}},{"id":"uro-hod-00001","version":1,"status":"published","taxonomy":{"subdomain":"Seminom Stadium I","tags":["leitlinie","nachsorge"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026},{"type":"leitlinie","code":"AWMF 043-049OL","title":"S3-Leitlinie Keimzelltumoren des Hodens","year":2025}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2028-09-05"},"content":{"de":{"vignette":"32-jähriger Patient nach inguinaler Ablatio testis. Histologie: reines Seminom, pT1, keine Rete-testis-Invasion, Tumordurchmesser 2,8 cm. Tumormarker vor und nach Operation im Normbereich, CT von Thorax, Abdomen und Becken unauffällig. Klinisches Stadium I.","lead_in":"Welches Vorgehen ist Standard?","options":{"A":{"text":"Adjuvante paraaortale Radiatio mit 20 Gy in Standardfraktionierung","rationale":"Wegen Zweitmalignomen und kardiovaskulärer Spätfolgen weitgehend verlassen."},"B":{"text":"Adjuvanter Zyklus Carboplatin AUC 7 nach der Ablatio","rationale":"Eine Alternative, die die Rezidivrate senkt, das Gesamtüberleben aber nicht verbessert. Sie kommt vor allem infrage, wenn eine engmaschige Nachsorge nicht sicherzustellen ist."},"C":{"text":"Aktive Surveillance nach festem Nachsorgeschema","rationale":"Etwa 82 bis 85 Prozent der Patienten im Stadium I sind bereits geheilt. Surveillance vermeidet die Übertherapie der Mehrheit; Rezidive sind im Verlauf sehr gut behandelbar."},"D":{"text":"Nervschonende retroperitoneale Lymphadenektomie beidseits","rationale":"Beim Seminom im Stadium I kein Standardverfahren; sie gehört in den Bereich des Nichtseminoms und ausgewählter Sondersituationen."}},"explanation":{"core":"Im Stadium I entscheidet nicht die maximale Tumorkontrolle, sondern das Verhältnis von Nutzen zu Langzeittoxizität bei jungen Männern mit einer Heilungsrate nahe hundert Prozent. Surveillance verlagert die Behandlung auf die Minderheit mit Rezidiv, statt alle zu therapieren.","teaching_point":"Beim Seminom im Stadium I ist Nichtstun unter engmaschiger Kontrolle die aktive Entscheidung, nicht das Versäumnis."},"flag_note":null},"en":{"vignette":"32-year-old man after inguinal orchiectomy. Histology: pure seminoma, pT1, no rete testis invasion, tumour diameter 2.8 cm. Tumour markers normal before and after surgery, CT of chest, abdomen and pelvis unremarkable. Clinical stage I.","lead_in":"What is the standard approach?","options":{"A":{"text":"Adjuvant para-aortic radiotherapy with 20 Gy in standard fractions","rationale":"Largely abandoned because of second malignancies and late cardiovascular effects."},"B":{"text":"One adjuvant cycle of carboplatin AUC 7 after orchiectomy","rationale":"An alternative that lowers the relapse rate but does not improve overall survival. It mainly applies when close follow-up cannot be assured."},"C":{"text":"Active surveillance following a defined follow-up schedule","rationale":"Roughly 82 to 85 per cent of stage I patients are already cured. Surveillance avoids overtreating the majority, and relapses remain highly treatable."},"D":{"text":"Bilateral nerve-sparing retroperitoneal lymph node dissection","rationale":"Not a standard procedure in stage I seminoma; it belongs to non-seminoma and selected special situations."}},"explanation":{"core":"In stage I the decision is not about maximum tumour control but about the balance of benefit against long-term toxicity in young men whose cure rate approaches one hundred per cent. Surveillance shifts treatment onto the minority who relapse instead of treating everyone.","teaching_point":"In stage I seminoma, doing nothing under close monitoring is the active decision, not an omission."},"flag_note":null}}},{"id":"uro-hod-00002","version":1,"status":"published","taxonomy":{"subdomain":"Chemotherapie","tags":["dosierung","pharmakologie","leitlinie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026},{"type":"klassifikation","citation":"IGCCCG-Klassifikation"}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2028-09-05"},"content":{"de":{"vignette":"27-jähriger Patient mit metastasiertem Nichtseminom, retroperitoneale Lymphknoten bis 3 cm, keine viszeralen Metastasen außerhalb der Lunge, AFP 420 ng/ml, beta-hCG 1800 IU/l, LDH gering erhöht. Nach IGCCCG ergibt sich eine gute Prognose. Lungenfunktion normal.","lead_in":"Welche Chemotherapie entspricht dem Standard?","options":{"A":{"text":"Vier Zyklen Carboplatin AUC 7 als Monotherapie","rationale":"Carboplatin ersetzt Cisplatin beim metastasierten Keimzelltumor nicht; die Monotherapie ist deutlich unterlegen."},"B":{"text":"Drei Zyklen EP ohne Bleomycin","rationale":"Bleomycinfrei wird nur bei Kontraindikation behandelt, und dann mit vier Zyklen EP statt drei."},"C":{"text":"Drei Zyklen BEP nach Standarddosierung","rationale":"Drei Zyklen BEP sind bei guter Prognose der Standard und vier Zyklen gleichwertig bei geringerer Toxizität. Das Schema umfasst Cisplatin 20 mg/m² an den Tagen 1 bis 5, Etoposid 100 mg/m² an den Tagen 1 bis 5 und Bleomycin 30 mg absolut an den Tagen 1, 8 und 15, mit Wiederholung an Tag 22."},"D":{"text":"Vier Zyklen BEP nach Standarddosierung","rationale":"Vier Zyklen sind der intermediären und ungünstigen Prognosegruppe vorbehalten; hier bedeuten sie nur zusätzliche Toxizität."}},"explanation":{"core":"Die IGCCCG-Prognosegruppe legt die Zyklenzahl fest: drei BEP bei guter, vier BEP bei intermediärer und ungünstiger Prognose. Bleomycin wird nur bei Kontraindikation weggelassen, dann jedoch unter Erhöhung auf vier Zyklen EP. Vor Bleomycin gehört eine Lungenfunktionsprüfung.","teaching_point":"Prognosegruppe bestimmt die Zyklenzahl, Bleomycintauglichkeit bestimmt das Regime."},"flag_note":null},"en":{"vignette":"27-year-old man with metastatic non-seminoma, retroperitoneal nodes up to 3 cm, no non-pulmonary visceral metastases, AFP 420 ng/ml, beta-hCG 1800 IU/l, mildly elevated LDH. IGCCCG classification gives good prognosis. Lung function normal.","lead_in":"Which chemotherapy is standard?","options":{"A":{"text":"Four cycles of single-agent carboplatin AUC 7","rationale":"Carboplatin does not replace cisplatin in metastatic germ cell tumours; single-agent treatment is clearly inferior."},"B":{"text":"Three cycles of EP without bleomycin","rationale":"Bleomycin is omitted only when contraindicated, and then four cycles of EP are given rather than three."},"C":{"text":"Three cycles of BEP at standard dosing","rationale":"Three cycles of BEP are standard in good prognosis and equivalent to four cycles with lower toxicity. The regimen comprises cisplatin 20 mg/m² on days 1 to 5, etoposide 100 mg/m² on days 1 to 5 and bleomycin 30 mg flat dose on days 1, 8 and 15, repeated on day 22."},"D":{"text":"Four cycles of BEP at standard dosing","rationale":"Four cycles are reserved for intermediate and poor prognosis; here they only add toxicity."}},"explanation":{"core":"The IGCCCG prognostic group sets the number of cycles: three BEP in good prognosis, four BEP in intermediate and poor prognosis. Bleomycin is omitted only when contraindicated, and then the EP regimen is extended to four cycles. Pulmonary function testing belongs before bleomycin.","teaching_point":"Prognostic group sets the number of cycles; bleomycin fitness sets the regimen."},"flag_note":null}}},{"id":"uro-hod-00003","version":1,"status":"published","taxonomy":{"subdomain":"Primärdiagnostik","tags":["leitlinie","labordiagnostik","praeoperativ"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026},{"type":"leitlinie","code":"AWMF 043-049OL","title":"S3-Leitlinie Keimzelltumoren des Hodens","year":2025}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"28-jähriger Patient mit seit sechs Wochen bestehender, schmerzloser Schwellung des rechten Hodens. Sonographisch echoarme, inhomogene intratestikuläre Raumforderung von 3 cm mit vermehrter Vaskularisierung. Der Patient hat keine Kinder und einen offenen Kinderwunsch.","lead_in":"Was ist vor der inguinalen Ablatio testis zu veranlassen?","options":{"A":{"text":"Erst vollständiges Staging-CT, danach die Operation","rationale":"Das Staging-CT gehört zur Ausbreitungsdiagnostik, darf die Ablatio aber nicht verzögern; bei bedrohlicher Erkrankung wird sogar mit der Chemotherapie vor der Operation begonnen."},"B":{"text":"Transskrotale Feinnadelbiopsie zur Sicherung vor der Operation","rationale":"Der skrotale Zugang ist kontraindiziert. Er durchbricht die anatomischen Lymphabflussgrenzen und kann Tumorzellen in ein anderes Abflussgebiet verschleppen."},"C":{"text":"Kryokonservierung erst nach Vorliegen der Histologie besprechen","rationale":"Zu spät, wenn unmittelbar eine Chemotherapie folgt, und unnötig belastend, weil die Entscheidung dann unter Zeitdruck fällt."},"D":{"text":"Tumormarker präoperativ abnehmen und Kryokonservierung anbieten","rationale":"Die Marker vor und nach der Operation bestimmen gemeinsam die IGCCCG-Prognosegruppe. Die Kryokonservierung muss vor jeder gonadotoxischen Therapie erfolgen und wird sinnvollerweise vor der Ablatio angeboten. Bestimmt werden AFP, beta-hCG und LDH. Der präoperative Ausgangswert wird gebraucht, weil sich die IGCCCG-Prognosegruppe aus dem Verlauf nach der Operation ergibt."}},"explanation":{"core":"Zwei Dinge sind vor der Operation nicht nachholbar: die präoperativen Tumormarker und die Fertilitätsvorsorge. Der Markerverlauf nach der Ablatio ist nur bewertbar, wenn der Ausgangswert vorliegt, und die Kryokonservierung verliert ihren Sinn, sobald eine Chemotherapie begonnen hat.","teaching_point":"Marker abnehmen und Kryokonservierung anbieten, bevor das Skalpell angesetzt wird. Skrotal wird nicht biopsiert."},"flag_note":null},"en":{"vignette":"28-year-old man with a six-week history of painless right testicular swelling. Ultrasound shows a 3 cm hypoechoic, inhomogeneous intratesticular mass with increased vascularity. He has no children and wishes to keep the option open.","lead_in":"What must be arranged before inguinal orchiectomy?","options":{"A":{"text":"Complete staging CT first, surgery only afterwards","rationale":"Staging CT belongs to the workup but must not delay orchiectomy; in life-threatening disease chemotherapy is even started before surgery."},"B":{"text":"Transscrotal fine-needle biopsy for confirmation before surgery","rationale":"The scrotal approach is contraindicated. It breaches the anatomical lymphatic boundaries and can seed tumour cells into a different drainage territory."},"C":{"text":"Discuss cryopreservation only once histology is available","rationale":"Too late if chemotherapy follows immediately, and unnecessarily stressful because the decision then falls under time pressure."},"D":{"text":"Take tumour markers preoperatively and offer cryopreservation","rationale":"Markers before and after surgery together determine the IGCCCG prognostic group. Cryopreservation must precede any gonadotoxic treatment and is sensibly offered before orchiectomy. AFP, beta-hCG and LDH are measured. The preoperative baseline is needed because the IGCCCG prognostic group derives from the postoperative trajectory."}},"explanation":{"core":"Two things cannot be made up after surgery: preoperative tumour markers and fertility preservation. The post-orchiectomy marker trajectory is only interpretable against a baseline, and cryopreservation loses its purpose once chemotherapy has begun.","teaching_point":"Draw markers and offer cryopreservation before the scalpel. Never biopsy through the scrotum."},"flag_note":null}}},{"id":"uro-hod-00004","version":1,"status":"published","taxonomy":{"subdomain":"Nichtseminom Stadium I","tags":["leitlinie","pharmakologie","dosierung","pathologie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"30-jähriger Patient nach inguinaler Ablatio testis. Histologie: Nichtseminom, pT2 mit eindeutiger lymphovaskulärer Invasion, embryonales Karzinom als Hauptkomponente. Tumormarker nach der Operation vollständig normalisiert, CT von Thorax, Abdomen und Becken unauffällig. Klinisches Stadium I.","lead_in":"Welche Option senkt das Rezidivrisiko am wirksamsten bei vertretbarer Toxizität?","options":{"A":{"text":"Nervschonende retroperitoneale Lymphadenektomie","rationale":"Der Chemotherapie in der Rezidivkontrolle unterlegen und heute Sondersituationen vorbehalten, etwa bei Teratomanteilen oder Kontraindikationen gegen Cisplatin."},"B":{"text":"Adjuvante retroperitoneale Radiatio","rationale":"Beim Nichtseminom unwirksam; die Strahlentherapie hat ihren Platz allenfalls beim Seminom und ist auch dort weitgehend verlassen."},"C":{"text":"Ein Zyklus BEP adjuvant","rationale":"Bei lymphovaskulärer Invasion liegt das Rezidivrisiko unbehandelt bei etwa der Hälfte der Patienten. Ein einzelner Zyklus senkt es auf wenige Prozent und ist zwei Zyklen gleichwertig."},"D":{"text":"Zwei Zyklen BEP adjuvant","rationale":"Historisches Vorgehen. Der zweite Zyklus bringt keinen zusätzlichen Nutzen und verdoppelt die Belastung."}},"explanation":{"core":"Im Stadium I des Nichtseminoms ist die lymphovaskuläre Invasion der entscheidende Risikofaktor und teilt die Patienten in zwei Gruppen. Ohne sie ist Surveillance der Standard, mit ihr wird ein Zyklus BEP empfohlen. Surveillance bleibt auch bei Hochrisiko eine Option, wenn der Patient sie nach Aufklärung wünscht und die Nachsorge gesichert ist.","teaching_point":"Beim Nichtseminom im Stadium I entscheidet ein einziger histologischer Befund über die Empfehlung: die lymphovaskuläre Invasion."},"flag_note":null},"en":{"vignette":"30-year-old man after inguinal orchiectomy. Histology: non-seminoma, pT2 with unequivocal lymphovascular invasion, embryonal carcinoma as the predominant component. Tumour markers fully normalised after surgery, CT of chest, abdomen and pelvis unremarkable. Clinical stage I.","lead_in":"Which option reduces relapse risk most effectively at acceptable toxicity?","options":{"A":{"text":"Nerve-sparing retroperitoneal lymph node dissection","rationale":"Inferior to chemotherapy for relapse control and today reserved for special situations such as teratoma components or contraindications to cisplatin."},"B":{"text":"Adjuvant retroperitoneal radiotherapy","rationale":"Ineffective in non-seminoma; radiotherapy has a place at most in seminoma and has largely been abandoned there too."},"C":{"text":"One adjuvant cycle of BEP","rationale":"With lymphovascular invasion the untreated relapse risk is around fifty per cent. A single cycle reduces it to a few per cent and is equivalent to two cycles."},"D":{"text":"Two adjuvant cycles of BEP","rationale":"Historical practice. The second cycle adds no benefit and doubles the burden."}},"explanation":{"core":"In stage I non-seminoma lymphovascular invasion is the decisive risk factor and splits patients into two groups. Without it surveillance is standard; with it one cycle of BEP is recommended. Surveillance remains an option even in high risk if the patient chooses it after counselling and follow-up is assured.","teaching_point":"In stage I non-seminoma a single histological finding drives the recommendation: lymphovascular invasion."},"flag_note":null}}},{"id":"uro-hod-00005","version":1,"status":"published","taxonomy":{"subdomain":"Residualtumor","tags":["leitlinie","bildgebung","operationstechnik","nachsorge"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"34-jähriger Patient mit metastasiertem Nichtseminom, gute Prognose nach IGCCCG, nach drei Zyklen BEP. AFP und beta-hCG sind vollständig normalisiert. Im CT verbleibt eine retroperitoneale Raumforderung von 2,4 cm, vor Therapie waren es 6 cm.","lead_in":"Wie ist weiter vorzugehen?","options":{"A":{"text":"Zwei weitere Zyklen Chemotherapie zur Verkleinerung des Restbefundes","rationale":"Ohne Markeranstieg besteht keine Indikation; Teratom ist chemotherapieresistent und schrumpft nicht."},"B":{"text":"Beobachtung mit CT-Kontrolle in drei Monaten, da die Marker normalisiert sind","rationale":"Normale Marker schließen weder Teratom noch vitales Karzinom im Residuum aus."},"C":{"text":"Residualtumorresektion des retroperitonealen Befundes","rationale":"Beim Nichtseminom kann ein Residuum reifes Teratom oder vitales Karzinom enthalten, was die Bildgebung nicht unterscheidet. Teratom spricht auf Chemotherapie nicht an und wächst weiter."},"D":{"text":"PET/CT zur Entscheidung, ob reseziert werden muss","rationale":"Die PET ist beim Seminom-Residuum ab drei Zentimetern etabliert, nicht beim Nichtseminom; sie erkennt reifes Teratom nicht."}},"explanation":{"core":"Nach Chemotherapie trennen sich Seminom und Nichtseminom im Vorgehen. Beim Nichtseminom wird jedes Residuum ab etwa einem Zentimeter bei normalisierten Markern reseziert, weil ein Drittel Teratom und ein kleiner Teil vitales Karzinom enthält. Beim Seminom entscheidet ab drei Zentimetern die PET, frühestens sechs Wochen nach Therapieende.","teaching_point":"PET beim Seminom, Skalpell beim Nichtseminom. Reifes Teratom wird operiert, nicht bestrahlt oder abgewartet."},"flag_note":null},"en":{"vignette":"34-year-old man with metastatic non-seminoma, IGCCCG good prognosis, after three cycles of BEP. AFP and beta-hCG have fully normalised. CT shows a residual retroperitoneal mass of 2.4 cm, down from 6 cm before treatment.","lead_in":"How should management proceed?","options":{"A":{"text":"Two further cycles of chemotherapy to shrink the residual mass","rationale":"Without rising markers there is no indication; teratoma is chemoresistant and will not shrink."},"B":{"text":"Observation with repeat CT in three months, since markers have normalised","rationale":"Normal markers exclude neither teratoma nor viable carcinoma within the residual mass."},"C":{"text":"Resection of the residual retroperitoneal mass","rationale":"In non-seminoma a residual mass may contain mature teratoma or viable carcinoma, which imaging cannot distinguish. Teratoma does not respond to chemotherapy and continues to grow."},"D":{"text":"PET/CT to decide whether resection is needed","rationale":"PET is established for seminoma residuals of three centimetres or more, not for non-seminoma; it does not detect mature teratoma."}},"explanation":{"core":"After chemotherapy the pathways for seminoma and non-seminoma diverge. In non-seminoma any residual mass above roughly one centimetre with normalised markers is resected, because a third contains teratoma and a small proportion viable carcinoma. In seminoma, PET decides above three centimetres, no earlier than six weeks after treatment.","teaching_point":"PET for seminoma, scalpel for non-seminoma. Mature teratoma is operated on, not irradiated or watched."},"flag_note":null}}},{"id":"uro-hod-00006","version":1,"status":"published","taxonomy":{"subdomain":"Seminom Stadium II","tags":["leitlinie","pharmakologie","dosierung"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"35-jähriger Patient nach Ablatio bei reinem Seminom. Im CT ein einzelner paraaortaler Lymphknoten von 1,8 cm, Marker normal. Stadium IIA.","lead_in":"Welche Behandlungsoptionen sind etabliert?","options":{"A":{"text":"Alleinige Surveillance, da die Marker normal sind","rationale":"Normale Marker schließen ein Seminom im Lymphknoten nicht aus; im Stadium II wird behandelt."},"B":{"text":"Radiatio des Lymphabflusses oder alternativ Chemotherapie","rationale":"Beide Verfahren erreichen im Stadium IIA hohe Heilungsraten. Die Wahl richtet sich nach Toxizitätsprofil, Alter und Patientenwunsch. Bestrahlt wird das paraaortale und ipsilaterale iliakale Feld. Die Chemotherapie umfasst drei Zyklen BEP oder vier Zyklen EP."},"C":{"text":"Hochdosischemotherapie mit autologer Stammzelltransplantation","rationale":"Sie ist der Rezidivsituation nach Versagen der Erstlinie vorbehalten."},"D":{"text":"Vier Zyklen BEP wie bei ungünstiger Prognose","rationale":"Diese Intensität gilt der metastasierten Erkrankung mit intermediärer oder ungünstiger Prognose, nicht dem Stadium IIA."}},"explanation":{"core":"Im Stadium IIA des Seminoms stehen Strahlentherapie und Chemotherapie gleichwertig nebeneinander. Die Entscheidung wird zunehmend von den Spätfolgen bestimmt: Die Radiatio belastet mit Zweitmalignomen und kardiovaskulären Folgen, die Chemotherapie mit Neuropathie, Ototoxizität und Lungenfunktion. Beide Optionen gehören ins Aufklärungsgespräch.","teaching_point":"Im Stadium IIA entscheidet die Spätfolgenbilanz, nicht die Heilungsrate."},"flag_note":null},"en":{"vignette":"35-year-old man after orchiectomy for pure seminoma. CT shows a single para-aortic node of 1.8 cm with normal markers. Stage IIA.","lead_in":"Which treatment options are established?","options":{"A":{"text":"Surveillance alone, since markers are normal","rationale":"Normal markers do not exclude seminoma in the node; stage II disease is treated."},"B":{"text":"Radiotherapy to the nodal field or alternatively chemotherapy","rationale":"Both achieve high cure rates in stage IIA. The choice follows toxicity profile, age and patient preference. The para-aortic and ipsilateral iliac field is irradiated. Chemotherapy comprises three cycles of BEP or four cycles of EP."},"C":{"text":"High-dose chemotherapy with autologous stem cell transplantation","rationale":"Reserved for relapse after failure of first-line treatment."},"D":{"text":"Four cycles of BEP as in poor prognosis disease","rationale":"That intensity applies to metastatic disease of intermediate or poor prognosis, not to stage IIA."}},"explanation":{"core":"In stage IIA seminoma radiotherapy and chemotherapy stand side by side. The decision is increasingly driven by late effects: radiotherapy carries second malignancies and cardiovascular consequences, chemotherapy neuropathy, ototoxicity and pulmonary effects. Both options belong in the consultation.","teaching_point":"In stage IIA the balance of late effects decides, not the cure rate."},"flag_note":null}}},{"id":"uro-hod-00007","version":1,"status":"published","taxonomy":{"subdomain":"Seminom Stadium II","tags":["operationstechnik","leitlinie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"kontrovers","flag":true},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2027-09-07"},"content":{"de":{"vignette":"Ein 30-jähriger Patient mit Seminom im Stadium IIA möchte weder eine Bestrahlung noch eine Chemotherapie und fragt nach der retroperitonealen Lymphadenektomie als Alternative.","lead_in":"Wie ist diese Option einzuordnen?","options":{"A":{"text":"Etablierter Standard und den anderen Verfahren überlegen","rationale":"Ein Überlegenheitsnachweis existiert nicht; Standard sind weiterhin Radiatio und Chemotherapie."},"B":{"text":"Beim Seminom grundsätzlich kontraindiziert","rationale":"Prospektive Studien haben sie geprüft; kontraindiziert ist sie nicht, sondern noch nicht als gleichwertig belegt."},"C":{"text":"Studienoption mit höheren Rezidivraten, kein Standard","rationale":"Der Reiz liegt im Verzicht auf beide Spätfolgenprofile. Die Rezidivraten waren in Serien höher als unter Standardtherapie, weshalb die Aufklärung darüber Teil der Entscheidung ist. Der Reiz liegt darin, weder zu bestrahlen noch zu chemotherapieren. In mehreren prospektiven Serien lagen die Rezidivraten jedoch über denen der Standardtherapie, weshalb die Behandlung an ein erfahrenes Zentrum oder in eine Studie gehört."},"D":{"text":"Ersetzt die Nachsorge, da kein Rezidiv mehr möglich ist","rationale":"Rezidive treten auch außerhalb des Ausräumungsgebietes auf; die Nachsorge bleibt unverzichtbar."}},"explanation":{"core":"Die retroperitoneale Lymphadenektomie beim Seminom im Stadium II ist ein Versuch, junge Männer weder zu bestrahlen noch zu chemotherapieren. Die vorliegenden prospektiven Serien zeigen eine hohe Rate an Tumorfreiheit ohne Systemtherapie, aber auch relevante Rezidivraten. Sie ist damit eine begründbare, aber erklärungsbedürftige Option.","teaching_point":"Beim Seminom im Stadium II ist die Lymphadenektomie eine Studienoption, kein Standard."},"flag_note":"Die Datenlage stützt sich auf prospektive Serien ohne randomisierten Vergleich; die Empfehlungen unterscheiden sich zwischen Zentren und Ländern. Vor Verwendung aktuellen Stand prüfen."},"en":{"vignette":"A 30-year-old man with stage IIA seminoma wants neither radiotherapy nor chemotherapy and asks about retroperitoneal lymph node dissection as an alternative.","lead_in":"How should this option be judged?","options":{"A":{"text":"An established standard and superior to the alternatives","rationale":"No superiority evidence exists; radiotherapy and chemotherapy remain standard."},"B":{"text":"Fundamentally contraindicated in seminoma","rationale":"Prospective studies have examined it; it is not contraindicated but not yet shown to be equivalent."},"C":{"text":"A trial option with higher relapse rates, not a standard","rationale":"Its appeal lies in avoiding both late-effect profiles. Relapse rates in series exceeded those of standard treatment, so counselling about this is part of the decision. Its appeal is avoiding both radiotherapy and chemotherapy. In several prospective series relapse rates nevertheless exceeded those of standard treatment, so treatment belongs in an experienced centre or a trial."},"D":{"text":"Replaces follow-up, since relapse is no longer possible","rationale":"Relapses also occur outside the dissection field; follow-up remains indispensable."}},"explanation":{"core":"Retroperitoneal lymph node dissection in stage II seminoma is an attempt to spare young men both radiotherapy and chemotherapy. Available prospective series show high rates of disease control without systemic therapy but also relevant relapse rates. It is therefore a defensible option that requires explanation.","teaching_point":"In stage II seminoma, lymphadenectomy is a trial option, not a standard."},"flag_note":"The evidence rests on prospective series without randomised comparison; recommendations differ between centres and countries. Check the current position before use."}}},{"id":"uro-hod-00008","version":1,"status":"published","taxonomy":{"subdomain":"Nichtseminom Stadium I","tags":["leitlinie","pathologie","nachsorge"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"26-jähriger Patient nach Ablatio, Histologie Nichtseminom pT1 ohne lymphovaskuläre Invasion. Marker vollständig normalisiert, CT unauffällig, klinisches Stadium I. Der Patient ist zuverlässig und wohnortnah angebunden.","lead_in":"Welches Vorgehen ist Standard?","options":{"A":{"text":"Ein Zyklus BEP adjuvant für alle Patienten im Stadium I","rationale":"Die adjuvante Gabe ist der Hochrisikogruppe mit lymphovaskulärer Invasion vorbehalten; ohne sie würde die Mehrheit unnötig behandelt."},"B":{"text":"Nervschonende retroperitoneale Lymphadenektomie beidseits","rationale":"Sie ist heute Sondersituationen vorbehalten und der Surveillance im Niedrigrisikostadium nicht überlegen."},"C":{"text":"Adjuvante Radiatio des Retroperitoneums nach festem Feld","rationale":"Beim Nichtseminom unwirksam."},"D":{"text":"Aktive Surveillance nach festem Nachsorgeschema","rationale":"Ohne lymphovaskuläre Invasion liegt das Rezidivrisiko bei etwa 15 Prozent, und Rezidive sind mit Chemotherapie sehr gut heilbar. Damit bleiben rund 85 Prozent unbehandelt. Ohne lymphovaskuläre Invasion liegt das Rezidivrisiko bei etwa 15 Prozent. Das Schema umfasst Markerkontrollen und Bildgebung in festgelegten Abständen."}},"explanation":{"core":"Im Stadium I des Nichtseminoms teilt die lymphovaskuläre Invasion die Patienten in zwei Gruppen mit sehr unterschiedlichem Rezidivrisiko. Ohne sie ist Surveillance der Standard, mit ihr wird ein Zyklus BEP empfohlen. In beiden Fällen liegt die Heilungsrate nahe hundert Prozent, es unterscheidet sich nur, wer behandelt wird.","teaching_point":"Ohne lymphovaskuläre Invasion wird beobachtet, nicht behandelt."},"flag_note":null},"en":{"vignette":"26-year-old man after orchiectomy, histology non-seminoma pT1 without lymphovascular invasion. Markers fully normalised, CT unremarkable, clinical stage I. He is reliable and lives close to the centre.","lead_in":"What is the standard approach?","options":{"A":{"text":"One adjuvant cycle of BEP for all stage I patients","rationale":"Adjuvant treatment is reserved for the high-risk group with lymphovascular invasion; otherwise the majority would be treated unnecessarily."},"B":{"text":"Bilateral nerve-sparing retroperitoneal lymph node dissection","rationale":"Today reserved for special situations and not superior to surveillance in low-risk stage I."},"C":{"text":"Adjuvant retroperitoneal radiotherapy to a fixed field","rationale":"Ineffective in non-seminoma."},"D":{"text":"Active surveillance on a defined follow-up schedule","rationale":"Without lymphovascular invasion the relapse risk is around 15 per cent, and relapses are highly curable with chemotherapy. Around 85 per cent thus remain untreated. Without lymphovascular invasion the relapse risk is around 15 per cent. The schedule comprises marker checks and imaging at defined intervals."}},"explanation":{"core":"In stage I non-seminoma, lymphovascular invasion splits patients into two groups with very different relapse risk. Without it surveillance is standard; with it one cycle of BEP is recommended. Cure rates approach one hundred per cent either way; only who gets treated differs.","teaching_point":"Without lymphovascular invasion you observe rather than treat."},"flag_note":null}}},{"id":"uro-hod-00009","version":1,"status":"published","taxonomy":{"subdomain":"Stadium IS","tags":["labordiagnostik","leitlinie","pharmakologie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"31-jähriger Patient nach Ablatio bei Nichtseminom. Das AFP fällt zunächst ab, steigt dann aber nach sechs Wochen wieder an. Beta-hCG normal. Die Bildgebung von Thorax, Abdomen und Becken bleibt unauffällig.","lead_in":"Wie ist der Befund einzuordnen und zu behandeln?","options":{"A":{"text":"Stadium IS; systemische Chemotherapie nach Prognosegruppe","rationale":"Der Markeranstieg beweist vitales Tumorgewebe, auch wenn die Bildgebung leer bleibt. Systemische Behandlung ist deshalb der richtige Weg. Der Markeranstieg beweist vitales Tumorgewebe außerhalb des entfernten Hodens, auch wenn die Bildgebung leer bleibt. Die Zyklenzahl richtet sich nach der IGCCCG-Gruppe."},"B":{"text":"Retroperitoneale Lymphadenektomie zur Suche des Herdes","rationale":"Bei steigenden Markern ohne Korrelat ist die Erkrankung nicht auf das Retroperitoneum begrenzt; die Operation griffe zu kurz."},"C":{"text":"Erneute Bildgebung in drei Monaten, da kein Herd sichtbar ist","rationale":"Abwarten bei steigendem AFP verschenkt Zeit und lässt die Tumorlast wachsen."},"D":{"text":"Bestrahlung des Retroperitoneums als Ort des Erstbefalls","rationale":"Beim Nichtseminom unwirksam und bei systemischer Erkrankung ohnehin falsch platziert."}},"explanation":{"core":"Der Markerverlauf nach der Ablatio ist eine eigenständige Stadieninformation. Fallen die Marker nicht entsprechend ihrer Halbwertszeit ab oder steigen sie wieder, liegt Stadium IS vor, unabhängig von der Bildgebung. Wichtig ist der Ausschluss falsch positiver Ursachen wie Leberschädigung beim AFP oder Hypogonadismus und Kreuzreaktion mit LH beim beta-hCG.","teaching_point":"Steigende Marker bedeuten systemische Erkrankung, auch wenn das CT leer ist."},"flag_note":null},"en":{"vignette":"31-year-old man after orchiectomy for non-seminoma. AFP initially falls but rises again after six weeks. Beta-hCG is normal. Imaging of chest, abdomen and pelvis remains unremarkable.","lead_in":"How should this be classified and treated?","options":{"A":{"text":"Stage IS; systemic chemotherapy by prognostic group","rationale":"A rising marker proves viable tumour even when imaging is blank. Systemic treatment is therefore the correct route. The marker rise proves viable tumour outside the removed testis even when imaging is blank. The number of cycles follows the IGCCCG group."},"B":{"text":"Retroperitoneal lymph node dissection to find the focus","rationale":"With rising markers and no correlate the disease is not confined to the retroperitoneum; surgery would fall short."},"C":{"text":"Repeat imaging in three months, since no focus is visible","rationale":"Waiting with a rising AFP loses time and lets the tumour burden grow."},"D":{"text":"Retroperitoneal radiotherapy as the site of first spread","rationale":"Ineffective in non-seminoma and misplaced in systemic disease anyway."}},"explanation":{"core":"The marker trajectory after orchiectomy is staging information in its own right. If markers fail to fall according to their half-life or rise again, stage IS is present regardless of imaging. False positives must be excluded: liver damage for AFP, hypogonadism and cross-reaction with LH for beta-hCG.","teaching_point":"Rising markers mean systemic disease even when the CT is blank."},"flag_note":null}}},{"id":"uro-hod-00010","version":1,"status":"published","taxonomy":{"subdomain":"retroperitoneale Lymphadenektomie","tags":["operationstechnik","leitlinie","pathologie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expi
