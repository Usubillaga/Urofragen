,"flag_note":null}}},{"id":"uro-pca-00015","version":1,"status":"published","taxonomy":{"subdomain":"mHSPC","tags":["leitlinie","dosierung","pruefungsrelevant-hoch"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"STAMPEDE Arm H, Lancet 2018"},{"type":"leitlinie","code":"AWMF 043-022OL","title":"S3-Leitlinie Prostatakarzinom","version":"8.1","year":2025}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"71-jähriger Patient mit hormonsensitivem metastasiertem Prostatakarzinom, zwei ossäre Läsionen in der Lendenwirbelsäule, keine viszeralen Metastasen. Geringe Metastasenlast. ECOG 1, gute Blasenfunktion, keine entzündliche Darmerkrankung.","lead_in":"Welche zusätzliche Maßnahme zur Systemtherapie ist begründet?","options":{"A":{"text":"Bestrahlung des Primärtumors zusätzlich zur Systemtherapie","rationale":"Der Überlebensvorteil war auf die Gruppe mit geringer Last beschränkt und in der Gruppe mit hoher Last nicht nachweisbar. Die Bestrahlung ist gut verträglich, weshalb sie bei dieser Konstellation regelhaft angeboten wird. Der Überlebensvorteil wurde in einer randomisierten Studie ausschließlich für die Gruppe mit geringer Metastasenlast gezeigt; bei hoher Last blieb er aus."},"B":{"text":"Radikale Prostatektomie als Lokaltherapie statt Bestrahlung","rationale":"Für die Operation des Primärtumors bei metastasierter Erkrankung fehlt der randomisierte Nachweis eines Überlebensvorteils. Die verfügbare Evidenz betrifft die Bestrahlung, weshalb diese das etablierte Verfahren ist."},"C":{"text":"Stereotaktische Bestrahlung aller Metastasen statt Systemtherapie","rationale":"Die metastasengerichtete Therapie wird bei oligometastasierter Erkrankung untersucht, ersetzt aber die systemische Behandlung nicht. Ein Verzicht auf die Androgendeprivation wäre in dieser Situation nicht vertretbar."},"D":{"text":"Keine Lokaltherapie bei nachgewiesener Metastasierung","rationale":"Diese Auffassung war lange üblich und ist durch STAMPEDE widerlegt. Bei geringer Last leistet die Kontrolle des Primärtumors einen messbaren Beitrag zum Überleben."}},"explanation":{"core":"Die Bestrahlung des Primärtumors bei metastasierter Erkrankung ist eines der wenigen Beispiele, in denen eine Lokaltherapie bei systemischer Erkrankung das Überleben verlängert, und zwar ausschließlich bei geringer Metastasenlast. Sie tritt zur Systemtherapie hinzu und ersetzt sie nicht. Für die Prüfung sind drei Dinge zu trennen: die Systemtherapie mit Androgendeprivation plus ARPI, die Frage der Chemotherapie nach Last und Chemotauglichkeit, und die Frage der Lokaltherapie nach Last.","teaching_point":"Prostatabestrahlung nur bei geringer Last, und immer zusätzlich zur Systemtherapie."},"flag_note":null},"en":{"vignette":"71-year-old man with hormone-sensitive metastatic prostate cancer, two osseous lesions in the lumbar spine, no visceral metastases. Low metastatic burden. ECOG 1, good bladder function, no inflammatory bowel disease.","lead_in":"Which additional measure alongside systemic therapy is justified?","options":{"A":{"text":"Radiotherapy to the primary tumour in addition to systemic therapy","rationale":"The survival benefit was confined to the low-burden group and was not demonstrable in high burden. Radiotherapy is well tolerated, which is why it is routinely offered in this constellation. The survival benefit was shown in a randomised trial only in the low metastatic burden group; it was absent in high burden."},"B":{"text":"Radical prostatectomy as local therapy instead of radiotherapy","rationale":"Randomised evidence of a survival benefit for surgery of the primary in metastatic disease is lacking. The available evidence concerns radiotherapy, which is therefore the established modality."},"C":{"text":"Stereotactic radiotherapy to all metastases instead of systemic therapy","rationale":"Metastasis-directed therapy is under investigation in oligometastatic disease but does not replace systemic treatment. Omitting androgen deprivation would not be defensible here."},"D":{"text":"No local therapy once metastases are documented","rationale":"This view was long customary and has been refuted by STAMPEDE. In low burden, controlling the primary makes a measurable contribution to survival."}},"explanation":{"core":"Radiotherapy to the primary in metastatic disease is one of the few examples where local therapy prolongs survival in systemic disease, and only in low metastatic burden. It is added to systemic therapy and does not replace it. For the exam three questions must be kept apart: systemic therapy with androgen deprivation plus an ARPI, the question of chemotherapy according to burden and fitness, and the question of local therapy according to burden.","teaching_point":"Prostate radiotherapy only in low burden, and always in addition to systemic therapy."},"flag_note":null}}},{"id":"uro-pca-00016","version":1,"status":"published","taxonomy":{"subdomain":"mCRPC","tags":["leitlinie","pharmakologie","dosierung"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"CARD, N Engl J Med 2019"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"70-jähriger Patient, vor 14 Monaten mHSPC mit Androgendeprivation plus Abirateron behandelt. Jetzt PSA-Anstieg, neue ossäre Läsionen, Testosteron 12 ng/dl. ECOG 1, Neuropathie Grad 0, Neutrophile normal. Er fragt, ob man nicht einfach auf Enzalutamid wechseln könne.","lead_in":"Wie ist zu antworten?","options":{"A":{"text":"Ja, Wechsel von Abirateron auf Enzalutamid","rationale":"Beide Substanzen greifen in dieselbe Achse ein, weshalb nach Versagen der einen die andere nur kurze und seltene Ansprechen erzielt. Die Kreuzresistenz innerhalb der Androgenrezeptorachse ist der zentrale Punkt dieser Frage."},"B":{"text":"Ja, zuvor die Androgendeprivation pausieren","rationale":"Die Kastration wird im kastrationsresistenten Stadium lebenslang fortgeführt, weil sonst der Testosteronanstieg die Erkrankung zusätzlich stimuliert. Das Absetzen des Antiandrogens ist ein anderes, historisch beschriebenes Phänomen von geringer klinischer Bedeutung."},"C":{"text":"Nein, unmittelbar Radioligandentherapie einleiten","rationale":"Die Radioligandentherapie ist nach Versagen einer ARPI und einer Taxanchemotherapie zugelassen. Dieser Patient hat noch keine Chemotherapie erhalten, sodass die Reihenfolge nicht erfüllt wäre."},"D":{"text":"Nein, Wechsel der Wirkklasse auf Docetaxel","rationale":"Nach Progress unter einer ARPI ist die Taxanchemotherapie die wirksamere Alternative zur zweiten ARPI. CARD zeigte für Cabazitaxel eine Überlegenheit gegenüber dem ARPI-Wechsel, was das Prinzip des Klassenwechsels belegt. Docetaxel wird mit 75 mg/m² alle drei Wochen gegeben. Parallel sollte auf Alterationen der homologen Rekombination getestet werden, weil sich daraus eine PARP-gerichtete Option ergeben kann."}},"explanation":{"core":"Die Sequenz im mCRPC folgt einem einfachen Prinzip: Nach Versagen einer Substanz wird die Wirkklasse gewechselt, nicht die Substanz innerhalb derselben Klasse. Abirateron und Enzalutamid wirken beide über die Androgenrezeptorachse, weshalb nacheinander gegeben nur geringe Ansprechraten und kurze Dauer erreicht werden. Der Klassenwechsel führt zu Taxanen, zur Radioligandentherapie nach Taxan, oder bei entsprechender Molekularpathologie zu PARP-Inhibitoren.","teaching_point":"Nach ARPI kommt kein zweites ARPI, sondern eine andere Wirkklasse."},"flag_note":null},"en":{"vignette":"70-year-old man treated 14 months ago for mHSPC with androgen deprivation plus abiraterone. He now has a rising PSA, new osseous lesions and testosterone of 12 ng/dl. ECOG 1, no neuropathy, normal neutrophils. He asks whether he could simply switch to enzalutamide.","lead_in":"How should he be answered?","options":{"A":{"text":"Yes, switch from abiraterone to enzalutamide","rationale":"Both agents act on the same axis, so after failure of one the other achieves only brief and infrequent responses. Cross-resistance within the androgen receptor axis is the central point of this question."},"B":{"text":"Yes, but pause androgen deprivation first","rationale":"Castration is continued lifelong in the castration-resistant setting, because otherwise rising testosterone further stimulates the disease. Antiandrogen withdrawal is a different, historically described phenomenon of limited clinical importance."},"C":{"text":"No, start radioligand therapy immediately","rationale":"Radioligand therapy is approved after failure of an ARPI and a taxane. This patient has had no chemotherapy, so the required sequence is not fulfilled."},"D":{"text":"No, switch drug class to docetaxel","rationale":"After progression on an ARPI, taxane chemotherapy is the more effective alternative to a second ARPI. CARD showed superiority of cabazitaxel over an ARPI switch, demonstrating the principle of changing class. Docetaxel is given at 75 mg/m² every three weeks. Testing for homologous recombination alterations should run in parallel, since it may open a PARP-directed option."}},"explanation":{"core":"Sequencing in mCRPC follows a simple principle: after failure of one agent the drug class is changed rather than the agent within the same class. Abiraterone and enzalutamide both act through the androgen receptor axis, so given consecutively they achieve only low response rates of short duration. Changing class leads to taxanes, to radioligand therapy after a taxane, or, with the corresponding molecular pathology, to PARP inhibitors.","teaching_point":"After an ARPI comes not a second ARPI but a different drug class."},"flag_note":null}}},{"id":"uro-pca-00017","version":1,"status":"published","taxonomy":{"subdomain":"molekulare Diagnostik","tags":["labordiagnostik","pharmakologie","dosierung","leitlinie"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"PROfound, N Engl J Med 2020"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"64-jähriger Patient mit metastasiertem kastrationsresistentem Prostatakarzinom nach Abirateron und Docetaxel. Die Schwester erkrankte mit 44 Jahren an einem Mammakarzinom, ein Onkel väterlicherseits an einem Pankreaskarzinom. Bisher wurde keine molekulare Diagnostik veranlasst.","lead_in":"Welches Vorgehen ist angezeigt?","options":{"A":{"text":"Keine molekulare Diagnostik, da in diesem Alter ohne Konsequenz","rationale":"Das Alter ist kein Ausschlusskriterium. Die Testung wird bei metastasierter Erkrankung unabhängig vom Alter empfohlen, und die vorliegende Familienanamnese verstärkt die Indikation zusätzlich."},"B":{"text":"Tumorgewebe auf HRR-Alterationen und zusätzlich Keimbahn testen","rationale":"Die somatische Testung erschließt die Therapieoption, die Keimbahntestung zusätzlich die Beratung von Angehörigen mit Konsequenzen für deren Brust-, Ovarial- und Pankreasvorsorge. Beide Ebenen sind nicht austauschbar, weil ein Teil der Alterationen nur somatisch vorliegt. Bei nachgewiesener BRCA1- oder BRCA2-Alteration kommt Olaparib mit 300 mg zweimal täglich infrage. Zusätzlich ist auf Mikrosatelliteninstabilität zu prüfen, weil sich daraus eine Immuntherapieoption ergibt."},"C":{"text":"Nur Keimbahntestung, da nur vererbte Varianten behandelbar sind","rationale":"PARP-Inhibitoren wirken auch bei rein somatischen Alterationen. Eine alleinige Keimbahntestung übersähe einen erheblichen Teil der behandelbaren Patienten."},"D":{"text":"PARP-Inhibitor ohne vorherige Testung wegen der Familienanamnese","rationale":"Die Familienanamnese erhöht die Wahrscheinlichkeit, ersetzt aber den Nachweis nicht. Ein Behandlungsversuch ohne Nachweis wäre weder zugelassen noch sinnvoll, da die Wirksamkeit an die Alteration gebunden ist."}},"explanation":{"core":"Die molekulare Diagnostik gehört beim metastasierten Prostatakarzinom in die Routine und hat zwei getrennte Zwecke. Somatisch erschließt sie PARP-Inhibitoren bei Alterationen der homologen Rekombination, wobei BRCA2 die häufigste und prognostisch bedeutsamste ist, sowie Pembrolizumab bei Mikrosatelliteninstabilität. In der Keimbahn erschließt sie die Beratung der Familie. Der richtige Zeitpunkt ist früh, weil das Ergebnis die Sequenz beeinflusst und die Analyse Wochen dauern kann.","teaching_point":"Somatisch für die Therapie, Keimbahn für die Familie. Beides, nicht eines von beiden."},"flag_note":null},"en":{"vignette":"64-year-old man with metastatic castration-resistant prostate cancer after abiraterone and docetaxel. His sister developed breast cancer at 44 and a paternal uncle pancreatic cancer. No molecular testing has been arranged so far.","lead_in":"What should be done?","options":{"A":{"text":"No molecular testing, since at this age it has no consequence","rationale":"Age is not an exclusion criterion. Testing is recommended in metastatic disease irrespective of age, and this family history strengthens the indication further."},"B":{"text":"Test tumour tissue for HRR alterations and add germline testing","rationale":"Somatic testing opens the treatment option; germline testing additionally enables counselling of relatives with consequences for their breast, ovarian and pancreatic surveillance. The two levels are not interchangeable, because a proportion of alterations are somatic only. With a documented BRCA1 or BRCA2 alteration, olaparib 300 mg twice daily is an option. Microsatellite instability should also be assessed, since it opens an immunotherapy option."},"C":{"text":"Germline testing only, since only inherited variants are treatable","rationale":"PARP inhibitors also work with purely somatic alterations. Germline testing alone would miss a substantial proportion of treatable patients."},"D":{"text":"Start a PARP inhibitor without prior testing given the family history","rationale":"Family history raises the probability but does not replace demonstration. A treatment trial without proof would be neither licensed nor sensible, since efficacy is tied to the alteration."}},"explanation":{"core":"Molecular testing belongs to routine care in metastatic prostate cancer and serves two separate purposes. Somatically it opens PARP inhibitors in homologous recombination alterations, of which BRCA2 is the commonest and prognostically most important, and pembrolizumab in microsatellite instability. In the germline it enables family counselling. The right timing is early, because the result influences sequencing and the analysis can take weeks.","teaching_point":"Somatic for the treatment, germline for the family. Both, not one of them."},"flag_note":null}}},{"id":"uro-pca-00018","version":1,"status":"published","taxonomy":{"subdomain":"Radioligandentherapie","tags":["pharmakologie","dosierung","bildgebung","zulassung"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"VISION, N Engl J Med 2021"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"73-jähriger Patient mit mCRPC nach Enzalutamid und Docetaxel, erneuter Progress mit multiplen ossären und wenigen nodalen Metastasen. ECOG 1, Hämoglobin 10,8 g/dl, Thrombozyten 160 000 pro Mikroliter, GFR 62 ml/min.","lead_in":"Welche Voraussetzungen müssen vor einer Radioligandentherapie geprüft werden?","options":{"A":{"text":"PSA über 100 ng/ml als alleinige Indikationsgrenze","rationale":"Der PSA-Wert steuert die Indikation nicht. Entscheidend sind Vortherapien, die PSMA-Expression im Bild und die Organfunktionen, insbesondere Knochenmarkreserve und Niere."},"B":{"text":"Skelettszintigraphie als alleinige Bildgebung vor Therapiebeginn","rationale":"Die Szintigraphie zeigt die Knochenbeteiligung, nicht aber die Zielstruktur der Therapie. Ohne Nachweis einer ausreichenden PSMA-Expression fehlt das Bindeglied zwischen Substanz und Tumor."},"C":{"text":"PSMA-Aufnahme in allen Läsionen, Vorbehandlung mit ARPI und Taxan","rationale":"Die Therapie wirkt nur, wo das Ziel exprimiert wird, weshalb PSMA-negative Läsionen ein Ausschlusskriterium darstellen. Die Sequenzvoraussetzung stammt unmittelbar aus dem Studiendesign, aus dem sich auch die Zulassung ableitet. Zusätzlich müssen Knochenmark- und Nierenfunktion ausreichen. Die Gabe erfolgt mit 7,4 GBq alle sechs Wochen über bis zu sechs Zyklen. Entscheidend ist, dass keine relevante Läsion PSMA-negativ ist, weil diese von der Therapie nicht erreicht wird."},"D":{"text":"Nierenfunktionsprüfung entbehrlich, da die Substanz hepatisch eliminiert wird","rationale":"Die Ausscheidung erfolgt überwiegend renal, weshalb Nierenfunktion und Harnabfluss vorher zu klären sind. Speicheldrüsen, Nieren und Knochenmark sind die typischen Organe der Nebenwirkungen."}},"explanation":{"core":"Die Radioligandentherapie ist das erste Beispiel einer bildgesteuerten Systemtherapie beim Prostatakarzinom: Dasselbe Molekül dient zur Darstellung und zur Behandlung. Daraus folgt die Logik der Voraussetzungen. Erstens muss das Ziel im Bild vorhanden sein, zweitens muss die vorgeschriebene Sequenz aus ARPI und Taxan durchlaufen sein, drittens müssen die Organe, die die Substanz belastet, dies aushalten. Häufige Nebenwirkungen sind Mundtrockenheit, Fatigue und Zytopenien.","teaching_point":"Kein PSMA im Bild, keine PSMA-Therapie. Das Bild ist die Indikation."},"flag_note":null},"en":{"vignette":"73-year-old man with mCRPC after enzalutamide and docetaxel, now progressing with multiple osseous and a few nodal metastases. ECOG 1, haemoglobin 10.8 g/dl, platelets 160,000 per microlitre, GFR 62 ml/min.","lead_in":"Which prerequisites must be checked before radioligand therapy?","options":{"A":{"text":"PSA above 100 ng/ml as the sole threshold for treatment","rationale":"PSA does not govern the indication. What matters is prior treatment, PSMA expression on imaging and organ function, particularly marrow reserve and kidneys."},"B":{"text":"Bone scintigraphy as the only imaging before treatment begins","rationale":"Scintigraphy shows bone involvement but not the target of the therapy. Without evidence of sufficient PSMA expression the link between drug and tumour is missing."},"C":{"text":"PSMA uptake in all lesions, prior treatment with an ARPI and a taxane","rationale":"The therapy works only where the target is expressed, so PSMA-negative lesions are an exclusion criterion. The sequence requirement comes directly from the trial design, from which the approval is derived. Bone marrow and renal function must also be adequate. Dosing is 7.4 GBq every six weeks for up to six cycles. The decisive point is that no relevant lesion is PSMA-negative, since such lesions are not reached by the therapy."},"D":{"text":"Renal function testing unnecessary, since the agent is eliminated hepatically","rationale":"Excretion is predominantly renal, so renal function and urinary drainage must be clarified beforehand. Salivary glands, kidneys and bone marrow are the typical organs affected by side effects."}},"explanation":{"core":"Radioligand therapy is the first example of image-guided systemic treatment in prostate cancer: the same molecule serves for imaging and for treatment. The logic of the prerequisites follows from this. First the target must be visible on imaging, second the prescribed sequence of ARPI and taxane must have been completed, third the organs burdened by the agent must tolerate it. Common side effects are dry mouth, fatigue and cytopenias.","teaching_point":"No PSMA on the scan, no PSMA therapy. The image is the indication."},"flag_note":null}}},{"id":"uro-pca-00019","version":1,"status":"published","taxonomy":{"subdomain":"Radium-223","tags":["pharmakologie","dosierung","nebenwirkungen","komplikationsmanagement"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"ALSYMPCA; ERA-223"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"76-jähriger Patient mit mCRPC und ausschließlich ossären, schmerzhaften Metastasen. Keine viszeralen Metastasen, keine messbare Lymphadenopathie. Ein Kollege schlägt vor, Radium-223 zusammen mit Abirateron und Prednison zu geben, um zwei Wirkprinzipien zu kombinieren.","lead_in":"Wie ist dieser Vorschlag zu bewerten?","options":{"A":{"text":"Abzulehnen: Die Kombination erhöht die Frakturrate ohne Überlebensvorteil","rationale":"ERA-223 wurde wegen der Häufung von Frakturen vorzeitig entblindet. Der Schaden entstand vor allem bei Patienten ohne knochenschützende Begleitmedikation, weshalb diese heute verpflichtend ist. Radium-223 wird bei symptomatischen, rein ossären Metastasen mit 55 kBq pro Kilogramm alle vier Wochen über sechs Zyklen gegeben, immer zusammen mit einem knochenschützenden Präparat."},"B":{"text":"Zu befürworten, da beide Substanzen additiv am Knochen angreifen","rationale":"Die theoretische Überlegung ist nachvollziehbar, wurde aber geprüft und widerlegt. Die Studie zeigte gerade nicht die erwartete Addition, sondern eine Zunahme skelettaler Ereignisse."},"C":{"text":"Zu befürworten, sofern auf ein knochenschützendes Präparat verzichtet wird","rationale":"Das kehrt die Konsequenz aus der Studie um. Der Verzicht auf die Knochenprotektion war mit der höchsten Frakturrate verbunden."},"D":{"text":"Abzulehnen, da Radium-223 viszerale Metastasen voraussetzt","rationale":"Das Gegenteil trifft zu: Viszerale Metastasen sind eine Kontraindikation, da die Substanz als Calciumanalogon ausschließlich im Knochenumbau angereichert wird."}},"explanation":{"core":"Radium-223 ist ein Calciumanalogon, das sich in Bereichen gesteigerten Knochenumbaus anreichert und dort über Alphastrahlung mit kurzer Reichweite wirkt. Daraus ergeben sich Indikation und Grenzen: symptomatische ossäre Metastasen ja, viszerale Metastasen nein. Die Kombination mit Abirateron ist wegen der Frakturhäufung verlassen, und eine knochenschützende Begleitmedikation gehört obligat dazu. Vor Beginn ist eine zahnärztliche Untersuchung sinnvoll, da diese Präparate eine Kiefernekrose auslösen können.","teaching_point":"Radium-223 geht in den Knochen. Wer viszerale Metastasen hat, profitiert nicht."},"flag_note":null},"en":{"vignette":"76-year-old man with mCRPC and exclusively osseous, painful metastases. No visceral metastases, no measurable lymphadenopathy. A colleague proposes giving radium-223 together with abiraterone and prednisone to combine two mechanisms.","lead_in":"How should this proposal be judged?","options":{"A":{"text":"Reject: the combination raises fracture rates without a survival gain","rationale":"ERA-223 was unblinded early because of an excess of fractures. The harm arose chiefly in patients without concomitant bone protection, which is why this is now mandatory. Radium-223 is given for symptomatic, bone-only metastases at 55 kBq per kilogram every four weeks for six cycles, always together with a bone-protective agent."},"B":{"text":"Endorse, because both agents act additively on bone metastases","rationale":"The theoretical reasoning is understandable but was tested and refuted. The trial showed not the expected addition but an increase in skeletal events."},"C":{"text":"Endorse, provided that a bone-protective agent is not given alongside","rationale":"This inverts the conclusion from the trial. Omitting bone protection was associated with the highest fracture rate."},"D":{"text":"Reject, because radium-223 requires visceral metastases","rationale":"The opposite is true: visceral metastases are a contraindication, since as a calcium analogue the agent accumulates exclusively in areas of bone turnover."}},"explanation":{"core":"Radium-223 is a calcium analogue that accumulates in areas of increased bone turnover and acts there through short-range alpha radiation. Indication and limits follow from this: symptomatic osseous metastases yes, visceral metastases no. Combination with abiraterone has been abandoned because of excess fractures, and concomitant bone protection is obligatory. A dental assessment before starting is advisable, since these agents can cause jaw necrosis.","teaching_point":"Radium-223 goes into bone. Patients with visceral metastases do not benefit."},"flag_note":null}}},{"id":"uro-pca-00020","version":1,"status":"published","taxonomy":{"subdomain":"Knochenschutz","tags":["pharmakologie","dosierung","nebenwirkungen","pruefungsrelevant-hoch"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Zwei Patienten unter Androgendeprivation. Der erste hat ein hormonsensitives Karzinom mit zwei ossären Metastasen und normaler Knochendichte. Der zweite ist kastrationsresistent mit ausgedehnter ossärer Metastasierung und hatte vor drei Monaten eine pathologische Fraktur.","lead_in":"Wie unterscheidet sich die knochengerichtete Therapie?","options":{"A":{"text":"Beide Patienten Denosumab 60 mg alle sechs Monate","rationale":"Die beiden Situationen verfolgen unterschiedliche Ziele und arbeiten deshalb mit unterschiedlichen Dosen und Intervallen. Eine einheitliche Gabe wäre entweder unter- oder überdosiert."},"B":{"text":"Erster 120 mg alle vier Wochen, zweiter 60 mg alle sechs Monate","rationale":"Die Zuordnung ist vertauscht. Die hochdosierte Gabe gehört zum kastrationsresistenten Stadium mit manifester Skelettbeteiligung, die niedrig dosierte zur Prophylaxe des therapieinduzierten Knochenverlustes."},"C":{"text":"Beide Patienten Denosumab 120 mg alle vier Wochen","rationale":"Die Androgendeprivation senkt die Knochendichte unabhängig vom Ausgangsbefund messbar, weshalb Risikoerfassung und Basismaßnahmen bei allen Patienten unter Langzeitentzug erfolgen."},"D":{"text":"Erster 60 mg alle sechs Monate, zweiter 120 mg alle vier Wochen","rationale":"Die niedrige Dosis schützt die Knochendichte unter Hormonentzug, die hohe Dosis verhindert Frakturen, Bestrahlungen und Rückenmarkkompressionen bei manifesten Metastasen. Die Kiefernekrose ist bei der hohen Dosis deutlich häufiger, weshalb die Zahnsanierung vorher erfolgt. Alternativ zur hochdosierten Gabe kann Zoledronsäure alle drei bis vier Wochen eingesetzt werden. In beiden Situationen gehören Calcium und Vitamin D dazu, und vor Beginn ist eine zahnärztliche Untersuchung erforderlich."}},"explanation":{"core":"Knochengerichtete Therapie beim Prostatakarzinom folgt zwei getrennten Logiken, die im Alltag regelmäßig verwechselt werden. Die eine ist die Prophylaxe des durch die Androgendeprivation verursachten Knochenverlustes, mit niedriger Dosis und langem Intervall bei allen Patienten unter Langzeitentzug. Die andere ist die Prävention skelettaler Komplikationen bei manifesten Knochenmetastasen im kastrationsresistenten Stadium, mit hoher Dosis und kurzem Intervall. Beide verlangen Calcium, Vitamin D und Zahnstatus.","teaching_point":"Sechzig Milligramm halbjährlich schützt die Dichte, hundertzwanzig Milligramm monatlich verhindert Ereignisse."},"flag_note":null},"en":{"vignette":"Two patients on androgen deprivation. The first has hormone-sensitive disease with two osseous metastases and normal bone density. The second is castration-resistant with extensive osseous metastases and had a pathological fracture three months ago.","lead_in":"How does bone-directed treatment differ?","options":{"A":{"text":"Both patients denosumab 60 mg every six months","rationale":"The two situations pursue different aims and therefore use different doses and intervals. A uniform regimen would be either under- or overdosed."},"B":{"text":"First 120 mg every four weeks, second 60 mg every six months","rationale":"The assignment is reversed. High-dose treatment belongs to the castration-resistant setting with manifest skeletal involvement, low-dose to prophylaxis of treatment-induced bone loss."},"C":{"text":"Both patients denosumab 120 mg every four weeks","rationale":"Androgen deprivation measurably lowers bone density regardless of baseline, so risk assessment and basic measures apply to all patients on long-term deprivation."},"D":{"text":"First 60 mg every six months, second 120 mg every four weeks","rationale":"The low dose protects bone density under hormonal deprivation, the high dose prevents fractures, radiotherapy and cord compression in manifest metastases. Jaw necrosis is markedly more frequent with the high dose, which is why dental treatment precedes it. Zoledronic acid every three to four weeks is an alternative to the high-dose schedule. Calcium and vitamin D belong to both situations, and a dental examination is required before starting."}},"explanation":{"core":"Bone-directed treatment in prostate cancer follows two separate logics that are regularly confused in practice. One is prophylaxis of bone loss caused by androgen deprivation, at low dose and long interval in all patients on long-term treatment. The other is prevention of skeletal complications in manifest bone metastases in the castration-resistant setting, at high dose and short interval. Both require calcium, vitamin D and dental assessment.","teaching_point":"Sixty milligrams every six months protects density; one hundred and twenty milligrams monthly prevents events."},"flag_note":null}}},{"id":"uro-pca-00021","version":1,"status":"published","taxonomy":{"subdomain":"onkologischer Notfall","tags":["notfall","bildgebung","komplikationsmanagement"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"74-jähriger Patient mit bekanntem ossär metastasiertem Prostatakarzinom, seit zwei Tagen zunehmende Gürtelschmerzen im mittleren Rücken, seit heute Morgen Gangunsicherheit und Kribbeln in beiden Beinen. Blasenentleerung erschwert, Restharn 350 ml.","lead_in":"Wie ist vorzugehen?","options":{"A":{"text":"Analgesie und ambulante MRT innerhalb der nächsten Woche","rationale":"Die neurologische Erholung hängt unmittelbar davon ab, wie lange die Kompression besteht. Eine Verzögerung um Tage entscheidet häufig über bleibende Querschnittsymptomatik."},"B":{"text":"Sofort Dexamethason und notfallmäßige MRT der Wirbelsäule","rationale":"Das Steroid reduziert das perifokale Ödem sofort und überbrückt die Zeit bis zur definitiven Therapie. Die gesamte Wirbelsäule wird abgebildet, weil mehrere Etagen betroffen sein können und dies die Bestrahlungsplanung ändert. Die MRT muss die gesamte Wirbelsäule erfassen, weil in einem erheblichen Anteil weitere, klinisch stumme Kompressionsstellen vorliegen. Anschließend wird unverzüglich über Dekompression oder Bestrahlung entschieden; bei hormonsensitiver Erkrankung beginnt zugleich die Androgendeprivation."},"C":{"text":"Skelettszintigraphie zur Lokalisation der ursächlichen Metastase","rationale":"Die Szintigraphie zeigt Knochenumbau, nicht die Kompression des Myelons. Sie beantwortet die entscheidende Frage nicht und kostet Zeit."},"D":{"text":"Zunächst Blasenkatheter, weitere Diagnostik am Folgetag","rationale":"Die Katheterisierung ist richtig, aber nur ein Teilschritt. Die Blasenentleerungsstörung ist hier Symptom der Kompression und ein Warnzeichen für ein bereits fortgeschrittenes Stadium."}},"explanation":{"core":"Die metastatische Rückenmarkkompression ist der zeitkritischste Notfall der urologischen Onkologie. Rückenschmerz mit neu aufgetretener Gangstörung, sensiblen Ausfällen oder Blasen- und Mastdarmstörung erzwingt die sofortige Bildgebung der gesamten Wirbelsäule. Der prognostisch wichtigste Faktor ist der neurologische Status zu Behandlungsbeginn: Wer gehfähig ankommt, bleibt es meist, wer bereits gelähmt ist, erholt sich selten. Deshalb wird nicht terminiert, sondern behandelt.","teaching_point":"Rückenschmerz plus neurologisches Defizit beim Knochenmetastasierten heißt heute, nicht nächste Woche."},"flag_note":null},"en":{"vignette":"74-year-old man with known bone-metastatic prostate cancer, two days of increasing band-like mid-back pain and, since this morning, unsteady gait and tingling in both legs. Voiding is difficult with a residual of 350 ml.","lead_in":"How should this be managed?","options":{"A":{"text":"Analgesia and an outpatient MRI within the next week","rationale":"Neurological recovery depends directly on how long the compression has existed. A delay of days often decides whether cord damage becomes permanent."},"B":{"text":"Immediate dexamethasone and emergency MRI of the spine","rationale":"The steroid reduces perifocal oedema immediately and bridges the time to definitive treatment. The whole spine is imaged because several levels can be involved, which changes radiotherapy planning. The MRI must cover the whole spine, because a substantial proportion have further, clinically silent sites of compression. A decision on decompression or radiotherapy then follows without delay; in hormone-sensitive disease androgen deprivation starts at the same time."},"C":{"text":"Bone scintigraphy to localise the responsible metastasis","rationale":"Scintigraphy shows bone turnover, not cord compression. It does not answer the decisive question and costs time."},"D":{"text":"Catheterise the bladder first, further workup the next day","rationale":"Catheterisation is correct but only one step. The voiding difficulty here is a symptom of compression and a warning sign of already advanced involvement."}},"explanation":{"core":"Metastatic spinal cord compression is the most time-critical emergency in urological oncology. Back pain with new gait disturbance, sensory deficits or bladder and bowel dysfunction compels immediate imaging of the whole spine. The most important prognostic factor is neurological status at the start of treatment: patients who arrive walking usually keep walking, those already paralysed rarely recover. Hence one treats rather than schedules.","teaching_point":"Back pain plus a neurological deficit in a bone-metastatic patient means today, not next week."},"flag_note":null}}},{"id":"uro-pca-00022","version":1,"status":"published","taxonomy":{"subdomain":"Kastrationsresistenz","tags":["labordiagnostik","leitlinie","pruefungsrelevant-hoch"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"69-jähriger Patient unter dreimonatlicher Depotgabe eines LHRH-Analogons wegen metastasierter Erkrankung. Der PSA-Wert steigt über drei Messungen von 2,1 auf 6,4 ng/ml. Der letzte Depotwechsel liegt vier Monate zurück, weil ein Termin ausgefallen ist. Ein Testosteronwert wurde zuletzt vor zwei Jahren bestimmt.","lead_in":"Was ist vor der Diagnose einer Kastrationsresistenz zu tun?","options":{"A":{"text":"Sofort eine ARPI beginnen, da drei PSA-Anstiege vorliegen","rationale":"Der PSA-Anstieg allein reicht nicht. Ohne nachgewiesenes Kastrationsniveau wäre die Diagnose falsch und der Patient erhielte eine Therapieeskalation, obwohl lediglich die Basistherapie unwirksam war."},"B":{"text":"Auf Orchiektomie umstellen, da das Depot versagt hat","rationale":"Ein voreiliger Schluss. Zunächst ist zu messen, ob das Testosteron tatsächlich über dem Kastrationsniveau liegt; häufig ist schlicht das Intervall überschritten worden."},"C":{"text":"Serum-Testosteron bestimmen und das Kastrationsniveau sichern","rationale":"Die Definition verlangt beide Bedingungen gleichzeitig. Ein überschrittenes Injektionsintervall ist eine häufige und leicht korrigierbare Ursache eines PSA-Anstiegs, die keine Resistenz darstellt. Erst bei nachgewiesenem Testosteron unter 50 ng/dl und zusätzlichem PSA- oder radiologischem Progress ist von Kastrationsresistenz zu sprechen. Die Androgendeprivation wird dabei in jedem Fall fortgeführt, weil sonst der Androgenrezeptor wieder voll stimuliert würde."},"D":{"text":"Die Androgendeprivation beenden, da sie offensichtlich unwirksam ist","rationale":"Das Beenden lässt das Testosteron ansteigen und stimuliert die Erkrankung zusätzlich. Die Kastration wird lebenslang fortgeführt, auch wenn weitere Substanzen hinzukommen."}},"explanation":{"core":"Kastrationsresistenz ist eine Definition aus zwei Bedingungen und nicht ein PSA-Verlauf allein. Erforderlich sind ein Testosteron unter 50 ng/dl und ein Progress, entweder biochemisch mit mehreren Anstiegen über einem Ausgangswert oder radiologisch mit neuen Läsionen. Die häufigste vermeidbare Fehldiagnose entsteht durch überschrittene Injektionsintervalle oder unzureichende Suppression. Nach der Diagnose wird die Kastration lebenslang weitergeführt, weil alle nachfolgenden Substanzen auf ihr aufbauen.","teaching_point":"Vor jeder Diagnose einer Kastrationsresistenz das Testosteron messen."},"flag_note":null},"en":{"vignette":"69-year-old man on three-monthly depot LHRH analogue for metastatic disease. PSA rises across three measurements from 2.1 to 6.4 ng/ml. The last depot injection was four months ago because an appointment was missed. Testosterone was last measured two years ago.","lead_in":"What must be done before diagnosing castration resistance?","options":{"A":{"text":"Start an ARPI at once, since three PSA rises are documented","rationale":"A PSA rise alone is not sufficient. Without documented castrate testosterone the diagnosis would be wrong and the patient escalated although only the basic treatment had lapsed."},"B":{"text":"Switch to orchiectomy, since the depot has failed","rationale":"A premature conclusion. First measure whether testosterone is actually above the castrate level; often the interval has simply been exceeded."},"C":{"text":"Measure serum testosterone and confirm castrate level","rationale":"The definition requires both conditions simultaneously. An exceeded injection interval is a common and easily corrected cause of a PSA rise that does not represent resistance. Only with testosterone documented below 50 ng/dl plus PSA or radiological progression may castration resistance be diagnosed. Androgen deprivation is continued regardless, otherwise the androgen receptor would be fully stimulated again."},"D":{"text":"Stop androgen deprivation, since it is evidently no longer effective","rationale":"Stopping allows testosterone to rise and further stimulates the disease. Castration is continued lifelong even when further agents are added."}},"explanation":{"core":"Castration resistance is a definition composed of two conditions, not a PSA trajectory alone. It requires testosterone below 50 ng/dl and progression, either biochemical with several rises above a nadir or radiological with new lesions. The commonest avoidable misdiagnosis arises from exceeded injection intervals or inadequate suppression. Once diagnosed, castration is continued lifelong, because all subsequent agents build upon it.","teaching_point":"Measure testosterone before diagnosing castration resistance."},"flag_note":null}}},{"id":"uro-pca-00023","version":1,"status":"published","taxonomy":{"subdomain":"aggressive Variante","tags":["pathologie","pharmakologie","labordiagnostik"],"domain":"prostatakarzinom"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Prostate Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"61-jähriger Patient, seit zwei Jahren mCRPC unter Enzalutamid. Innerhalb von acht Wochen rasche klinische Verschlechterung mit Lebermetastasen und osteolytischen Knochenläsionen. Der PSA-Wert ist dabei nur von 8 auf 11 ng/ml gestiegen. Die Laktatdehydrogenase ist deutlich erhöht.","lead_in":"Was ist die wahrscheinlichste Erklärung und die richtige Konsequenz?","options":{"A":{"text":"Laborfehler beim PSA; Therapie unverändert fortsetzen","rationale":"Die Diskrepanz zwischen geringem PSA-Anstieg und rascher klinischer Progression ist kein Messfehler, sondern ein charakteristisches Muster. Ein unveränderter Weiterlauf verliert wertvolle Zeit."},"B":{"text":"Progress des Adenokarzinoms; Wechsel auf Abirateron","rationale":"Der Wechsel innerhalb der Androgenrezeptorachse wäre auch bei klassischem Verlauf wenig wirksam. Bei diesem Muster spricht zusätzlich vieles gegen ein weiterhin androgenabhängiges Wachstum."},"C":{"text":"Pseudoprogression unter Enzalutamid; abwarten und kontrollieren","rationale":"Ein Pseudoprogressionsphänomen ist für Antiandrogene nicht beschrieben. Bei Leberbeteiligung und klinischer Verschlechterung wäre Abwarten nicht vertretbar."},"D":{"text":"Aggressive Variante vermuten; Biopsie und Platintherapie","rationale":"Viszerale und osteolytische Metastasen, rasche Progression, erhöhte Laktatdehydrogenase und ein zur Tumorlast unverhältnismäßig niedriger PSA-Wert kennzeichnen die aggressive Variante. Diese Tumoren produzieren wenig PSA und sprechen auf Platin an, nicht auf weitere Hormonmanipulation. Die Biopsie einer erreichbaren Metastase sichert die neuroendokrine Differenzierung. Anschließend wird platinbasiert behandelt statt weiter androgenrezeptorgerichtet, weil dieser Signalweg die Erkrankung nicht mehr steuert."}},"explanation":{"core":"Unter langdauernder Androgenrezeptor-gerichteter Therapie kann sich ein Teil der Tumoren neuroendokrin differenzieren und damit unabhängig vom Androgenrezeptor werden. Das klinische Muster ist charakteristisch: niedriger PSA-Wert trotz hoher Tumorlast, viszerale und osteolytische Metastasen, kurze Ansprechdauer auf ARPI und rasche Progression. Der entscheidende Schritt ist die erneute Gewebegewinnung, weil sie die Behandlung von der Hormonachse auf eine platinbasierte Chemotherapie umstellt.","teaching_point":"Wenn der Tumor schneller wächst als der PSA-Wert steigt, muss neu biopsiert werden."},"flag_note":null},"en":{"vignette":"61-year-old man, two years of mCRPC on enzalutamide. Over eight weeks he deteriorates rapidly with liver metastases and osteolytic bone lesions. PSA has risen only from 8 to 11 ng/ml. Lactate dehydrogenase is markedly elevated.","lead_in":"What is the most likely explanation and the correct consequence?","options":{"A":{"text":"Laboratory error in the PSA; continue treatment unchanged","rationale":"The discrepancy between a small PSA rise and rapid clinical progression is not a measurement error but a characteristic pattern. Continuing unchanged loses valuable time."},"B":{"text":"Progression of the adenocarcinoma; switch to abiraterone","rationale":"Switching within the androgen receptor axis would be of limited efficacy even in a classical course. With this pattern, much also argues against continued androgen-dependent growth."},"C":{"text":"Pseudoprogression on enzalutamide; observe and reassess","rationale":"Pseudoprogression is not described for antiandrogens. With liver involvement and clinical deterioration, waiting would not be defensible."},"D":{"text":"Suspect an aggressive variant; biopsy and platinum therapy","rationale":"Visceral and osteolytic metastases, rapid progression, raised lactate dehydrogenase and a PSA disproportionately low for the tumour burden characterise the aggressive variant. These tumours produce little PSA and respond to platinum, not to further hormonal manipulation. Biopsy of an accessible metastasis confirms neuroendocrine differentiation. Platinum-based treatment then replaces further androgen receptor-directed therapy, because that pathway no longer drives the disease."}},"explanation":{"core":"Under prolonged androgen receptor-directed treatment a proportion of tumours undergo neuroendocrine differentiation and thereby become independent of the androgen receptor. The clinical pattern is characteristic: low PSA despite high tumour burden, visceral and osteolytic metastases, short response to ARPIs and rapid progression. The decisive step is obtaining fresh tissue, because it shifts treatment from the hormonal axis to platinum-based chemotherapy.","teaching_point":"When the tumour grows faster than the PSA rises, rebiopsy."},"flag_note":null}}},{"id":"uro-nmi-00001","version":1,"status":"published","taxonomy":{"subdomain":"T1 High Grade","tags":["leitlinie","pathologie"],"domain":"nmibc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Non-muscle-invasive Bladder Cancer","version":null,"year":2025,"section":null},{"type":"leitlinie","code":"AWMF 032-038OL","title":"S3-Leitlinie Harnblasenkarzinom","version":null,"year":2024,"section":null}],"review":{"author":"EK","reviewer":null,"created":"2026-09-02","last_reviewed":"2026-09-02","expires":"2027-09-02"},"content":{"de":{"vignette":"63-jährige Patientin nach transurethraler Resektion eines 3 cm großen, multifokalen Blasentumors. Histologie: Urothelkarzinom pT1, High Grade, kein Detrusormuskel im Präparat, kein begleitendes Carcinoma in situ. Die Resektion wurde makroskopisch als vollständig beschrieben.","lead_in":"Was ist der nächste Schritt?","options":{"A":{"text":"Primäre radikale Zystektomie mit Lymphadenektomie","rationale":"Die frühe Zystektomie ist bei Very-High-Risk-Konstellationen zu diskutieren, aber erst nach vollständigem Staging durch die Nach-TUR-B."},"B":{"text":"Nach-TUR-B innerhalb von zwei bis sechs Wochen","rationale":"Ohne Detrusormuskel im Präparat ist das Staging bei T1 nicht gesichert; das Understaging-Risiko liegt in Serien bei rund einem Drittel."},"C":{"text":"Frühinstillation mit Mitomycin C nach der Resektion","rationale":"Die Frühinstillation ist Low-Risk-Tumoren vorbehalten und muss innerhalb von 24 Stunden erfolgen; bei T1 High Grade ist sie nicht indiziert."},"D":{"text":"Sofortiger Beginn der BCG-Induktion über sechs Wochen","rationale":"Eine Instillationstherapie auf unsicherem Staging kann ein bereits muskelinvasives Karzinom über Monate verschleiern."}},"explanation":{"core":"Die Nach-TUR-B ist keine Therapie, sondern Staging. Ihre Indikation ergibt sich aus T1-Stadium, unvollständiger Resektion oder fehlendem Detrusormuskel bei High-Grade-Tumoren. Jede Therapieentscheidung ohne dieses Staging trifft auf unsicherer Grundlage.","teaching_point":"Fehlender Detrusormuskel bei T1 High Grade heißt: Stadium unbekannt, nicht Stadium T1."},"flag_note":null},"en":{"vignette":"63-year-old woman after transurethral resection of a 3 cm multifocal bladder tumour. Histology: urothelial carcinoma pT1, high grade, no detrusor muscle in the specimen, no concomitant carcinoma in situ. The resection was described as macroscopically complete.","lead_in":"What is the next step?","options":{"A":{"text":"Primary radical cystectomy with lymphadenectomy","rationale":"Early cystectomy is discussed in very-high-risk constellations, but only after complete staging by repeat resection."},"B":{"text":"Repeat TURBT within two to six weeks","rationale":"Without detrusor muscle in the specimen the T1 stage is not secure; series report understaging in roughly one third of cases."},"C":{"text":"Immediate instillation of mitomycin C after resection","rationale":"The immediate instillation is reserved for low-risk tumours and must be given within 24 hours; it is not indicated in T1 high grade."},"D":{"text":"Immediate start of BCG induction over six weeks","rationale":"Instillation therapy on uncertain staging can mask an already muscle-invasive tumour for months."}},"explanation":{"core":"Repeat TURBT is staging, not treatment. Its indication follows from T1 stage, incomplete resection or absent detrusor muscle in high-grade disease. Any treatment decision without this staging rests on an uncertain basis.","teaching_point":"Absent detrusor muscle in T1 high grade means unknown stage, not stage T1."},"flag_note":null}}},{"id":"uro-nmi-00002","version":1,"status":"published","taxonomy":{"subdomain":"Instillationstherapie","tags":["dosierung","pharmakologie","leitlinie"],"domain":"nmibc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Non-muscle-invasive Bladder Cancer","year":2026},{"type":"studie","citation":"SWOG 8507, Lamm et al."}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2028-09-05"},"content":{"de":{"vignette":"59-jähriger Patient mit Urothelkarzinom pT1 High Grade. Die Nach-TUR-B zeigt keinen Resttumor und Detrusormuskel im Präparat, kein begleitendes Carcinoma in situ. Die Risikoeinstufung lautet High Risk. Keine Immunsuppression, keine Tuberkulose in der Anamnese, Urinkultur steril.","lead_in":"Welches Instillationsschema entspricht der Leitlinie?","options":{"A":{"text":"BCG-Induktion mit Erhaltung in Volldosis über drei Jahre","rationale":"Das SWOG-Erhaltungsschema über drei Jahre ist beim High-Risk-Tumor der Standard und dem alleinigen Induktionszyklus in Rezidiv- und Progressionsrate überlegen. Die Induktion umfasst sechs wöchentliche Instillationen, die Erhaltung je drei wöchentliche Gaben in den Monaten 3, 6, 12, 18, 24, 30 und 36."},"B":{"text":"Sechs wöchentliche BCG-Gaben als alleinige Induktion","rationale":"Ohne Erhaltung geht ein erheblicher Teil des Effekts verloren; die Induktion allein ist beim High-Risk-Tumor unzureichend."},"C":{"text":"BCG-Induktion mit anschließender Erhaltung über ein Jahr","rationale":"Ein Jahr Erhaltung ist die Option beim mittleren Risiko. Beim High-Risk-Tumor sind drei Jahre vorgesehen."},"D":{"text":"Mitomycin C wöchentlich sechsmal, dann monatlich ein Jahr","rationale":"Das ist das Schema für Tumoren mit mittlerem Risiko. Beim High-Risk-Tumor ist BCG der Chemotherapie überlegen."}},"explanation":{"core":"Die Risikogruppe bestimmt sowohl die Substanz als auch die Dauer. Mittleres Risiko: BCG über ein Jahr oder Mitomycin. Hohes Risiko: BCG in Volldosis über drei Jahre. Sehr hohes Risiko: frühe Zystektomie diskutieren. Vor jeder BCG-Gabe sind traumatische Katheterisierung, Makrohämaturie und Harnwegsinfekt auszuschließen.","teaching_point":"Die Erhaltungsdauer ist keine Ermessensfrage, sondern folgt der Risikogruppe: ein Jahr oder drei Jahre."},"flag_note":null},"en":{"vignette":"59-year-old man with pT1 high-grade urothelial carcinoma. Repeat TURBT shows no residual tumour and detrusor muscle in the specimen, no concomitant carcinoma in situ. Risk classification is high risk. No immunosuppression, no history of tuberculosis, sterile urine culture.","lead_in":"Which intravesical schedule follows the guideline?","options":{"A":{"text":"BCG induction with full-dose maintenance for three years","rationale":"The three-year SWOG maintenance schedule is standard in high-risk disease and superior to induction alone in recurrence and progression rates. Induction comprises six weekly instillations, maintenance three weekly doses each at months 3, 6, 12, 18, 24, 30 and 36."},"B":{"text":"Six weekly BCG instillations as induction only","rationale":"Without maintenance a substantial part of the effect is lost; induction alone is inadequate in high-risk disease."},"C":{"text":"BCG induction followed by maintenance for one year","rationale":"One year of maintenance is the intermediate-risk option. High-risk disease calls for three years."},"D":{"text":"Mitomycin C weekly six times, then monthly for a year","rationale":"That is the intermediate-risk schedule. In high-risk disease BCG is superior to chemotherapy."}},"explanation":{"core":"The risk group determines both the agent and the duration. Intermediate risk: BCG for one year or mitomycin. High risk: full-dose BCG for three years. Very high risk: discuss early cystectomy. Before every BCG instillation exclude traumatic catheterisation, macroscopic haematuria and urinary tract infection.","teaching_point":"Maintenance duration is not discretionary; it follows the risk group: one year or three years."},"flag_note":null}}},{"id":"uro-mib-00001","version":1,"status":"published","taxonomy":{"subdomain":"perioperative Systemtherapie","tags":["leitlinie","pharmakologie","dosierung","praeoperativ"],"domain":"mibc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"EV-303 / KEYNOTE-905, N Engl J Med 2026","doi":null},{"type":"zulassung","citation":"Europäische Kommission, perioperatives Enfortumab Vedotin plus Pembrolizumab bei cisplatinungeeignetem MIBC","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-09-05"},"content":{"de":{"vignette":"71-jähriger Patient mit muskelinvasivem Urothelkarzinom der Harnblase, cT2 cN0 cM0, ECOG 1. Chronische Niereninsuffizienz mit einer GFR von 38 ml/min bei diabetischer Nephropathie. Audiometrie unauffällig, keine Polyneuropathie, keine Herzinsuffizienz. Der Patient ist zystektomiefähig.","lead_in":"Welches perioperative Vorgehen ist in Deutschland zugelassen und leitliniengerecht?","options":{"A":{"text":"Primäre radikale Zystektomie ohne Systemtherapie","rationale":"Bis 2025 war dies der Standard für cisplatinungeeignete Patienten. Er ist dem perioperativen Regime in ereignisfreiem und Gesamtüberleben unterlegen und heute nur noch bei Kontraindikation gegen die Kombination vertretbar."},"B":{"text":"Neoadjuvant Carboplatin plus Gemcitabin, vier Zyklen","rationale":"Für Carboplatin fehlt im neoadjuvanten Setting jeder Wirksamkeitsnachweis; es ist kein Ersatz für Cisplatin und verzögert nur die Operation."},"C":{"text":"Perioperativ Enfortumab Vedotin plus Pembrolizumab","rationale":"EV-303 (KEYNOTE-905) zeigte gegenüber alleiniger Operation ein ereignisfreies Überleben mit Hazard Ratio 0,40 und ein Gesamtüberleben mit Hazard Ratio 0,50; die pathologische Komplettremission lag bei 57,1 gegenüber 8,6 Prozent. Die EU-Zulassung für cisplatinungeeignete Patienten besteht seit Juni 2026. Neoadjuvant werden drei Zyklen gegeben: Enfortumab Vedotin 1,25 mg/kg i.v. an Tag 1 und 8 plus Pembrolizumab 200 mg i.v. an Tag 1, alle drei Wochen. Danach folgen Zystektomie mit Lymphadenektomie und die adjuvante Fortführung."},"D":{"text":"Neoadjuvant Gemcitabin/Cisplatin mit Durvalumab","rationale":"Das NIAGARA-Protokoll setzt Cisplatinfähigkeit voraus. Bei einer GFR von 38 ml/min ist das Galsky-Kriterium der Niereninsuffizienz erfüllt und Cisplatin nicht einsetzbar."}},"explanation":{"core":"Die Cisplatinfähigkeit nach den Galsky-Kriterien bleibt die erste Weiche, hat aber ihre Bedeutung verändert. Bis 2025 führte Cisplatinungeeignetheit direkt zur alleinigen Operation. Seit EV-303 und der EU-Zulassung im Juni 2026 steht für genau diese Gruppe ein zugelassenes perioperatives Regime zur Verfügung.","teaching_point":"Cisplatinungeeignet heißt seit 2026 nicht mehr therapielos, sondern platinfrei."},"flag_note":null},"en":{"vignette":"71-year-old man with muscle-invasive urothelial carcinoma of the bladder, cT2 cN0 cM0, ECOG 1. Chronic kidney disease with a GFR of 38 ml/min from diabetic nephropathy. Normal audiometry, no polyneuropathy, no heart failure. He is fit for cystectomy.","lead_in":"Which perioperative approach is approved and guideline-concordant in Germany?","options":{"A":{"text":"Primary radical cystectomy without systemic therapy","rationale":"This was the standard for cisplatin-ineligible patients until 2025. It is inferior in event-free and overall survival and is now only defensible when the combination is contraindicated."},"B":{"text":"Neoadjuvant carboplatin plus gemcitabine, four cycles","rationale":"Carboplatin has no efficacy evidence in the neoadjuvant setting; it does not substitute for cisplatin and only delays surgery."},"C":{"text":"Perioperative enfortumab vedotin plus pembrolizumab","rationale":"EV-303 (KEYNOTE-905) showed event-free survival with a hazard ratio of 0.40 and overall survival with a hazard ratio of 0.50 against surgery alone; pathological complete response was 57.1 versus 8.6 per cent. The EU approval for cisplatin-ineligible patients has been in place since June 2026. Three neoadjuvant cycles are given: enfortumab vedotin 1.25 mg/kg IV on days 1 and 8 plus pembrolizumab 200 mg IV on day 1, every three weeks. Cystectomy with lymphadenectomy and adjuvant continuation follow."},"D":{"text":"Neoadjuvant gemcitabine/cisplatin with durvalumab","rationale":"The NIAGARA protocol requires cisplatin eligibility. At a GFR of 38 ml/min the Galsky renal criterion is met and cisplatin cannot be given."}},"explanation":{"core":"Cisplatin eligibility by the Galsky criteria remains the first branch point, but its meaning has changed. Until 2025 ineligibility led straight to surgery alone. Since EV-303 and the EU approval in June 2026 an approved perioperative regimen exists for exactly this group.","teaching_point":"Since 2026 cisplatin-ineligible no longer means treatment-free, it means platinum-free."},"flag_note":null}}},{"id":"uro-mib-00002","version":1,"status":"published","taxonomy":{"subdomain":"perioperative Systemtherapie","tags":["dosierung","pharmakologie","leitlinie"],"domain":"mibc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"NIAGARA, Powles et al., N Engl J Med 2024","doi":null},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Muscle-invasive and Metastatic Bladder Cancer","version":null,"year":2026,"section":null}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-09-05"},"content":{"de":{"vignette":"64-jähriger Patient, cT3 cN0 cM0 Urothelkarzinom der Harnblase, ECOG 0, GFR 92 ml/min, keine Hörminderung, keine Neuropathie, keine Herzinsuffizienz. Im Tumorboard wird das NIAGARA-Protokoll beschlossen.","lead_in":"Welche Dosierung und Sequenz entspricht dem Protokoll?","options":{"A":{"text":"Durvalumab präoperativ alle 4 Wochen, danach alle 3 Wochen","rationale":"Die Intervalle sind vertauscht. Präoperativ läuft Durvalumab synchron zur Chemotherapie alle 3 Wochen, erst postoperativ alle 4 Wochen."},"B":{"text":"Chemotherapie präoperativ, Durvalumab erst adjuvant","rationale":"Gewichtsadaptierte Dosierung und rein adjuvanter Einsatz stammen aus älteren Studiendesigns. NIAGARA beginnt Durvalumab bereits präoperativ."},"C":{"text":"Sechs Zyklen Chemotherapie präoperativ, danach Operation","rationale":"Neoadjuvant sind vier Zyklen etabliert; sechs Zyklen erhöhen nur die Toxizität und die perioperative Komponente fehlt vollständig."},"D":{"text":"Vier Zyklen perioperativ, danach acht Zyklen Durvalumab","rationale":"Entspricht dem Studienprotokoll: perioperativ, mit Wechsel des Intervalls von drei auf vier Wochen nach der Operation. Präoperativ alle drei Wochen: Durvalumab 1500 mg i.v. an Tag 1, Gemcitabin 1000 mg/m² an Tag 1 und 8, Cisplatin 70 mg/m² an Tag 1. Nach der Zystektomie acht Zyklen Durvalumab 1500 mg i.v. alle vier Wochen."}},"explanation":{"core":"NIAGARA etablierte für cisplatinfähige Patienten die perioperative Ergänzung der Standardchemotherapie um Durvalumab. Prüfungsrelevant sind drei Details: Durvalumab beginnt präoperativ, die Chemotherapie umfasst vier Zyklen, und das Durvalumab-Intervall wechselt postoperativ von drei auf vier Wochen.","teaching_point":"Perioperativ heißt vor und nach der Operation. Ein rein adjuvantes Schema ist nicht NIAGARA."},"flag_note":null},"en":{"vignette":"64-year-old man, cT3 cN0 cM0 urothelial carcinoma of the bladder, ECOG 0, GFR 92 ml/min, no hearing loss, no neuropathy, no heart failure. The tumour board decides on the NIAGARA protocol.","lead_in":"Which dosing and sequence matches the protocol?","options":{"A":{"text":"Durvalumab four-weekly before surgery, three-weekly after","rationale":"The intervals are swapped. Preoperatively durvalumab runs every 3 weeks with chemotherapy, only postoperatively every 4 weeks."},"B":{"text":"Chemotherapy before surgery, durvalumab only adjuvantly","rationale":"Weight-based dosing and purely adjuvant use come from older trial designs. NIAGARA starts durvalumab before surgery."},"C":{"text":"Six cycles of chemotherapy before surgery, then operate","rationale":"Four cycles are established neoadjuvantly; six only add toxicity, and the perioperative component is missing entirely."},"D":{"text":"Four perioperative cycles, then eight of durvalumab","rationale":"This matches the trial protocol: perioperative, with the interval changing from three to four weeks after surgery. Preoperatively every three weeks: durvalumab 1500 mg IV on day 1, gemcitabine 1000 mg/m² on days 1 and 8, cisplatin 70 mg/m² on day 1. After cystectomy eight cycles of durvalumab 1500 mg IV every four weeks."}},"explanation":{"core":"For cisplatin-eligible patients NIAGARA established the perioperative addition of durvalumab to standard chemotherapy. Three details matter for the exam: durvalumab starts preoperatively, chemotherapy runs four cycles, and the durvalumab interval changes from three to four weeks after surgery.","teaching_point":"Perioperative means before and after surgery. A purely adjuvant schedule is not NIAGARA."},"flag_note":null}}},{"id":"uro-mib-00003","version":1,"status":"published","taxonomy":{"subdomain":"Toxizitätsmanagement","tags":["nebenwirkungen","pharmakologie","komplikationsmanagement"],"domain":"mibc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"EV-303 / KEYNOTE-905, N Engl J Med 2026","doi":null},{"type":"fachinformation","citation":"Fachinformation Enfortumab Vedotin","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-09-05"},"content":{"de":{"vignette":"68-jährige Patientin unter neoadjuvantem Enfortumab Vedotin 1,25 mg/kg plus Pembrolizumab 200 mg. Vorbestehender Typ-2-Diabetes, HbA1c bei Therapiebeginn 8,4 Prozent. Elf Tage nach dem zweiten Zyklus Blutzucker 480 mg/dl, Ketonurie, beginnende Kussmaul-Atmung.","lead_in":"Wie ist die Situation einzuordnen und zu behandeln?","options":{"A":{"text":"Immunvermittelter Typ-1-Diabetes; Glukokortikoide geben","rationale":"Ein autoimmuner Insulinmangeldiabetes unter Checkpointinhibitoren kommt vor, ist aber seltener. Glukokortikoide verschlechtern die Stoffwechsellage zusätzlich und sind bei dieser Entgleisung kontraproduktiv."},"B":{"text":"Enfortumab Vedotin nach dieser Episode dauerhaft absetzen","rationale":"Vorgesehen ist das Pausieren mit Wiederaufnahme nach Normalisierung. Dauerhaftes Absetzen bleibt wiederholten oder lebensbedrohlichen Verläufen vorbehalten."},"C":{"text":"Erwartete Nebenwirkung ohne Konsequenz für die Therapie","rationale":"Enfortumab Vedotin hat mehrere dosislimitierende Toxizitäten: Hyperglykämie, schwere Hautreaktionen bis zum Stevens-Johnson-Syndrom, periphere Neuropathie, okuläre Toxizität und Pneumonitis."},"D":{"text":"Enfortumab-typische Hyperglykämie; pausieren und behandeln","rationale":"Schwere Hyperglykämien bis zur diabetischen Ketoazidose sind eine bekannte, auch tödlich verlaufende Nebenwirkung von Enfortumab Vedotin. Vorbestehender Diabetes und erhöhtes HbA1c sind Risikofaktoren; der Blutzucker wird vor jeder Gabe kontrolliert. Die Entgleisung wird stationär behandelt; Enfortumab Vedotin wird pausiert und erst nach Normalisierung des Blutzuckers wieder angesetzt. Dauerhaftes Absetzen bleibt wiederholten oder lebensbedrohlichen Episoden vorbehalten."}},"explanation":{"core":"Die Toxizität des perioperativen Regimes ist erheblich: In EV-303 traten Nebenwirkungen vom Grad 3 oder höher bei 71,3 Prozent gegenüber 45,9 Prozent unter alleiniger Operation auf, therapieassoziierte Todesfälle bei 7,8 gegenüber 5,7 Prozent. Wer die Kombination einsetzt, muss Blutzucker, Haut, Neurologie und Augen strukturiert überwachen.","teaching_point":"Vor jeder Enfortumab-Gabe Blutzucker messen. Der Wirkstoff macht Hyperglykämien auch bei Patienten ohne bekannten Diabetes."},"flag_note":null},"en":{"vignette":"68-year-old woman on neoadjuvant enfortumab vedotin 1.25 mg/kg plus pembrolizumab 200 mg. Known type 2 diabetes, HbA1c 8.4 per cent at treatment start. Eleven days after the second cycle her blood glucose is 480 mg/dl with ketonuria and early Kussmaul breathing.","lead_in":"How should this be classified and managed?","options":{"A":{"text":"Immune-mediated type 1 diabetes; give glucocorticoids","rationale":"Autoimmune insulin-deficient diabetes does occur under checkpoint inhibitors but is rarer. Glucocorticoids worsen the metabolic state and are counterproductive here."},"B":{"text":"Discontinue enfortumab vedotin permanently after this","rationale":"The intended action is to withhold and resume after normalisation. Permanent discontinuation is reserved for recurrent or life-threatening episodes."},"C":{"text":"An expected effect without consequence for treatment","rationale":"Enfortumab vedotin has several dose-limiting toxicities: hyperglycaemia, severe skin reactions including Stevens-Johnson syndrome, peripheral neuropathy, ocular toxicity and pneumonitis."},"D":{"text":"Enfortumab-typical hyperglycaemia; withhold and treat","rationale":"Severe hyperglycaemia up to and including fatal diabetic ketoacidosis is a known adverse effect of enfortumab vedotin. Pre-existing diabetes and raised HbA1c are risk factors; glucose is checked before every dose. The decompensation is treated in hospital; enfortumab vedotin is withheld and resumed only after glucose normalises. Permanent discontinuation is reserved for recurrent or life-threatening episodes."}},"explanation":{"core":"The toxicity of the perioperative regimen is substantial: in EV-303 grade 3 or higher adverse events occurred in 71.3 per cent versus 45.9 per cent with surgery alone, and treatment-related deaths in 7.8 versus 5.7 per cent. Anyone using the combination must monitor glucose, skin, neurology and eyes systematically.","teaching_point":"Measure blood glucose before every enfortumab dose. The drug causes hyperglycaemia even in patients without known diabetes."},"flag_note":null}}},{"id":"uro-mib-00004","version":1,"status":"published","taxonomy":{"subdomain":"perioperative Systemtherapie","tags":["zulassung","leitlinie","pharmakologie"],"domain":"mibc"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"kontrovers","flag":true},"sources":[{"type":"studie","citation":"EV-304 / KEYNOTE-B15, ASCO GU 2026","doi":null},{"type":"zulassung","citation":"FDA-Erweiterung Juli 2026; EU-Zulassung Juni 2026 nur cisplatinungeeignet","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-03-05"},"content":{"de":{"vignette":"62-jähriger Patient, cT2 cN0 cM0, GFR 95 ml/min, ECOG 0, kein Galsky-Kriterium erfüllt, also uneingeschränkt cisplatinfähig. Er hat von der Kombination Enfortumab Vedotin plus Pembrolizumab gelesen und fragt, ob er sie statt einer Chemotherapie bekommen kann.","lead_in":"Wie ist die Lage in Deutschland im September 2026 einzuordnen?","options":{"A":{"text":"Cisplatinfähige weiterhin nur Gemcitabin/Cisplatin","rationale":"NIAGARA hat für diese Gruppe die perioperative Ergänzung um Durvalumab etabliert; die alleinige Chemotherapie ist nicht mehr Standard."},"B":{"text":"In der EU für alle Zystektomiekandidaten zugelassen","rationale":"Das gilt für die FDA-Zulassung vom Juli 2026. Die EU-Zulassung vom Juni 2026 beschränkt sich auf cisplatinungeeignete Patienten."},"C":{"text":"Studie positiv, EU-Zulassung aber nur cisplatinungeeignet","rationale":"EV-304 (KEYNOTE-B15) erreichte ein ereignisfreies Überleben mit Hazard Ratio 0,53 und eine pathologische Komplettremission von 55,8 gegenüber 32,5 Prozent. Die FDA erweiterte die Zulassung im Juli 2026 auf alle Zystektomiekandidaten, die EU-Zulassung ist auf cisplatinungeeignete Patienten beschränkt. EV-304 erreichte ein ereignisfreies Überleben mit Hazard Ratio 0,53 und eine pathologische Komplettremission von 55,8 gegenüber 32,5 Prozent. Die FDA erweiterte im Juli 2026 auf alle Zystektomiekandidaten; zugelassener Standard bleibt hier das perioperative Durvalumab-Regime."},"D":{"text":"EV-304 verfehlte den primären Endpunkt der Studie","rationale":"Die Studie war positiv in ereignisfreiem Überleben, Gesamtüberleben und pathologischer Komplettremission."}},"explanation":{"core":"Bei neu zugelassenen Substanzen fallen Studienevidenz und Zulassungsstatus zeitlich und geographisch auseinander. Für die Prüfung wie für den Alltag gilt: Die Studie begründet den Nutzen, die Zulassung begründet den regulären Einsatz. Ein Einsatz außerhalb der Zulassung braucht einen Antrag auf Kostenübernahme.","teaching_point":"FDA-Zulassung ist kein Beleg für Verordnungsfähigkeit in Deutschland."},"flag_note":"Zulassungsstand September 2026. FDA und EMA weichen voneinander ab; eine EU-Erweiterung auf cisplatinfähige Patienten ist absehbar. Vor Verwendung den aktuellen Stand prüfen."},"en":{"vignette":"62-year-old man, cT2 cN0 cM0, GFR 95 ml/min, ECOG 0, no Galsky criterion met, therefore fully cisplatin-eligible. He has read about enfortumab vedotin plus pembrolizumab and asks whether he can have it instead of chemotherapy.","lead_in":"How should the situation in Germany in September 2026 be assessed?","options":{"A":{"text":"Cisplatin-eligible patients still only gemcitabine/cisplatin","rationale":"NIAGARA established the perioperative addition of durvalumab for this group; chemotherapy alone is no longer standard."},"B":{"text":"Approved in the EU for all cystectomy candidates","rationale":"That describes the FDA approval of July 2026. The EU approval of June 2026 is limited to cisplatin-ineligible patients."},"C":{"text":"Trial positive, but EU approval only cisplatin-ineligible","rationale":"EV-304 (KEYNOTE-B15) reached event-free survival with a hazard ratio of 0.53 and pathological complete response of 55.8 versus 32.5 per cent. The FDA broadened its approval in July 2026 to all cystectomy candidates; the EU approval is restricted to cisplatin-ineligible patients. EV-304 reached event-free survival with a hazard ratio of 0.53 and pathological complete response of 55.8 versus 32.5 per cent. The FDA broadened its label in July 2026 to all cystectomy candidates; the approved standard here remains the perioperative durvalumab regimen."},"D":{"text":"EV-304 missed the primary endpoint of the trial","rationale":"The trial was positive for event-free survival, overall survival and pathological complete response."}},"explanation":{"core":"With newly approved agents, trial evidence and regulatory status diverge in time and geography. For the exam as in practice: the trial establishes benefit, the marketing authorisation establishes routine use. Use outside the label requires an application for reimbursement.","teaching_point":"FDA approval is no evidence of prescribability in Germany."},"flag_note":"Regulatory status as of September 2026. FDA and EMA differ; an EU extension to cisplatin-eligible patients is foreseeable. Check the current status before use."}}},{"id":"uro-rcc-00001","version":1,"status":"published","taxonomy":{"subdomain":"adjuvant","tags":["leitlinie","pharmakologie","dosierung","nachsorge"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"KEYNOTE-564, Choueiri et al., N Engl J Med 2021 und Folgeanalysen"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-09-05"},"content":{"de":{"vignette":"58-jährige Patientin, radikale Nephrektomie bei klarzelligem Nierenzellkarzinom pT3a pN0 cM0, R0, Kerngrad 3, ECOG 0. Keine Autoimmunerkrankung, keine Immunsuppression.","lead_in":"Welche adjuvante Therapie ist indiziert?","options":{"A":{"text":"Keine adjuvante Therapie, ausschließlich Nachsorge","rationale":"War bis 2021 richtig. Bei erhöhtem Rezidivrisiko gibt es inzwischen eine wirksame und zugelassene Option."},"B":{"text":"Adjuvantes Pembrolizumab über bis zu ein Jahr","rationale":"KEYNOTE-564 zeigte für das erhöhte Rezidivrisiko einen Vorteil im krankheitsfreien und im Gesamtüberleben. Ein pT3-Tumor erfüllt die Einschlusskriterien. Gegeben werden 200 mg i.v. alle drei Wochen oder 400 mg alle sechs Wochen. KEYNOTE-564 zeigte bei erhöhtem Rezidivrisiko einen Vorteil im krankheitsfreien und im Gesamtüberleben."},"C":{"text":"Adjuvant Nivolumab plus Ipilimumab kombiniert","rationale":"Die adjuvante Prüfung dieser Kombination verfehlte ihren primären Endpunkt."},"D":{"text":"Adjuvantes Sunitinib 50 mg im Vier-Zwei-Schema","rationale":"Die adjuvante Tyrosinkinasehemmung verbesserte das Gesamtüberleben nicht und ist in Europa dafür nicht zugelassen."}},"explanation":{"core":"Adjuvante Therapie beim Nierenzellkarzinom ist an drei Bedingungen gebunden: klarzellige Histologie, erhöhtes Rezidivrisiko nach vollständiger Resektion und fehlende Kontraindikation gegen einen Checkpointinhibitor. Fehlt eine davon, bleibt es bei der Nachsorge.","teaching_point":"Nicht jedes resezierte Nierenzellkarzinom bekommt eine adjuvante Therapie. Histologie und Risikogruppe entscheiden."},"flag_note":null},"en":{"vignette":"58-year-old woman after radical nephrectomy for clear cell renal cell carcinoma pT3a pN0 cM0, R0, nuclear grade 3, ECOG 0. No autoimmune disease, no immunosuppression.","lead_in":"Which adjuvant treatment is indicated?","options":{"A":{"text":"No adjuvant treatment, surveillance only","rationale":"Correct until 2021. For increased recurrence risk an effective and approved option now exists."},"B":{"text":"Adjuvant pembrolizumab for up to one year","rationale":"KEYNOTE-564 showed a benefit in disease-free and overall survival for increased recurrence risk. A pT3 tumour meets the inclusion criteria. Given as 200 mg IV every three weeks or 400 mg every six weeks. KEYNOTE-564 showed a benefit in disease-free and overall survival at increased recurrence risk."},"C":{"text":"Adjuvant nivolumab plus ipilimumab combined","rationale":"The adjuvant trial of this combination missed its primary endpoint."},"D":{"text":"Adjuvant sunitinib 50 mg on a four-two schedule","rationale":"Adjuvant tyrosine kinase inhibition did not improve overall survival and is not approved for this indication in Europe."}},"explanation":{"core":"Adjuvant therapy in renal cell carcinoma requires three conditions: clear cell histology, increased recurrence risk after complete resection, and no contraindication to a checkpoint inhibitor. If one is missing, follow-up alone remains.","teaching_point":"Not every resected renal cell carcinoma gets adjuvant therapy. Histology and risk group decide."},"flag_note":null}}},{"id":"uro-rcc-00002","version":1,"status":"published","taxonomy":{"subdomain":"metastasiert","tags":["leitlinie","zulassung","pharmakologie","dosierung"],"domain":"nierenzellkarzinom"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"KEYNOTE-426; CheckMate 214"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Renal Cell Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2027-09-05"},"content":{"de":{"vignette":"62-jähriger Patient mit synchron metastasiertem klarzelligem Nierenzellkarzinom, zwei pulmonale Herde, ECOG 0, Diagnose vor zwei Monaten, Hämoglobin, Calcium, Neutrophile und Thrombozyten im Normbereich. Nach IMDC ergibt sich ein günstiges Risikoprofil.","lead_in":"Welche Aussage zur Erstlinientherapie trifft zu?","options":{"A":{"text":"Ipilimumab plus Nivolumab unabhängig vom IMDC-Risiko","rationale":"Die Zulassung dieser Kombination beim Nierenzellkarzinom ist auf intermediäres und ungünstiges IMDC-Ri
