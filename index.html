 Hemiskrotum mit Übelkeit. Der Hoden steht hoch und quer, der Kremasterreflex ist rechts erloschen. Die Dopplersonographie ist erst in zwei Stunden verfügbar.","lead_in":"Was ist zu tun?","options":{"A":{"text":"Auf die Dopplersonographie warten und dann entscheiden","rationale":"Eine erhaltene Perfusion im Ultraschall schließt eine Torsion nicht aus, und jede Stunde Verzögerung kostet Hodengewebe."},"B":{"text":"Antibiotisch behandeln als vermutete Epididymitis","rationale":"Plötzlicher Beginn, Hochstand, Querlage und fehlender Kremasterreflex sprechen gegen eine Entzündung."},"C":{"text":"Sofortige operative Freilegung ohne weitere Bildgebung","rationale":"Anamnese und Befund sind aussagekräftig genug. Innerhalb von sechs Stunden ist die Rettungsrate hoch, danach fällt sie rasch ab. Bei der Freilegung wird die Gegenseite immer mitfixiert, weil die anatomische Disposition beidseits besteht."},"D":{"text":"Manuelle Detorquierung als endgültige Behandlung","rationale":"Sie kann überbrückend versucht werden, ersetzt aber nie die Freilegung mit Fixierung beider Hoden."}},"explanation":{"core":"Beim akuten Skrotum des Jugendlichen gilt die Torsion bis zum Beweis des Gegenteils. Die Bildgebung darf die Operation nicht verzögern, weil sie falsch negativ sein kann. Bei der Freilegung wird die Gegenseite immer mitfixiert, da die anatomische Disposition beidseits besteht.","teaching_point":"Die Uhr entscheidet, nicht der Ultraschall."},"flag_note":null},"en":{"vignette":"13-year-old boy with four hours of sudden severe right hemiscrotal pain and nausea. The testis is high-riding and lies transversely, the cremasteric reflex is absent on the right. Doppler ultrasound will not be available for two hours.","lead_in":"What should be done?","options":{"A":{"text":"Wait for the Doppler scan and then decide","rationale":"Preserved perfusion on ultrasound does not exclude torsion, and every hour of delay costs testicular tissue."},"B":{"text":"Treat with antibiotics as presumed epididymitis","rationale":"Sudden onset, high-riding transverse position and absent cremasteric reflex argue against inflammation."},"C":{"text":"Immediate scrotal exploration without further imaging","rationale":"History and examination are conclusive enough. Salvage rates are high within six hours and fall rapidly thereafter. At exploration the contralateral side is always fixed as well, because the anatomical predisposition is bilateral."},"D":{"text":"Manual detorsion as the definitive treatment","rationale":"It may be attempted as a bridge but never replaces exploration with fixation of both testes."}},"explanation":{"core":"In the acute scrotum of an adolescent, torsion is assumed until proven otherwise. Imaging must not delay surgery because it can be falsely negative. At exploration the contralateral side is always fixed as well, since the anatomical predisposition is bilateral.","teaching_point":"The clock decides, not the ultrasound."},"flag_note":null}}},{"id":"uro-kin-00002","version":1,"status":"published","taxonomy":{"subdomain":"Hodenhochstand","tags":["leitlinie","operationstechnik"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Termingeborener Junge, bei der Vorsorgeuntersuchung mit neun Monaten ist der linke Hoden inguinal tastbar und nicht ins Skrotum verlagerbar. Rechts regelrechter Befund, seit der Geburt kein Deszensus.","lead_in":"Wie ist das weitere Vorgehen?","options":{"A":{"text":"Abwarten bis zum dritten Lebensjahr wegen Spontandeszensus","rationale":"Nach dem sechsten Lebensmonat ist ein Spontandeszensus die Ausnahme; Abwarten verschlechtert Fertilität und Tumorrisiko."},"B":{"text":"Orchidopexie bis zum zwölften Lebensmonat abschließen","rationale":"Die frühe Verlagerung erhält die Keimzellreifung und verbessert die spätere Spermatogenese; zugleich wird der Hoden tastbar und damit kontrollierbar. Spätestens bis zum achtzehnten Monat, weil die Keimzellumwandlung im ersten Lebensjahr stattfindet und die Verlagerung Fertilität und Kontrollierbarkeit sichert."},"C":{"text":"Hormontherapie mit hCG zur Deszensusinduktion zuerst","rationale":"Niedrige Erfolgsrate, oft kein dauerhafter Effekt und mögliche Keimzellschädigung. Zur Deszensusinduktion nicht mehr empfohlen."},"D":{"text":"Orchiektomie wegen des erhöhten Tumorrisikos später","rationale":"Das Risiko rechtfertigt keine Entfernung eines funktionsfähigen Hodens; die Verlagerung macht ihn im Gegenteil überwachbar."}},"explanation":{"core":"Der Zeitpunkt ist beim Hodenhochstand das eigentliche Qualitätsmerkmal. Die Keimzellumwandlung findet im ersten Lebensjahr statt, weshalb die Verlagerung bis zu dessen Ende abgeschlossen sein soll. Das Tumorrisiko bleibt auch nach Orchidopexie erhöht, der Hoden wird aber der Untersuchung zugänglich.","teaching_point":"Bis zum ersten Geburtstag operiert, nicht bis zur Einschulung beobachtet."},"flag_note":null},"en":{"vignette":"Term-born boy; at the nine-month check the left testis is palpable in the groin and cannot be brought into the scrotum. The right side is normal and there has been no descent since birth.","lead_in":"How should management proceed?","options":{"A":{"text":"Wait until the third year, since descent may still occur","rationale":"After six months spontaneous descent is exceptional; waiting worsens fertility and tumour risk."},"B":{"text":"Complete orchidopexy by twelve months of age","rationale":"Early placement preserves germ cell maturation and improves later spermatogenesis, and it makes the testis palpable and monitorable. At the latest by eighteen months, because germ cell transformation occurs in the first year and placement preserves fertility and allows monitoring."},"C":{"text":"Hormonal treatment with hCG to induce descent first","rationale":"Low success rate, often no lasting effect and possible germ cell damage. No longer recommended to induce descent."},"D":{"text":"Orchiectomy because of the later increased tumour risk","rationale":"The risk does not justify removing a functioning testis; placement is what makes surveillance possible."}},"explanation":{"core":"Timing is the real quality marker in undescended testis. Germ cell transformation occurs during the first year of life, so placement should be completed by its end. Tumour risk remains raised after orchidopexy, but the testis becomes accessible to examination.","teaching_point":"Operated by the first birthday, not observed until school age."},"flag_note":null}}},{"id":"uro-kin-00003","version":1,"status":"published","taxonomy":{"subdomain":"nicht tastbarer Hoden","tags":["bildgebung","operationstechnik","leitlinie"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"14 Monate alter Junge, der rechte Hoden ist auch in Narkose nicht tastbar. Sonographisch kein Nachweis inguinal oder abdominell. Der linke Hoden liegt orthotop und ist normal groß.","lead_in":"Welcher Schritt folgt?","options":{"A":{"text":"Erneute Sonographie durch einen erfahrenen Untersucher","rationale":"Der Ultraschall hat für den intraabdominellen Hoden eine zu geringe Sensitivität; ein negativer Befund schließt nichts aus."},"B":{"text":"MRT von Becken und Abdomen zur Lokalisation des Hodens","rationale":"Auch das MRT ist nicht sicher genug, erfordert in diesem Alter eine Narkose und ändert das Vorgehen nicht."},"C":{"text":"hCG-Stimulationstest zum Nachweis von Hodengewebe","rationale":"Bei einseitig nicht tastbarem Hoden und regelrechter Gegenseite unnötig; die Frage ist die Lage, nicht die Existenz."},"D":{"text":"Diagnostische Laparoskopie mit Konsequenz im Eingriff","rationale":"Sie ist Diagnostik und Therapie zugleich: Sie zeigt Hoden, blind endende Gefäße oder einen Nubbin und erlaubt die sofortige Konsequenz. Je nach Befund folgt die Verlagerung, gegebenenfalls zweizeitig nach Fowler-Stephens, oder die Entfernung eines Nubbins. Blind endende Gefäße beweisen die Aplasie."}},"explanation":{"core":"Beim nicht tastbaren Hoden ist keine Bildgebung zuverlässig genug, um eine Operation zu ersparen. Deshalb wird direkt laparoskopiert. Der Befund entscheidet dann: ein Hoden mit Gefäßen wird verlagert, gegebenenfalls zweizeitig nach Fowler-Stephens, blind endende Gefäße beweisen die Aplasie.","teaching_point":"Bildgebung sucht, die Laparoskopie findet und behandelt."},"flag_note":null},"en":{"vignette":"14-month-old boy in whom the right testis is impalpable even under anaesthesia. Ultrasound shows nothing inguinal or abdominal. The left testis is orthotopic and of normal size.","lead_in":"What comes next?","options":{"A":{"text":"Repeat ultrasound by an experienced operator","rationale":"Ultrasound has too low a sensitivity for the intra-abdominal testis; a negative scan excludes nothing."},"B":{"text":"MRI of pelvis and abdomen to localise the testis","rationale":"MRI is also not reliable enough, requires anaesthesia at this age and does not change management."},"C":{"text":"hCG stimulation test to prove testicular tissue","rationale":"Unnecessary with a unilaterally impalpable testis and a normal contralateral side; the question is location, not existence."},"D":{"text":"Diagnostic laparoscopy acting on the findings","rationale":"It is diagnosis and treatment at once: it shows a testis, blind-ending vessels or a nubbin and allows immediate action. Depending on the findings, placement follows, if necessary in two stages after Fowler-Stephens, or a nubbin is removed. Blind-ending vessels prove aplasia."}},"explanation":{"core":"For the impalpable testis no imaging is reliable enough to spare an operation, so laparoscopy is performed directly. The findings then decide: a testis with vessels is brought down, if necessary in two stages after Fowler-Stephens, while blind-ending vessels prove aplasia.","teaching_point":"Imaging searches; laparoscopy finds and treats."},"flag_note":null}}},{"id":"uro-kin-00004","version":1,"status":"published","taxonomy":{"subdomain":"Harnwegsinfekt","tags":["bildgebung","leitlinie","paediatrisch"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Vier Monate alter Säugling mit erstem fieberhaftem Harnwegsinfekt, Escherichia coli im Katheterurin, gutes Ansprechen auf die Antibiose innerhalb von 48 Stunden. Pränatal war der Harntrakt unauffällig.","lead_in":"Welche Bildgebung ist nach der Akutbehandlung angezeigt?","options":{"A":{"text":"Sonographie bei allen, Miktionszysturethrogramm gezielt","rationale":"Die Sonographie ist belastungsfrei und erkennt relevante Obstruktionen und Erweiterungen. Das invasive, strahlenbelastende Miktionszysturethrogramm wird gezielt eingesetzt. Das Miktionszysturethrogramm folgt nur bei auffälliger Sonographie, atypischem Verlauf oder erneutem fieberhaftem Infekt."},"B":{"text":"Miktionszysturethrogramm nach jedem ersten Infekt","rationale":"Führt zur Überdiagnostik von Refluxen ohne Therapiekonsequenz und belastet Kinder unnötig mit Katheter und Strahlung."},"C":{"text":"Zunächst keine Bildgebung, erst beim dritten Infekt","rationale":"Relevante Fehlbildungen blieben zu lange unentdeckt; die Sonographie ist risikofrei und gehört dazu."},"D":{"text":"DMSA-Szintigraphie akut zur Suche nach Reflux","rationale":"Die DMSA-Szintigraphie zeigt Parenchymbeteiligung und Narben, nicht den Reflux, und wird nicht akut durchgeführt."}},"explanation":{"core":"Die Bildgebung nach fieberhaftem Harnwegsinfekt folgt einer Stufenlogik: zuerst die belastungsfreie Sonographie, danach gezielt weitere Verfahren, wenn Befund oder Verlauf es begründen. Ziel ist, behandelbare Fehlbildungen zu finden, ohne jedes Kind invasiv zu untersuchen.","teaching_point":"Erst Schall, dann nachdenken. Das Miktionszysturethrogramm braucht einen Grund."},"flag_note":null},"en":{"vignette":"Four-month-old infant with a first febrile urinary tract infection, Escherichia coli on catheter specimen, good response to antibiotics within 48 hours. The urinary tract was normal antenatally.","lead_in":"Which imaging is indicated after acute treatment?","options":{"A":{"text":"Ultrasound in all, voiding study only selectively","rationale":"Ultrasound is burden-free and detects relevant obstruction and dilatation. The invasive, radiation-bearing voiding study is used selectively. The voiding cystourethrogram follows only for abnormal ultrasound, an atypical course or a further febrile infection."},"B":{"text":"Voiding cystourethrogram after every first infection","rationale":"This overdiagnoses reflux without treatment consequences and burdens children unnecessarily with catheterisation and radiation."},"C":{"text":"No imaging at first, only after a third infection","rationale":"Relevant malformations would remain undetected too long; ultrasound is risk-free and belongs in the workup."},"D":{"text":"DMSA scintigraphy acutely to look for reflux","rationale":"DMSA shows parenchymal involvement and scarring, not reflux, and is not performed acutely."}},"explanation":{"core":"Imaging after febrile urinary tract infection follows a stepwise logic: burden-free ultrasound first, then further studies only when findings or course justify them. The aim is to find treatable malformations without investigating every child invasively.","teaching_point":"Ultrasound first, then think. Voiding cystourethrography needs a reason."},"flag_note":null}}},{"id":"uro-kin-00005","version":1,"status":"published","taxonomy":{"subdomain":"Ureterabgangsstenose","tags":["bildgebung","leitlinie","operationstechnik"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Sechs Monate alter Säugling mit pränatal bekannter linksseitiger Nierenbeckenerweiterung. Postnatal beträgt der anteroposteriore Durchmesser 22 mm bei erweiterten Kelchen, der Ureter ist nicht dilatiert. Das Miktionszysturethrogramm zeigt keinen Reflux, das Kind ist beschwerdefrei.","lead_in":"Welche Untersuchung steuert die Entscheidung über eine Operation?","options":{"A":{"text":"Wiederholte Sonographie alle drei Monate als Grundlage","rationale":"Der Durchmesser allein sagt nichts über Funktion und Abfluss; viele Erweiterungen bilden sich zurück, andere schädigen still."},"B":{"text":"Diureseszintigraphie mit MAG3 als Entscheidungsgrundlage","rationale":"Sie liefert die beiden entscheidenden Größen: Anteil der betroffenen Niere an der Gesamtfunktion und Ausscheidung nach Furosemidgabe. Sie liefert die seitengetrennte Funktion und die Abflusskurve nach Furosemidgabe, also die beiden Größen, die über die Operation entscheiden."},"C":{"text":"Retrogrades Ureteropyelogramm in Narkose durchführen","rationale":"Invasiv, rein morphologisch und ohne Funktionsaussage; allenfalls unmittelbar vor der Rekonstruktion sinnvoll."},"D":{"text":"Computertomographie mit Kontrastmittel veranlassen","rationale":"Strahlenbelastung ohne funktionelle Information; im Säuglingsalter zu vermeiden."}},"explanation":{"core":"Eine Erweiterung des Nierenbeckens ist ein Befund, keine Diagnose. Operiert wird bei fallender seitengetrennter Funktion, einem Anteil unter etwa 40 Prozent, verzögertem Abfluss oder bei Symptomen und Infekten. Die Pyeloplastik nach Anderson-Hynes ist dann das Verfahren der Wahl.","teaching_point":"Millimeter entscheiden nicht über die Operation, Funktion und Abfluss tun es."},"flag_note":null},"en":{"vignette":"Six-month-old infant with antenatally known left pelvic dilatation. Postnatally the anteroposterior diameter is 22 mm with dilated calyces; the ureter is not dilated. Voiding cystourethrography shows no reflux and the child is asymptomatic.","lead_in":"Which investigation drives the decision about surgery?","options":{"A":{"text":"Repeat ultrasound every three months as the basis","rationale":"Diameter alone says nothing about function and drainage; many dilatations resolve while others damage silently."},"B":{"text":"Diuretic renography with MAG3 as the decision basis","rationale":"It provides the two decisive measures: the affected kidney's share of total function and washout after furosemide. It provides split function and the washout curve after furosemide, the two measures that determine whether to operate."},"C":{"text":"Perform retrograde ureteropyelography under anaesthesia","rationale":"Invasive, purely morphological and without functional information; useful at most immediately before reconstruction."},"D":{"text":"Arrange computed tomography with contrast medium","rationale":"Radiation exposure without functional information; to be avoided in infancy."}},"explanation":{"core":"Pelvic dilatation is a finding, not a diagnosis. Surgery follows a falling split function, a share below roughly 40 per cent, delayed drainage, or symptoms and infections. Anderson-Hynes pyeloplasty is then the procedure of choice.","teaching_point":"Millimetres do not decide on surgery; function and drainage do."},"flag_note":null}}},{"id":"uro-kin-00006","version":1,"status":"published","taxonomy":{"subdomain":"Phimose","tags":["leitlinie","pharmakologie","operationstechnik"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":2,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Fünfjähriger Junge, die Vorhaut lässt sich nicht zurückstreifen. Beim Wasserlassen bläht sie sich leicht auf, es besteht kein Infekt, keine Vernarbung und kein derber weißlicher Ring. Die Eltern sind besorgt.","lead_in":"Was ist die richtige erste Maßnahme?","options":{"A":{"text":"Zirkumzision als definitive Behandlung durchführen","rationale":"Ohne Vernarbung, Infekt oder Beschwerden besteht keine Operationsindikation; ein Großteil löst sich bis zur Pubertät von selbst."},"B":{"text":"Forcierte Retraktion durch die Eltern beim Baden","rationale":"Führt zu Einrissen und Vernarbung und erzeugt damit erst die echte, behandlungsbedürftige Phimose."},"C":{"text":"Dorsalinzision der Vorhaut in Kurznarkose","rationale":"Ein Notfallverfahren bei Paraphimose oder Harnverhalt, keine Behandlung der einfachen Phimose."},"D":{"text":"Topisches Kortikosteroid über vier bis acht Wochen","rationale":"Führt in einem großen Teil der Fälle zur Retraktionsfähigkeit und erhält die Vorhaut. Erst bei Versagen wird operiert. Begleitet von vorsichtigen Dehnübungen führt es in einem großen Teil der Fälle zur Retraktionsfähigkeit und erhält die Vorhaut. Erst bei Versagen wird operiert."}},"explanation":{"core":"Die nicht retrahierbare Vorhaut im Kindesalter ist überwiegend physiologisch. Behandlungsbedürftig wird sie bei narbiger Enge, rezidivierenden Entzündungen, symptomatischer Ballonierung oder Lichen sclerosus. Letzterer ist die klare Indikation zur Zirkumzision, weil er auf Steroide nicht ausreichend anspricht.","teaching_point":"Erst Salbe, dann Skalpell. Ausnahme ist der Lichen sclerosus."},"flag_note":null},"en":{"vignette":"Five-year-old boy whose foreskin cannot be retracted. It balloons slightly on voiding; there is no infection, no scarring and no firm whitish ring. The parents are worried.","lead_in":"What is the correct first measure?","options":{"A":{"text":"Perform circumcision as definitive treatment","rationale":"Without scarring, infection or symptoms there is no surgical indication; most cases resolve spontaneously by puberty."},"B":{"text":"Forced retraction by the parents at bath time","rationale":"This causes tears and scarring and thereby creates the genuine phimosis that then needs treatment."},"C":{"text":"Dorsal slit of the foreskin under brief anaesthesia","rationale":"An emergency procedure for paraphimosis or retention, not a treatment for simple phimosis."},"D":{"text":"Topical corticosteroid for four to eight weeks","rationale":"This achieves retractability in a large proportion of cases and preserves the foreskin. Surgery follows only if it fails. Combined with gentle stretching it achieves retractability in a large proportion of cases and preserves the foreskin. Surgery follows only if it fails."}},"explanation":{"core":"A non-retractile foreskin in childhood is mostly physiological. It requires treatment when there is cicatricial narrowing, recurrent inflammation, symptomatic ballooning or lichen sclerosus. The last is the clear indication for circumcision, because it does not respond adequately to steroids.","teaching_point":"Ointment before scalpel. Lichen sclerosus is the exception."},"flag_note":null}}},{"id":"uro-kin-00007","version":1,"status":"published","taxonomy":{"subdomain":"Hypospadie","tags":["operationstechnik","leitlinie","praeoperativ"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Neugeborener Junge mit distaler Hypospadie, dorsaler Präputialschürze und leichter Penisdeviation. Beide Hoden sind orthotop tastbar. Die Eltern fragen auf der Wochenbettstation nach einer Zirkumzision aus religiösen Gründen.","lead_in":"Was ist dazu zu sagen?","options":{"A":{"text":"Zirkumzision möglich, da unabhängig von der Hypospadie","rationale":"Das Gegenteil trifft zu: Das Präputium ist bei der Korrektur das wichtigste Ersatzgewebe für Neourethra oder Deckung."},"B":{"text":"Chromosomenanalyse vor jeder weiteren Entscheidung","rationale":"Bei distaler Hypospadie mit beidseits tastbaren Hoden besteht kein Anhalt für eine Variante der Geschlechtsentwicklung; die Abklärung gilt der proximalen Form mit nicht tastbaren Gonaden."},"C":{"text":"Präputium erhalten, da es zur Korrektur gebraucht wird","rationale":"Die Vorhaut ist Baumaterial. Der Eingriff wird in ein Alter gelegt, in dem die Narkose sicher ist und das Ereignis nicht bewusst erinnert wird. Operiert wird üblicherweise zwischen dem sechsten und achtzehnten Lebensmonat, wenn die Narkose sicher ist und das Ereignis nicht bewusst erinnert wird."},"D":{"text":"Korrektur bis zur Pubertät aufschieben wegen der Größe","rationale":"Später operierte Kinder tragen eine höhere psychische Belastung; die Größe ist im empfohlenen Zeitfenster ausreichend."}},"explanation":{"core":"Bei jeder Hypospadie gilt die Vorhaut als reserviertes Gewebe, bis die Korrektur geplant ist. Der Befund lenkt zugleich die Diagnostik: die distale Form mit tastbaren Hoden ist ein rein chirurgisches Thema, die proximale Form mit nicht tastbaren Gonaden verlangt die Abklärung einer Variante der Geschlechtsentwicklung.","teaching_point":"Bei Hypospadie wird nicht zirkumzidiert. Die Vorhaut gehört zur Operation."},"flag_note":null},"en":{"vignette":"Newborn boy with distal hypospadias, a dorsal preputial hood and mild penile curvature. Both testes are palpable in the scrotum. On the postnatal ward the parents ask about circumcision for religious reasons.","lead_in":"What should they be told?","options":{"A":{"text":"Circumcision is fine, being unrelated to hypospadias","rationale":"The opposite is true: the prepuce is the most important substitute tissue for the neourethra or for coverage at repair."},"B":{"text":"Chromosomal analysis before any further decision","rationale":"Distal hypospadias with both testes palpable gives no indication of a difference of sex development; that workup applies to the proximal form with impalpable gonads."},"C":{"text":"Preserve the prepuce, as it is needed for the repair","rationale":"The foreskin is building material. Surgery is timed to an age when anaesthesia is safe and the event is not consciously remembered. Surgery is usually performed between six and eighteen months, when anaesthesia is safe and the event is not consciously remembered."},"D":{"text":"Defer repair until puberty because of penile size","rationale":"Children operated later carry a greater psychological burden; size is adequate within the recommended window."}},"explanation":{"core":"In any hypospadias the foreskin is reserved tissue until repair is planned. The findings also direct the workup: the distal form with palpable testes is a purely surgical matter, whereas the proximal form with impalpable gonads calls for assessment of a difference of sex development.","teaching_point":"No circumcision in hypospadias. The foreskin belongs to the operation."},"flag_note":null}}},{"id":"uro-kin-00008","version":1,"status":"published","taxonomy":{"subdomain":"Harnröhrenklappen","tags":["notfall","bildgebung","leitlinie"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Paediatric Urology","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Drei Tage alter Junge mit beidseitiger Hydronephrose, verdickter Blasenwand und schwachem, tröpfelndem Harnstrahl. Kreatinin 1,8 mg/dl und steigend; pränatal bestand ein Oligohydramnion.","lead_in":"Wie ist vorzugehen?","options":{"A":{"text":"Sofortige Blasenentlastung, dann Diagnostik und Resektion","rationale":"Erst wird der Druck genommen und das Kind stabilisiert, dann gesichert und behandelt. Das Kreatinin nach Entlastung ist der prognostisch aussagekräftige Wert. Entlastet wird transurethral, danach werden Elektrolyte und Nierenfunktion stabilisiert. Erst dann folgen Miktionszysturethrogramm und Klappenresektion."},"B":{"text":"Umgehende Zystoskopie mit Resektion vor der Entlastung","rationale":"Ein Eingriff am instabilen Neugeborenen ohne Not; der Katheter erreicht dieselbe Entlastung sofort und schonender."},"C":{"text":"Perkutane Nephrostomie beidseits als erster Schritt","rationale":"Bei infravesikaler Obstruktion löst die Blasendrainage das Problem an der richtigen Stelle; die Nephrostomie bleibt Sonderfällen vorbehalten."},"D":{"text":"Abwarten mit Kontrolle des Kreatinins in 48 Stunden","rationale":"Bei steigendem Kreatinin und beidseitiger Stauung ist Zuwarten nicht vertretbar."}},"explanation":{"core":"Die hinteren Harnröhrenklappen sind die häufigste angeborene infravesikale Obstruktion beim Jungen. Die Reihenfolge entscheidet: entlasten, stabilisieren, sichern, resezieren. Die Langzeitprognose bestimmt nicht die Klappe, sondern die bereits pränatal entstandene Nierenschädigung und die spätere Blasenfunktionsstörung.","teaching_point":"Zuerst der Katheter, dann die Diagnostik. Das Nadir-Kreatinin nach Entlastung ist der Prognoseparameter."},"flag_note":null},"en":{"vignette":"Three-day-old boy with bilateral hydronephrosis, a thick-walled bladder and a weak, dribbling stream. Creatinine is 1.8 mg/dl and rising; there was oligohydramnios antenatally.","lead_in":"How should management proceed?","options":{"A":{"text":"Immediate bladder drainage, then imaging and resection","rationale":"Pressure is relieved and the child stabilised first, then the diagnosis is confirmed and treated. Creatinine after drainage is the prognostically meaningful value. Drainage is transurethral, after which electrolytes and renal function are stabilised. Only then follow the voiding study and valve resection."},"B":{"text":"Immediate cystoscopy with resection before any drainage","rationale":"This operates on an unstable neonate without need; a catheter achieves the same relief at once and more gently."},"C":{"text":"Bilateral percutaneous nephrostomy as the first step","rationale":"In infravesical obstruction bladder drainage addresses the problem at the right level; nephrostomy is reserved for special cases."},"D":{"text":"Wait and recheck creatinine in 48 hours","rationale":"With rising creatinine and bilateral obstruction, waiting is not defensible."}},"explanation":{"core":"Posterior urethral valves are the commonest congenital infravesical obstruction in boys. The sequence matters: drain, stabilise, confirm, resect. Long-term prognosis is set not by the valve but by the renal damage already sustained antenatally and by later bladder dysfunction.","teaching_point":"Catheter first, imaging second. The nadir creatinine after drainage is the prognostic parameter."},"flag_note":null}}},{"id":"uro-kin-00009","version":1,"status":"published","taxonomy":{"subdomain":"Enuresis","tags":["leitlinie","pharmakologie","dosierung"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"ICCS","title":"International Children's Continence Society, Standardisierung und Behandlung der Enuresis","year":2025}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Siebenjähriges Mädchen, seit jeher nächtliches Einnässen in vier bis fünf Nächten pro Woche. Tagsüber keine Drangsymptome und kein Einnässen, normaler Stuhlgang, Sonographie und Restharn unauffällig, Urin steril.","lead_in":"Welches Vorgehen ist angezeigt?","options":{"A":{"text":"Urodynamische Untersuchung zur Klärung der Blasenfunktion","rationale":"Bei monosymptomatischer Enuresis ohne Tagessymptomatik nicht indiziert; sie belastet ohne therapeutische Konsequenz."},"B":{"text":"Anticholinerge Therapie als erster Behandlungsschritt","rationale":"Sie zielt auf Drangsymptome der nicht monosymptomatischen Form; hier fehlt der Ansatzpunkt."},"C":{"text":"Nächtliches Wecken durch die Eltern als Standardtherapie","rationale":"Kurzfristig trockene Nächte, aber kein Lerneffekt und keine dauerhafte Wirkung."},"D":{"text":"Aufklärung und Protokoll, danach Alarm oder Desmopressin","rationale":"Die Alarmtherapie wirkt nachhaltiger über den Lerneffekt, Desmopressin wirkt rascher und ist bei Übernachtungen praktisch. Beide sind Erstlinienoptionen. Desmopressin wird beispielsweise mit 120 bis 240 Mikrogramm als Schmelztablette zur Nacht gegeben. Die Alarmtherapie wirkt nachhaltiger über den Lerneffekt; beide sind Erstlinienoptionen."}},"explanation":{"core":"Zuerst wird zwischen monosymptomatischer und nicht monosymptomatischer Enuresis unterschieden, denn nur die zweite braucht eine Blasenabklärung. Bei der monosymptomatischen Form beginnt die Behandlung mit Aufklärung und Protokoll, dann folgt die Wahl zwischen Alarm und Desmopressin nach Alltag und Wunsch der Familie. Eine Obstipation ist vor jeder Therapie zu behandeln.","teaching_point":"Tagessymptome ändern die Diagnose und damit die gesamte Abklärung."},"flag_note":null},"en":{"vignette":"Seven-year-old girl with lifelong bedwetting on four to five nights per week. No daytime urgency or wetting, normal bowel habit, normal ultrasound and post-void residual, sterile urine.","lead_in":"Which approach is indicated?","options":{"A":{"text":"Urodynamic study to clarify bladder function","rationale":"Not indicated in monosymptomatic enuresis without daytime symptoms; it burdens the child without therapeutic consequence."},"B":{"text":"Antimuscarinic therapy as the first treatment step","rationale":"This targets urgency in the non-monosymptomatic form; there is no rationale here."},"C":{"text":"Night-time waking by the parents as standard therapy","rationale":"Dry nights in the short term, but no learning effect and no lasting benefit."},"D":{"text":"Education and a diary, then alarm or desmopressin","rationale":"Alarm therapy works more durably through a learning effect; desmopressin acts faster and is practical for sleepovers. Both are first-line options. Desmopressin is given for example as 120 to 240 micrograms as an oral lyophilisate at night. Alarm therapy works more durably through a learning effect; both are first-line."}},"explanation":{"core":"The first step is distinguishing monosymptomatic from non-monosymptomatic enuresis, because only the latter needs a bladder workup. In the monosymptomatic form treatment starts with education and a diary, then the choice between alarm and desmopressin follows the family's routine and preference. Constipation must be treated before any therapy.","teaching_point":"Daytime symptoms change the diagnosis and with it the entire workup."},"flag_note":null}}},{"id":"uro-kin-00010","version":1,"status":"published","taxonomy":{"subdomain":"Nephroblastom","tags":["leitlinie","pathologie","bildgebung"],"domain":"kinderurologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"SIOP","title":"SIOP-Protokoll für Nierentumoren im Kindesalter","year":2025}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Dreijähriges Mädchen mit tastbarer, schmerzloser Raumforderung im linken Oberbauch. Sonographie und MRT zeigen einen großen, von der Niere ausgehenden soliden Tumor mit Pseudokapsel, keine Gefäßinfiltration, keine Lungenmetastasen. Alter und Bildgebung sind typisch für ein Nephroblastom.","lead_in":"Wie ist das Vorgehen nach europäischem Standard?","options":{"A":{"text":"Perkutane Stanzbiopsie, danach Therapieentscheidung","rationale":"Bei typischer Konstellation nicht erforderlich und mit dem Risiko der Tumorzellverschleppung und eines Stadien-Upstagings behaftet."},"B":{"text":"Präoperative Chemotherapie ohne vorherige Biopsie","rationale":"Das europäische SIOP-Konzept verkleinert den Tumor, verringert die Rupturgefahr bei der Operation und senkt damit Stadium und Nachbehandlung. Das europäische SIOP-Konzept verkleinert den Tumor und verringert die Rupturgefahr bei der Operation, was Stadium und Nachbehandlung senkt."},"C":{"text":"Primäre Tumornephrektomie ohne Systemtherapie","rationale":"Das ist das nordamerikanische Vorgehen. Beide Konzepte sind onkologisch gleichwertig, unterscheiden sich aber in der Reihenfolge; entscheidend ist, einem konsequent zu folgen."},"D":{"text":"Primäre Bestrahlung der Nierenloge einleiten","rationale":"Die Strahlentherapie gehört zur risikoadaptierten Nachbehandlung, nicht zur Erstmaßnahme."}},"explanation":{"core":"Beim Nephroblastom unterscheiden sich Europa und Nordamerika systematisch: SIOP behandelt präoperativ und operiert danach, COG operiert zuerst und stadiert am unbehandelten Tumor. Im europäischen Konzept wird die Biopsie bei typischem Alter und typischer Bildgebung bewusst vermieden, bei atypischen Konstellationen dagegen erwogen.","teaching_point":"In Europa Chemotherapie vor dem Messer, und bei typischem Befund ohne Biopsie."},"flag_note":null},"en":{"vignette":"Three-year-old girl with a palpable, painless left upper abdominal mass. Ultrasound and MRI show a large solid tumour arising from the kidney with a pseudocapsule, no vascular invasion and no pulmonary metastases. Age and imaging are typical of nephroblastoma.","lead_in":"What is the European standard approach?","options":{"A":{"text":"Percutaneous core biopsy, then a treatment decision","rationale":"Not required in a typical constellation and carrying the risks of tumour seeding and stage upgrading."},"B":{"text":"Preoperative chemotherapy without prior biopsy","rationale":"The European SIOP concept shrinks the tumour, reduces the risk of intraoperative rupture and thereby lowers stage and adjuvant treatment. The European SIOP concept shrinks the tumour and reduces the risk of intraoperative rupture, which lowers stage and adjuvant treatment."},"C":{"text":"Primary tumour nephrectomy without systemic therapy","rationale":"This is the North American approach. Both concepts are oncologically equivalent but differ in sequence; what matters is following one consistently."},"D":{"text":"Initiate primary radiotherapy to the renal bed","rationale":"Radiotherapy belongs to risk-adapted adjuvant treatment, not to initial management."}},"explanation":{"core":"In nephroblastoma Europe and North America differ systematically: SIOP treats preoperatively and operates afterwards, COG operates first and stages the untreated tumour. In the European concept biopsy is deliberately avoided when age and imaging are typical, but is considered in atypical constellations.","teaching_point":"In Europe, chemotherapy before the knife, and no biopsy when the picture is typical."},"flag_note":null}}},{"id":"uro-lit-00001","version":1,"status":"published","taxonomy":{"subdomain":"akuttherapie","tags":["notfall","leitlinie"],"domain":"urolithiasis"},"type":"single_best_answer","difficulty_estimated":2,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Urolithiasis","version":null,"year":2025,"section":null}],"review":{"author":"EK","reviewer":null,"created":"2026-09-02","last_reviewed":"2026-09-02","expires":"2027-09-02"},"content":{"de":{"vignette":"41-jährige Patientin, seit zwei Tagen rechtsseitige Flankenschmerzen. Temperatur 38,9 °C, Herzfrequenz 108/min, CRP 180 mg/l, Leukozyturie und Nitrit positiv. Nativ-CT: 7 mm messender distaler Harnleiterstein rechts mit zweitgradiger Harnstauung. Kreatinin 1,4 mg/dl.","lead_in":"Was ist der nächste Schritt?","options":{"A":{"text":"Primäre Ureterorenoskopie mit Steinextraktion sofort","rationale":"Die Manipulation im infizierten, gestauten System erhöht durch Druckanstieg und Keimeinschwemmung das Sepsisrisiko erheblich."},"B":{"text":"Extrakorporale Stoßwellenlithotripsie noch heute","rationale":"Bei Infekt kontraindiziert und ohne sofortige Entlastung der Stauung wirkungslos."},"C":{"text":"Expulsionstherapie mit Tamsulosin und Analgesie","rationale":"Konservatives Vorgehen setzt Infektfreiheit und stabile Nierenfunktion voraus; beides ist hier nicht gegeben."},"D":{"text":"Umgehende Harnableitung und kalkulierte Antibiose","rationale":"Die infizierte Harnstauungsniere ist ein urologischer Notfall; Entlastung und Antibiose haben Vorrang, die Steinsanierung folgt im infektfreien Intervall. Entlastet wird mit DJ-Schiene oder perkutaner Nephrostomie; die Wahl richtet sich nach Verfügbarkeit und Gerinnungssituation. Die Steinsanierung folgt im infektfreien Intervall."}},"explanation":{"core":"Fieber plus Harnstauung plus Obstruktion ergibt die Indikation zur sofortigen Entlastung, unabhängig von Steingröße und Lage. Die Wahl zwischen Schiene und Nephrostomie richtet sich nach lokaler Verfügbarkeit und Gerinnungssituation, nicht nach der Dringlichkeit.","teaching_point":"Bei infizierter Harnstauung wird entlastet, nicht saniert. Die Steintherapie ist ein zweiter, späterer Eingriff."},"flag_note":null},"en":{"vignette":"41-year-old woman with two days of right flank pain. Temperature 38.9 °C, heart rate 108/min, CRP 180 mg/l, leucocyturia and positive nitrite. Non-contrast CT: 7 mm distal ureteric stone on the right with second-degree hydronephrosis. Creatinine 1.4 mg/dl.","lead_in":"What is the next step?","options":{"A":{"text":"Primary ureteroscopy with immediate stone extraction","rationale":"Manipulation in an infected, obstructed system raises intrarenal pressure and washes bacteria into the circulation, markedly increasing sepsis risk."},"B":{"text":"Extracorporeal shockwave lithotripsy today","rationale":"Contraindicated during infection and ineffective without immediate relief of the obstruction."},"C":{"text":"Expulsive therapy with tamsulosin and analgesia","rationale":"Conservative management requires absence of infection and stable renal function; neither applies here."},"D":{"text":"Immediate urinary drainage and empirical antibiotics","rationale":"Infected obstructed hydronephrosis is a urological emergency; drainage and antibiotics take priority, stone treatment follows in an infection-free interval. Drainage is by ureteric stent or percutaneous nephrostomy, chosen by availability and coagulation status. Stone treatment follows in an infection-free interval."}},"explanation":{"core":"Fever plus hydronephrosis plus obstruction gives the indication for immediate drainage, irrespective of stone size and location. The choice between stent and nephrostomy depends on local availability and coagulation status, not on urgency.","teaching_point":"In infected obstruction you drain, you do not clear the stone. Stone treatment is a second, later procedure."},"flag_note":null}}},{"id":"uro-lit-00002","version":1,"status":"published","taxonomy":{"subdomain":"metaphylaxe","tags":["labordiagnostik","pharmakologie","nachsorge"],"domain":"urolithiasis"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Urolithiasis","version":null,"year":2025,"section":null}],"review":{"author":"EK","reviewer":null,"created":"2026-09-02","last_reviewed":"2026-09-02","expires":"2027-09-02"},"content":{"de":{"vignette":"38-jähriger Patient mit drittem Steinereignis in vier Jahren. Steinanalyse: Brushit (Calciumhydrogenphosphat-Dihydrat). 24-Stunden-Urin: Calcium 7,2 mmol/d, Citrat 2,9 mmol/d, Volumen 2,6 l. Urin-pH im Tagesprofil konstant bei 6,9.","lead_in":"Welche Metaphylaxe ist indiziert?","options":{"A":{"text":"Alkalisierung mit Kaliumcitrat auf einen Ziel-pH von 6,8","rationale":"Genau die falsche Richtung. Alkalisierung ist beim Calciumoxalat- und Harnsäurestein sinnvoll und fördert die Brushitbildung."},"B":{"text":"Ansäuerung mit L-Methionin, dazu ein Thiaziddiuretikum","rationale":"Brushit präzipitiert im alkalischen Milieu; die pH-Senkung ist der zentrale Hebel, das Thiazid adressiert die erhöhte Calciumausscheidung. Der Ziel-pH liegt bei 5,8 bis 6,2, weil Brushit im alkalischen Milieu präzipitiert. Das Thiazid adressiert die erhöhte Calciumausscheidung."},"C":{"text":"Allopurinol 300 mg täglich als Dauermedikation","rationale":"Indiziert bei Hyperurikosurie; hier fehlt jeder Ansatzpunkt in der Steinanalyse und im Urinprofil."},"D":{"text":"Reduktion der Calciumzufuhr auf unter 500 mg täglich","rationale":"Calciumrestriktion erhöht die intestinale Oxalatresorption und damit das Steinrisiko; die Zufuhr bleibt bei 1000 bis 1200 mg täglich."}},"explanation":{"core":"Brushit verhält sich in zwei Punkten gegenläufig zur allgemeinen Steinmetaphylaxe: Es braucht Ansäuerung statt Alkalisierung und es ist ausgeprägt stoßwellenresistent, weshalb die interventionelle Sanierung über Ureterorenoskopie oder perkutane Nephrolitholapaxie erfolgt.","teaching_point":"Vor jeder pH-Empfehlung muss die Steinart feststehen. Alkalisierung ist keine Standardmaßnahme."},"flag_note":null},"en":{"vignette":"38-year-old man with his third stone episode in four years. Stone analysis: brushite (calcium hydrogen phosphate dihydrate). 24-hour urine: calcium 7.2 mmol/d, citrate 2.9 mmol/d, volume 2.6 l. Urinary pH constant at 6.9 across the day profile.","lead_in":"Which metaphylaxis is indicated?","options":{"A":{"text":"Alkalinisation with potassium citrate to a target pH of 6.8","rationale":"Exactly the wrong direction. Alkalinisation is useful in calcium oxalate and uric acid stones and promotes brushite formation."},"B":{"text":"Acidification with L-methionine plus a thiazide diuretic","rationale":"Brushite precipitates in an alkaline milieu; lowering pH is the central lever, and the thiazide addresses the raised calcium excretion. The target pH is 5.8 to 6.2, because brushite precipitates in an alkaline milieu. The thiazide addresses the raised calcium excretion."},"C":{"text":"Allopurinol 300 mg daily as long-term medication","rationale":"Indicated in hyperuricosuria; here neither the stone analysis nor the urine profile provides a rationale."},"D":{"text":"Reducing calcium intake to below 500 mg daily","rationale":"Calcium restriction increases intestinal oxalate absorption and stone risk; intake stays at 1000 to 1200 mg daily."}},"explanation":{"core":"Brushite behaves opposite to general stone metaphylaxis in two respects: it requires acidification rather than alkalinisation, and it is markedly shockwave-resistant, so interventional clearance is by ureteroscopy or percutaneous nephrolithotomy.","teaching_point":"Establish the stone type before any pH recommendation. Alkalinisation is not a default measure."},"flag_note":null}}},{"id":"uro-lit-00003","version":1,"status":"published","taxonomy":{"subdomain":"metaphylaxe","tags":["leitlinie","pharmakologie","nachsorge"],"domain":"urolithiasis"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IB","certainty":"kontrovers","flag":true},"sources":[{"type":"studie","citation":"Dhayat et al., NOSTONE, N Engl J Med 2023","doi":null},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Urolithiasis","version":null,"year":2025,"section":null}],"review":{"author":"EK","reviewer":null,"created":"2026-09-02","last_reviewed":"2026-09-02","expires":"2027-03-02"},"content":{"de":{"vignette":"52-jähriger Patient mit zweitem Calciumoxalatsteinereignis. 24-Stunden-Urin: Calcium 4,1 mmol/d, Volumen 1,9 l, Citrat 2,2 mmol/d, Oxalat im Normbereich. Keine Grunderkrankung, keine gastrointestinale Vorgeschichte.","lead_in":"Wie ist die Gabe eines Thiaziddiuretikums zu bewerten?","options":{"A":{"text":"Indapamid als besser belegte Alternative einsetzen","rationale":"Für Indapamid liegt keine der NOSTONE vergleichbare randomisierte Evidenz vor; die Empfehlung wäre eine Extrapolation."},"B":{"text":"Hydrochlorothiazid 25 mg unabhängig von der Calciurie","rationale":"NOSTONE prüfte drei Dosisstufen gegen Placebo und fand keinen Vorteil im primären Endpunkt."},"C":{"text":"Hydrochlorothiazid 50 mg wegen der Dosisabhängigkeit","rationale":"Eine Dosis-Wirkungs-Beziehung ließ sich nicht nachweisen; höhere Dosen steigern nur Hypokaliämie- und Gichtrate."},"D":{"text":"Nicht indiziert; Trinkmenge und Citrat im Vordergrund","rationale":"Der Patient ist normokalziurisch. Nach NOSTONE ist ein pauschaler Thiazideinsatz bei rezidivierenden Calciumsteinen nicht begründbar. Der Patient ist normokalziurisch. Nach NOSTONE lässt sich ein pauschaler Thiazideinsatz bei rezidivierenden Calciumsteinen nicht begründen."}},"explanation":{"core":"NOSTONE hat die jahrzehntelang eingeübte Thiazidgabe bei rezidivierenden Calciumsteinen infrage gestellt. Die Studie schloss überwiegend normokalziurische Patienten ein, weshalb die Übertragung auf ausgeprägte Hyperkalziurie umstritten bleibt. Für den vorliegenden Fall spricht das klar gegen ein Thiazid.","teaching_point":"Die Metaphylaxe folgt dem 24-Stunden-Urin, nicht der Steinhäufigkeit."},"flag_note":"NOSTONE stellt den generellen Thiazideinsatz infrage. Leitlinienempfehlungen sind uneinheitlich; bei ausgeprägter Hyperkalziurie werden Thiazide weiterhin eingesetzt."},"en":{"vignette":"52-year-old man with a second calcium oxalate stone episode. 24-hour urine: calcium 4.1 mmol/d, volume 1.9 l, citrate 2.2 mmol/d, oxalate within range. No underlying disease, no gastrointestinal history.","lead_in":"How should thiazide diuretic therapy be judged here?","options":{"A":{"text":"Use indapamide as a better-supported alternative","rationale":"There is no randomised evidence for indapamide comparable to NOSTONE; the recommendation would be an extrapolation."},"B":{"text":"Hydrochlorothiazide 25 mg regardless of calciuria","rationale":"NOSTONE tested three dose levels against placebo and found no benefit in the primary endpoint."},"C":{"text":"Hydrochlorothiazide 50 mg given the dose dependence","rationale":"No dose-response relationship was demonstrated; higher doses only raise rates of hypokalaemia and gout."},"D":{"text":"Not indicated; fluid intake and citrate come first","rationale":"The patient is normocalciuric. After NOSTONE a blanket use of thiazides in recurrent calcium stones cannot be justified. The patient is normocalciuric. After NOSTONE a blanket use of thiazides in recurrent calcium stones cannot be justified."}},"explanation":{"core":"NOSTONE challenged the long-established use of thiazides in recurrent calcium stones. The trial enrolled predominantly normocalciuric patients, so extension to pronounced hypercalciuria remains disputed. For this case it argues clearly against a thiazide.","teaching_point":"Metaphylaxis follows the 24-hour urine, not the stone frequency."},"flag_note":"NOSTONE challenges the general use of thiazides. Guideline recommendations are inconsistent; thiazides are still used in pronounced hypercalciuria."}}},{"id":"uro-and-00001","version":1,"status":"published","taxonomy":{"subdomain":"Hypogonadismus","tags":["labordiagnostik","leitlinie"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"48-jähriger Mann mit Antriebslosigkeit, Libidoverlust und Zunahme des Bauchumfangs. Um 16 Uhr wurde ein Gesamttestosteron von 9,8 nmol/l gemessen. Er hat keinen Kinderwunsch mehr und fragt nach einer Testosterongabe.","lead_in":"Wie ist weiter vorzugehen?","options":{"A":{"text":"Sofortiger Beginn der Substitution mit diesem Wert","rationale":"Ein einzelner Nachmittagswert im Graubereich reicht als Grundlage nicht aus. Testosteron folgt einem Tagesrhythmus mit den höchsten Werten am Morgen, und ein Nachmittagswert unterschätzt das tatsächliche Niveau regelmäßig."},"B":{"text":"Direkt eine MRT der Hypophyse zur Ursachensuche","rationale":"Die Bildgebung folgt erst, wenn ein bestätigter Mangel mit niedrigem oder normwertigem LH vorliegt, also ein sekundärer Hypogonadismus. Bei ausgeprägt niedrigem Testosteron oder erhöhtem Prolaktin wird sie dann gezielt eingesetzt."},"C":{"text":"Zweite Messung morgens nüchtern, dazu LH, FSH und Prolaktin","rationale":"Die Bestätigung an einem zweiten Tag zwischen sieben und elf Uhr ist Voraussetzung der Diagnose. LH trennt anschließend den primären vom sekundären Hypogonadismus, und im Graubereich hilft die Bestimmung von SHBG und freiem Testosteron weiter."},"D":{"text":"Kontrolle des Wertes in einem Jahr ohne weitere Abklärung","rationale":"Die Symptomkonstellation ist typisch genug, um sie jetzt abzuklären. Ein unbehandelter Hypogonadismus wirkt sich über Jahre auf Knochendichte, Muskelmasse und Stoffwechsel aus."}},"explanation":{"core":"Die Diagnose des Hypogonadismus stützt sich auf zwei Säulen, die beide erfüllt sein müssen: passende Symptome und ein wiederholt erniedrigter morgendlicher Testosteronwert. Erst danach folgt die Einordnung über LH und FSH. Ein hoher LH-Wert weist auf eine testikuläre Ursache, ein niedriger oder unpassend normaler auf eine hypothalamisch-hypophysäre.","teaching_point":"Ein Nachmittagswert und eine einzelne Messung reichen für die Diagnose nicht aus."},"flag_note":null},"en":{"vignette":"48-year-old man with low drive, loss of libido and increasing waist circumference. A total testosterone of 9.8 nmol/l was measured at 4 pm. He no longer wishes to father children and asks about testosterone treatment.","lead_in":"How should management proceed?","options":{"A":{"text":"Start replacement immediately on this value","rationale":"A single afternoon value in the grey zone is not an adequate basis. Testosterone follows a diurnal rhythm with the highest values in the morning, and an afternoon sample regularly underestimates the true level."},"B":{"text":"Proceed directly to pituitary MRI to find the cause","rationale":"Imaging follows only once a confirmed deficiency with low or inappropriately normal LH is established, that is secondary hypogonadism. With markedly low testosterone or raised prolactin it is then used selectively."},"C":{"text":"Repeat fasting morning sample with LH, FSH and prolactin","rationale":"Confirmation on a second day between seven and eleven in the morning is a prerequisite for diagnosis. LH then separates primary from secondary hypogonadism, and in the grey zone SHBG and free testosterone help further."},"D":{"text":"Recheck the value in a year without any further workup","rationale":"The symptom pattern is typical enough to warrant assessment now. Untreated hypogonadism affects bone density, muscle mass and metabolism over years."}},"explanation":{"core":"Diagnosing hypogonadism rests on two pillars, both of which must be met: matching symptoms and a repeatedly low morning testosterone. Only then follows classification by LH and FSH. A high LH points to a testicular cause, a low or inappropriately normal one to a hypothalamic-pituitary cause.","teaching_point":"An afternoon value and a single measurement are not enough for the diagnosis."},"flag_note":null}}},{"id":"uro-and-00002","version":1,"status":"published","taxonomy":{"subdomain":"Testosterontherapie","tags":["pharmakologie","nebenwirkungen","leitlinie"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"Bei einem 56-jährigen Mann ist ein Hypogonadismus zweifach bestätigt. Der Hämatokrit liegt bei 56 Prozent, die Partnerin ist schwanger, eine Schlafapnoe ist bekannt und wird mit CPAP behandelt. Der PSA-Wert beträgt 1,1 ng/ml.","lead_in":"Welcher Befund spricht gegen den sofortigen Therapiebeginn?","options":{"A":{"text":"Die behandelte obstruktive Schlafapnoe unter CPAP","rationale":"Eine unbehandelte schwere Schlafapnoe gilt als Gegenanzeige, weil Testosteron sie verschlechtern kann. Unter wirksamer CPAP-Therapie ist sie kein Hinderungsgrund, verlangt aber eine Verlaufskontrolle."},"B":{"text":"Der Hämatokrit von 56 Prozent vor Therapiebeginn","rationale":"Oberhalb von etwa 54 Prozent besteht ein erhöhtes thromboembolisches Risiko, und Testosteron steigert die Erythropoese zusätzlich. Vor Beginn muss die Polyglobulie abgeklärt und gesenkt werden."},"C":{"text":"Der PSA-Wert von 1,1 ng/ml in diesem Lebensalter","rationale":"Dieser Wert ist unauffällig. Eine Gegenanzeige besteht beim unbehandelten Prostatakarzinom, nicht bei einem normalen PSA-Wert; kontrolliert wird er dennoch im Verlauf."},"D":{"text":"Die bestehende Schwangerschaft der Partnerin","rationale":"Sie ist keine Gegenanzeige für den Mann, verlangt aber Hygieneregeln bei Gelen wegen der Übertragung durch Hautkontakt. Der eigene Kinderwunsch wäre dagegen ein Grund gegen Testosteron."}},"explanation":{"core":"Vor Beginn einer Testosterontherapie werden vier Dinge geprüft: Blutbild mit Hämatokrit, PSA und Prostatabefund, Schlafapnoe und der Kinderwunsch. Während der Therapie wird der Hämatokrit nach drei, sechs und zwölf Monaten und danach jährlich kontrolliert; steigt er über 54 Prozent, wird die Dosis reduziert oder pausiert.","teaching_point":"Der Hämatokrit ist der Laborwert, der die Testosterontherapie am häufigsten stoppt."},"flag_note":null},"en":{"vignette":"In a 56-year-old man hypogonadism has been confirmed twice. Haematocrit is 56 per cent, his partner is pregnant, and known sleep apnoea is treated with CPAP. PSA is 1.1 ng/ml.","lead_in":"Which finding argues against starting treatment now?","options":{"A":{"text":"The treated obstructive sleep apnoea on CPAP","rationale":"Untreated severe sleep apnoea is a contraindication, because testosterone can worsen it. On effective CPAP it is not an obstacle but does require follow-up."},"B":{"text":"The haematocrit of 56 per cent before starting","rationale":"Above roughly 54 per cent thromboembolic risk is increased, and testosterone further stimulates erythropoiesis. The polycythaemia must be investigated and lowered before starting."},"C":{"text":"The PSA value of 1.1 ng/ml at this age","rationale":"This value is unremarkable. The contraindication applies to untreated prostate cancer, not to a normal PSA, although it is still monitored during treatment."},"D":{"text":"The current pregnancy of his partner","rationale":"It is not a contraindication for the man but requires hygiene precautions with gels because of transfer by skin contact. His own wish to conceive would be a reason against testosterone."}},"explanation":{"core":"Before starting testosterone four things are checked: full blood count with haematocrit, PSA and prostate examination, sleep apnoea, and the wish to father children. During treatment haematocrit is checked at three, six and twelve months and annually thereafter; above 54 per cent the dose is reduced or paused.","teaching_point":"Haematocrit is the laboratory value that most often stops testosterone therapy."},"flag_note":null}}},{"id":"uro-and-00003","version":1,"status":"published","taxonomy":{"subdomain":"Fertilität","tags":["pharmakologie","dosierung","leitlinie"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"32-jähriger Mann mit bestätigtem sekundärem Hypogonadismus, Testosteron 6,4 nmol/l, LH und FSH niedrig, Prolaktin normal, MRT der Hypophyse unauffällig. Das Spermiogramm zeigt eine schwere Oligozoospermie. Er und seine Partnerin wünschen sich ein Kind.","lead_in":"Welche Behandlung ist angezeigt?","options":{"A":{"text":"Testosteronundecanoat intramuskulär alle zwölf Wochen","rationale":"Exogenes Testosteron unterdrückt über die negative Rückkopplung LH und FSH und damit die intratestikuläre Testosteronproduktion. Die Spermatogenese verschlechtert sich dadurch weiter, teilweise bis zur Azoospermie."},"B":{"text":"Testosterongel täglich, dazu ein Antioxidanzienpräparat","rationale":"Dieselbe Suppression tritt auch unter transdermaler Gabe ein. Antioxidanzien ändern daran nichts und ersetzen die gonadotrope Stimulation nicht."},"C":{"text":"Sofortige testikuläre Spermienextraktion mit Kryokonservierung","rationale":"Ein chirurgischer Schritt vor Ausschöpfung der medikamentösen Stimulation ist verfrüht. Unter hCG und FSH erreichen viele Patienten Spermien im Ejakulat und benötigen keine Operation."},"D":{"text":"Stimulation mit hCG, bei Bedarf ergänzt um FSH","rationale":"hCG wirkt wie LH auf die Leydigzellen und stellt das intratestikuläre Testosteron her, das die Spermatogenese benötigt. Reicht das nach mehreren Monaten nicht aus, wird FSH ergänzt; alternativ kommen Clomifen oder ein Aromatasehemmer infrage."}},"explanation":{"core":"Beim sekundären Hypogonadismus mit Kinderwunsch wird nicht substituiert, sondern stimuliert. Der Unterschied ist grundlegend: Testosteron von außen hebt zwar den Serumspiegel, senkt aber die intratestikuläre Konzentration, die um ein Vielfaches höher sein muss als im Blut. Die Behandlung dauert Monate, und der Erfolg wird über Spermiogramme kontrolliert.","teaching_point":"Kinderwunsch und Testosterongabe schließen einander aus. Stimuliert wird mit hCG, nicht substituiert."},"flag_note":null},"en":{"vignette":"32-year-old man with confirmed secondary hypogonadism, testosterone 6.4 nmol/l, low LH and FSH, normal prolactin and unremarkable pituitary MRI. Semen analysis shows severe oligozoospermia. He and his partner wish to conceive.","lead_in":"Which treatment is indicated?","options":{"A":{"text":"Intramuscular testosterone undecanoate every twelve weeks","rationale":"Exogenous testosterone suppresses LH and FSH through negative feedback and with them intratesticular testosterone production. Spermatogenesis deteriorates further, in some cases to azoospermia."},"B":{"text":"Daily testosterone gel plus an antioxidant preparation","rationale":"The same suppression occurs with transdermal delivery. Antioxidants do not change this and do not replace gonadotropic stimulation."},"C":{"text":"Immediate testicular sperm extraction with cryopreservation","rationale":"A surgical step before medical stimulation has been exhausted is premature. On hCG and FSH many patients achieve sperm in the ejaculate and need no operation."},"D":{"text":"Stimulation with hCG, supplemented by FSH if needed","rationale":"hCG acts like LH on the Leydig cells and restores the intratesticular testosterone that spermatogenesis requires. If that is insufficient after several months FSH is added; clomiphene or an aromatase inhibitor are alternatives."}},"explanation":{"core":"In secondary hypogonadism with a wish to conceive, you stimulate rather than replace. The difference is fundamental: exogenous testosterone raises the serum level but lowers the intratesticular concentration, which must be many times higher than in blood. Treatment takes months and is monitored by semen analysis.","teaching_point":"Wanting children and taking testosterone are mutually exclusive. Stimulate with hCG, do not replace."},"flag_note":null}}},{"id":"uro-and-00004","version":1,"status":"published","taxonomy":{"subdomain":"Azoospermie","tags":["labordiagnostik","pathologie","leitlinie"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"35-jähriger Mann, in zwei getrennten Untersuchungen Azoospermie. Hodenvolumen beidseits 8 ml, FSH deutlich erhöht, Testosteron im unteren Normbereich, Samenleiter beidseits tastbar, Ejakulatvolumen normal.","lead_in":"Wie ist der Befund einzuordnen und welche Diagnostik folgt?","options":{"A":{"text":"Nicht obstruktiv; Karyotyp und AZF-Mikrodeletionen bestimmen","rationale":"Kleine Hoden mit erhöhtem FSH sprechen für eine Störung der Spermatogenese selbst. Vor einer testikulären Spermienextraktion gehören Karyotyp und Y-Mikrodeletionen dazu, weil eine komplette AZFa- oder AZFb-Deletion die Erfolgsaussicht praktisch aufhebt."},"B":{"text":"Obstruktiv; CFTR-Analyse bei Mann und Partnerin veranlassen","rationale":"Die CFTR-Diagnostik gilt der kongenitalen Vasaaplasie, bei der die Samenleiter nicht tastbar sind und das Ejakulatvolumen niedrig und sauer ist. Beides trifft hier nicht zu."},"C":{"text":"Obstruktiv; transrektale Sonographie zur Suche der Enge","rationale":"Sie kommt bei Verdacht auf eine Obstruktion der Ductus ejaculatorii infrage, typischerweise mit kleinem Ejakulatvolumen und normalem FSH bei normal großen Hoden."},"D":{"text":"Zunächst Testosteron substituieren und dann erneut messen","rationale":"Die Substitution würde die verbliebene Spermatogenese vollends unterdrücken und ist bei Kinderwunsch gerade zu vermeiden."}},"explanation":{"core":"Die erste Weiche bei Azoospermie ist obstruktiv gegen nicht obstruktiv, und sie wird ohne Operation gestellt: über Hodenvolumen, FSH, Tastbefund der Samenleiter und Ejakulatvolumen. Kleine Hoden mit hohem FSH bedeuten nicht obstruktiv, normal große Hoden mit normalem FSH sprechen für eine Obstruktion. Erst danach folgen genetische Diagnostik und die Planung der Spermiengewinnung.","teaching_point":"FSH und Hodenvolumen trennen die beiden Formen, nicht die Biopsie."},"flag_note":null},"en":{"vignette":"35-year-old man with azoospermia on two separate analyses. Testicular volume 8 ml bilaterally, FSH markedly raised, testosterone at the lower limit of normal, vasa deferentia palpable bilaterally, normal ejaculate volume.","lead_in":"How should this be classified and what workup follows?","options":{"A":{"text":"Non-obstructive; obtain karyotype and AZF microdeletions","rationale":"Small testes with raised FSH indicate a disorder of spermatogenesis itself. Before testicular sperm extraction, karyotype and Y microdeletions belong to the workup, because complete AZFa or AZFb deletion virtually abolishes the chance of retrieval."},"B":{"text":"Obstructive; arrange CFTR analysis in him and his partner","rationale":"CFTR testing applies to congenital absence of the vas deferens, where the vasa are impalpable and the ejaculate volume is low and acidic. Neither applies here."},"C":{"text":"Obstructive; transrectal ultrasound to locate the blockage","rationale":"This applies when ejaculatory duct obstruction is suspected, typically with low ejaculate volume and normal FSH in normally sized testes."},"D":{"text":"Replace testosterone first and then repeat the analysis","rationale":"Replacement would completely suppress any remaining spermatogenesis and is precisely what must be avoided when children are wanted."}},"explanation":{"core":"The first branch point in azoospermia is obstructive versus non-obstructive, and it is reached without surgery: from testicular volume, FSH, palpation of the vasa and ejaculate volume. Small testes with high FSH mean non-obstructive; normal testes with normal FSH suggest obstruction. Genetic testing and planning of sperm retrieval follow only then.","teaching_point":"FSH and testicular volume separate the two forms, not the biopsy."},"flag_note":null}}},{"id":"uro-and-00005","version":1,"status":"published","taxonomy":{"subdomain":"kongenitale Vasaaplasie","tags":["labordiagnostik","pathologie","praeoperativ"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"29-jähriger Mann mit Azoospermie. Die Samenleiter sind beidseits nicht tastbar, das Ejakulatvolumen beträgt 0,7 ml bei saurem pH. Hodenvolumen und FSH sind normal. Das Paar wünscht eine Kinderwunschbehandlung.","lead_in":"Was ist vor der Spermiengewinnung zu veranlassen?","options":{"A":{"text":"Karyotyp und AZF-Mikrodeletionen beim Mann bestimmen","rationale":"Diese Untersuchungen gelten der nicht obstruktiven Azoospermie mit gestörter Spermatogenese. Hier sind FSH und Hodenvolumen normal, die Störung liegt im Transportweg."},"B":{"text":"Transrektale Sonographie zur Darstellung der Enge","rationale":"Sie hilft bei Verdacht auf eine Obstruktion der Ductus ejaculatorii, etwa durch eine Mittellinienzyste. Bei fehlenden Samenleitern ist die Ursache bereits geklärt."},"C":{"text":"CFTR-Analyse bei ihm und zusätzlich bei der Partnerin","rationale":"Die kongenitale beidseitige Vasaaplasie ist in einem Großteil der Fälle mit CFTR-Varianten verbunden. Ist auch die Partnerin Trägerin, besteht ein erhebliches Risiko für ein Kind mit zystischer Fibrose, was vor der Behandlung besprochen werden muss."},"D":{"text":"Sofortige mikrochirurgische Rekonstruktion des Samenleiters","rationale":"Rekonstruiert werden kann nur, was angelegt ist. Bei Aplasie erfolgt die Spermiengewinnung aus Nebenhoden oder Hoden mit anschließender intrazytoplasmatischer Spermieninjektion."}},"explanation":{"core":"Die Trias aus nicht tastbaren Samenleitern, kleinem saurem Ejakulat und normalem FSH beschreibt die kongenitale beidseitige Vasaaplasie. Sie ist eine milde Ausprägung des CFTR-Spektrums, weshalb die genetische Abklärung beide Partner betrifft. Zusätzlich ist eine sonographische Kontrolle der Nieren sinnvoll, weil bei einseitiger Aplasie häufig eine Nierenagenesie vorliegt.","teaching_point":"Fehlende Samenleiter heißt CFTR abklären, und zwar bei beiden Partnern."},"flag_note":null},"en":{"vignette":"29-year-old man with azoospermia. The vasa deferentia are impalpable bilaterally, ejaculate volume is 0.7 ml with acidic pH. Testicular volume and FSH are normal. The couple wishes to undergo fertility treatment.","lead_in":"What must be arranged before sperm retrieval?","options":{"A":{"text":"Obtain karyotype and AZF microdeletions in the man","rationale":"These tests apply to non-obstructive azoospermia with disordered spermatogenesis. Here FSH and testicular volume are normal and the problem lies in the transport pathway."},"B":{"text":"Transrectal ultrasound to demonstrate the obstruction","rationale":"This helps when ejaculatory duct obstruction is suspected, for example from a midline cyst. With absent vasa the cause is already established."},"C":{"text":"CFTR analysis in him and additionally in his partner","rationale":"Congenital bilateral absence of the vas deferens is associated with CFTR variants in a large proportion of cases. If the partner is also a carrier there is a substantial risk of a child with cystic fibrosis, which must be discussed before treatment."},"D":{"text":"Immediate microsurgical reconstruction of the vas deferens","rationale":"Only what exists can be reconstructed. With aplasia, sperm are retrieved from the epididymis or testis followed by intracytoplasmic sperm injection."}},"explanation":{"core":"The triad of impalpable vasa, a small acidic ejaculate and normal FSH describes congenital bilateral absence of the vas deferens. It is a mild expression of the CFTR spectrum, which is why genetic assessment concerns both partners. Renal ultrasound is also worthwhile, because unilateral aplasia is often accompanied by renal agenesis.","teaching_point":"Absent vasa means CFTR testing, and in both partners."},"flag_note":null}}},{"id":"uro-and-00006","version":1,"status":"published","taxonomy":{"subdomain":"Varikozele","tags":["leitlinie","operationstechnik","bildgebung"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"Zwei Männer mit Kinderwunsch seit zwei Jahren. Beim ersten ist links eine Varikozele im Stehen sichtbar und tastbar, das Spermiogramm zeigt eine Oligoasthenozoospermie. Beim zweiten fällt eine Varikozele nur in der Dopplersonographie auf, das Spermiogramm ist normal.","lead_in":"Bei welchem Mann besteht eine Behandlungsindikation?","options":{"A":{"text":"Bei beiden, da jede Varikozele die Fertilität deutlich mindert","rationale":"Eine subklinische, nur sonographisch fassbare Varikozele hat keinen belegten Einfluss auf die Fruchtbarkeit. Ihre Behandlung verbessert weder Spermiogramm noch Schwangerschaftsrate."},"B":{"text":"Nur beim ersten wegen tastbarem Befund und schlechtem Spermiogramm","rationale":"Die Indikation verlangt drei Bedingungen zusammen: klinisch fassbare Varikozele, pathologisches Spermiogramm und unerfüllter Kinderwunsch des Paares. Alle drei sind hier erfüllt."},"C":{"text":"Nur beim zweiten, weil die Sonographie empfindlicher ist","rationale":"Empfindlichkeit ersetzt keine klinische Bedeutung. Gerade weil die Sonographie mehr findet, wird die Indikation an den tastbaren Befund gebunden."},"D":{"text":"Bei keinem, da die Varikozele die Fertilität nicht beeinflusst","rationale":"Bei klinischer Varikozele mit gestörtem Spermiogramm verbessern Verödung oder Unterbindung die Samenparameter und die Schwangerschaftsraten."}},"explanation":{"core":"Die Varikozele wird nicht behandelt, weil sie vorhanden ist, sondern weil sie schadet. Deshalb müssen klinischer Befund, Spermiogramm und Kinderwunsch zusammentreffen. Beim Jugendlichen gilt zusätzlich ein Wachstumsrückstand des betroffenen Hodens als eigenständige Indikation. Verödung und mikrochirurgische Unterbindung sind gleichwertige Verfahren, letztere mit der niedrigsten Rezidiv- und Hydrozelenrate.","teaching_point":"Subklinisch heißt nicht behandlungsbedürftig. Getastet wird im Stehen."},"flag_note":null},"en":{"vignette":"Two men with two years of infertility. In the first a left varicocele is visible and palpable on standing, and semen analysis shows oligoasthenozoospermia. In the second a varicocele is apparent only on Doppler ultrasound and semen analysis is normal.","lead_in":"In which man is treatment indicated?","options":{"A":{"text":"In both, since any varicocele clearly impairs fertility","rationale":"A subclinical varicocele detectable only on ultrasound has no proven effect on fertility. Treating it improves neither semen parameters nor pregnancy rates."},"B":{"text":"Only the first, for a palpable finding and abnormal semen","rationale":"The indication requires three conditions together: a clinically detectable varicocele, abnormal semen analysis and an unfulfilled wish for children. All three are met here."},"C":{"text":"Only the second, because ultrasound is more sensitive","rationale":"Sensitivity does not equate to clinical relevance. Precisely because ultrasound finds more, the indication is tied to the palpable finding."},"D":{"text":"In neither, since varicocele does not affect fertility","rationale":"With a clinical varicocele and abnormal semen, embolisation or ligation improve semen parameters and pregnancy rates."}},"explanation":{"core":"A varicocele is treated not because it is present but because it does harm. Clinical finding, semen analysis and the wish to conceive must therefore coincide. In adolescents, growth arrest of the affected testis counts as an independent indication. Embolisation and microsurgical ligation are equivalent, the latter with the lowest recurrence and hydrocele rates.","teaching_point":"Subclinical does not mean it needs treatment. Palpate with the patient standing."},"flag_note":null}}},{"id":"uro-and-00007","version":1,"status":"published","taxonomy":{"subdomain":"erektile Dysfunktion","tags":["labordiagnostik","pharmakologie","leitlinie"],"domain":"andrologie"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Sexual and Reproductive Health","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-08","last_reviewed":"2026-09-08","expires":"2028-09-08"},"content":{"de":{"vignette":"52-jähriger Mann mit seit einem Jahr langsam zunehmender erektiler Dysfunktion, morgendliche Erektionen sind seltener geworden. Er raucht, der Bauchumfang beträgt 108 cm, der Blutdruck 152/94 mmHg. Er nimmt kein Nitrat ein und wünscht ein Rezept für einen PDE-5-Hemmer.","lead_in":"Wie ist zu verfahren?","options":{"A":{"text":"Rezept ausstellen; weitere Diagnostik ist entbehrlich","rationale":"Der Wirkstoff hilft, aber der Befund ist ein Warnsignal. Die organisch imponierende erektile Dysfunktion geht kardiovaskulären Ereignissen im Mittel um mehrere Jahre voraus."},"B":{"text":"Zuerst eine Schwellkörperinjektion zur Diagnosesicherung","rationale":"Der Injektionstest gehört in die weiterführende Abklärung vor invasiven Verfahren, nicht in die Erstbeurteilung eines typischen Falls."},"C":{"text":"Zunächst psychosomatische Mitbehandlung ohne Medikation","rationale":"Der schleichende Beginn mit nachlassenden Morgenerektionen spricht für eine organische Ursache. Psychogene Formen beginnen meist plötzlich und situationsabhängig."},"D":{"text":"Kardiovaskuläres Risiko erfassen und parallel behandeln","rationale":"Erhoben werden Blutdruck, Lipide, Glukose beziehungsweise HbA1c sowie Testosteron. Der PDE-5-Hemmer wird verordnet, aber die Gefäßsituation gleichzeitig angegangen; absolute Gegenanzeige bleibt die gleichzeitige Nitrateinnahme."}},"explanation":{"core":"Die erektile Dysfunktion ist häufig die erste sichtbare Manifestation einer generalisierten Endothelstörung, weil die Penisarterien einen kleineren Durchmesser haben als die Koronararterien. Deshalb ist sie ein Anlass zur kardiovaskulären Abklärung und nicht nur ein Symptom, das behandelt wird. Die Verordnung eines PDE-5-Hemmers schließt das nicht aus, sondern ergänzt es.","teaching_point":"Die
