res":"2028-09-07"},"content":{"de":{"vignette":"Ein 28-jähriger Patient mit Nichtseminom im Stadium I und lymphovaskulärer Invasion lehnt jede Chemotherapie ab. Der Anteil an reifem Teratom im Primärtumor beträgt 60 Prozent. Er fragt nach der primären retroperitonealen Lymphadenektomie.","lead_in":"Wie ist die Indikation zu bewerten?","options":{"A":{"text":"Nicht vertretbar, da im Stadium I heute ohne Stellenwert","rationale":"Sie ist zurückgetreten, aber nicht verlassen; für bestimmte Konstellationen bleibt sie eine begründbare Wahl."},"B":{"text":"Vertretbar bei Chemotherapieablehnung und hohem Teratomanteil","rationale":"Reifes Teratom ist chemotherapieresistent, sodass die Operation hier zusätzlich Sinn ergibt. Rezidive treten dennoch auf, meist pulmonal oder als Markeranstieg. Die verbliebenen Indikationen sind Ablehnung oder Kontraindikation der Chemotherapie, ein hoher Teratomanteil und eine nicht sicherzustellende Nachsorge. Aufzuklären ist über Rezidive außerhalb des Ausräumungsgebietes und über die Ejakulationsstörung."},"C":{"text":"Vertretbar, weil die Lymphadenektomie die Nachsorge ersetzt","rationale":"Die Nachsorge bleibt in jedem Fall erforderlich, da Rezidive außerhalb des Retroperitoneums auftreten."},"D":{"text":"Vertretbar nur zusammen mit einem Zyklus BEP adjuvant","rationale":"Die Kombination beider Verfahren ist im Stadium I nicht vorgesehen und addiert die Toxizitäten."}},"explanation":{"core":"Die primäre retroperitoneale Lymphadenektomie im Stadium I hat ihren früheren Stellenwert an Surveillance und adjuvante Chemotherapie verloren. Geblieben sind drei Indikationen: Ablehnung oder Kontraindikation der Chemotherapie, hoher Teratomanteil und die Situation, in der eine verlässliche Nachsorge nicht sicherzustellen ist.","teaching_point":"Teratom schrumpft nicht unter Chemotherapie. Das ist das stärkste Argument für die Operation."},"flag_note":null},"en":{"vignette":"A 28-year-old man with stage I non-seminoma and lymphovascular invasion refuses any chemotherapy. Mature teratoma makes up 60 per cent of the primary tumour. He asks about primary retroperitoneal lymph node dissection.","lead_in":"How should the indication be judged?","options":{"A":{"text":"Not defensible, since it has no role in stage I today","rationale":"It has receded but not been abandoned; for particular constellations it remains a defensible choice."},"B":{"text":"Defensible with refusal of chemotherapy and high teratoma content","rationale":"Mature teratoma is chemoresistant, so surgery makes additional sense here. Relapses still occur, usually pulmonary or as a marker rise. The remaining indications are refusal of or contraindication to chemotherapy, a high teratoma content, and follow-up that cannot be assured. Counselling must cover relapses outside the dissection field and ejaculatory dysfunction."},"C":{"text":"Defensible, because lymphadenectomy replaces the follow-up","rationale":"Follow-up remains necessary in any case, since relapses occur outside the retroperitoneum."},"D":{"text":"Defensible only together with one adjuvant cycle of BEP","rationale":"Combining both is not intended in stage I and adds the toxicities together."}},"explanation":{"core":"Primary retroperitoneal lymph node dissection in stage I has lost its former role to surveillance and adjuvant chemotherapy. Three indications remain: refusal of or contraindication to chemotherapy, a high teratoma content, and situations where reliable follow-up cannot be assured.","teaching_point":"Teratoma does not shrink with chemotherapy. That is the strongest argument for surgery."},"flag_note":null}}},{"id":"uro-hod-00011","version":1,"status":"published","taxonomy":{"subdomain":"retroperitoneale Lymphadenektomie","tags":["operationstechnik","pathologie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Bei einem rechtsseitigen Nichtseminom soll eine modifizierte, nervschonende retroperitoneale Lymphadenektomie erfolgen.","lead_in":"Welches Ausräumungsgebiet entspricht der Seitenlokalisation?","options":{"A":{"text":"Ausschließlich paraaortal wie bei linksseitigem Primärtumor","rationale":"Das paraaortale Feld ist das Hauptabflussgebiet der linken Seite, nicht der rechten."},"B":{"text":"Beidseitige vollständige Ausräumung in allen Fällen","rationale":"Das vollständige bilaterale Template gefährdet die Ejakulation und wird durch modifizierte Felder ersetzt, wo onkologisch vertretbar."},"C":{"text":"Parakaval, präkaval und interaortokaval auf der Tumorseite","rationale":"Der rechte Hoden folgt der V. testicularis zur V. cava; der Übertritt nach links kommt vor, der umgekehrte Weg dagegen kaum. Der rechte Hoden drainiert über die V. testicularis zur V. cava und damit in diese Stationen. Der Übertritt von rechts nach links kommt vor, der umgekehrte Weg dagegen kaum."},"D":{"text":"Ausschließlich iliakal auf der betroffenen Körperseite","rationale":"Die iliakalen Stationen sind beim Hodentumor sekundär und nicht das primäre Abflussgebiet."}},"explanation":{"core":"Der Lymphabfluss des Hodens folgt der embryonalen Anlage und damit den Gonadengefäßen: rechts zur V. cava mit parakavalen, präkavalen und interaortokavalen Stationen, links zur V. renalis mit paraaortalen und präaortalen Stationen. Der Übertritt von rechts nach links ist häufig, umgekehrt selten. Daraus ergeben sich die seitenabhängigen modifizierten Template.","teaching_point":"Der Hoden drainiert nach oben zur Nierenvene, nicht nach unten in die Leiste."},"flag_note":null},"en":{"vignette":"A modified, nerve-sparing retroperitoneal lymph node dissection is planned for a right-sided non-seminoma.","lead_in":"Which template matches the side of the primary?","options":{"A":{"text":"Para-aortic only, as for a left-sided primary tumour","rationale":"The para-aortic field is the main drainage area of the left side, not the right."},"B":{"text":"Complete bilateral dissection in every case","rationale":"The full bilateral template endangers ejaculation and is replaced by modified fields where oncologically acceptable."},"C":{"text":"Paracaval, precaval and interaortocaval on the tumour side","rationale":"The right testis follows the testicular vein to the cava; crossover to the left occurs, whereas the reverse is rare. The right testis drains through the testicular vein to the cava and thus into these stations. Right-to-left crossover occurs, whereas the reverse is rare."},"D":{"text":"Iliac stations only on the affected side of the body","rationale":"Iliac stations are secondary in testicular cancer and not the primary drainage area."}},"explanation":{"core":"Testicular lymphatic drainage follows embryological origin and thus the gonadal vessels: on the right to the cava with paracaval, precaval and interaortocaval stations, on the left to the renal vein with para-aortic and preaortic stations. Right-to-left crossover is common, the reverse rare. The side-specific modified templates follow from this.","teaching_point":"The testis drains upwards to the renal vein, not downwards to the groin."},"flag_note":null}}},{"id":"uro-hod-00012","version":1,"status":"published","taxonomy":{"subdomain":"Residualtumor","tags":["bildgebung","operationstechnik","pathologie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Während der zweiten Chemotherapiegabe bei metastasiertem Nichtseminom fallen AFP und beta-hCG kontinuierlich, die retroperitoneale Raumforderung wächst jedoch von 4 auf 7 cm. Der Patient ist beschwerdearm.","lead_in":"Wie ist der Befund zu deuten?","options":{"A":{"text":"Progress unter Therapie; Wechsel auf Salvage-Chemotherapie","rationale":"Ein echter Progress ginge mit steigenden Markern einher; hier fallen sie."},"B":{"text":"Pseudoprogress durch Entzündung; Fortsetzung unverändert","rationale":"Ein Pseudoprogress ist ein Konzept der Immuntherapie und erklärt kein Wachstum unter zytotoxischer Behandlung bei fallenden Markern."},"C":{"text":"Einblutung in die Metastase; konservatives Vorgehen","rationale":"Möglich, aber selten, und sie erklärt kein anhaltendes Wachstum über Wochen."},"D":{"text":"Wachsendes Teratom-Syndrom; vollständige Resektion","rationale":"Reifes Teratom ist chemotherapieresistent und wächst weiter, während die malignen Anteile ansprechen und die Marker fallen. Die Behandlung ist ausschließlich chirurgisch. Die Chemotherapie wird planmäßig zu Ende geführt, danach wird der Befund reseziert. Weitere Zyklen helfen nicht, und Zuwarten gefährdet die Resektabilität durch Gefäßeinbezug."}},"explanation":{"core":"Die Kombination aus fallenden Markern und wachsender Raumforderung ist beim Keimzelltumor beweisend für Teratom. Weitere Chemotherapie hilft nicht, und das Zuwarten birgt die Gefahr, dass die Resektabilität durch Gefäßeinbezug verloren geht. Selten entwickelt sich aus einem Teratom eine somatische maligne Transformation.","teaching_point":"Marker runter, Tumor größer: das Messer, nicht der nächste Zyklus."},"flag_note":null},"en":{"vignette":"During the second cycle of chemotherapy for metastatic non-seminoma, AFP and beta-hCG fall steadily while the retroperitoneal mass grows from 4 to 7 cm. The patient has few symptoms.","lead_in":"How should this be interpreted?","options":{"A":{"text":"Progression on treatment; switch to salvage chemotherapy","rationale":"True progression would come with rising markers; here they are falling."},"B":{"text":"Pseudoprogression from inflammation; continue unchanged","rationale":"Pseudoprogression is a concept from immunotherapy and does not explain growth under cytotoxic treatment with falling markers."},"C":{"text":"Haemorrhage into the metastasis; conservative management","rationale":"Possible but rare, and it does not explain sustained growth over weeks."},"D":{"text":"Growing teratoma syndrome; complete surgical resection","rationale":"Mature teratoma is chemoresistant and keeps growing while the malignant components respond and markers fall. Treatment is exclusively surgical. Chemotherapy is completed as planned and the mass then resected. Further cycles do not help, and waiting endangers resectability through vascular involvement."}},"explanation":{"core":"Falling markers with a growing mass is diagnostic of teratoma in germ cell tumours. Further chemotherapy does not help, and waiting risks losing resectability through vascular involvement. Rarely a teratoma undergoes somatic malignant transformation.","teaching_point":"Markers down, tumour up: the knife, not the next cycle."},"flag_note":null}}},{"id":"uro-hod-00013","version":1,"status":"published","taxonomy":{"subdomain":"Seminom-Residuum","tags":["bildgebung","leitlinie","nachsorge"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"38-jähriger Patient mit metastasiertem Seminom nach abgeschlossener Chemotherapie. Im CT verbleibt eine retroperitoneale Raumforderung von 4,2 cm, die Marker sind normal. Die Chemotherapie endete vor drei Wochen.","lead_in":"Wie ist vorzugehen?","options":{"A":{"text":"PET/CT frühestens sechs Wochen nach Therapieende","rationale":"Ab drei Zentimetern hat die PET beim Seminom-Residuum einen hohen negativen Vorhersagewert, aber nur bei ausreichendem Abstand zur Chemotherapie, sonst überwiegen entzündliche falsch positive Befunde. Bei negativem Befund wird überwacht, bei positivem reseziert oder bioptisch gesichert. Der Abstand ist nötig, weil die Entzündungsreaktion nach der Chemotherapie sonst falsch positive Befunde erzeugt."},"B":{"text":"Sofortige Residualtumorresektion wie beim Nichtseminom","rationale":"Seminom-Residuen bestehen überwiegend aus Nekrose und Fibrose; die Operation ist im vernarbten Feld technisch schwierig und meist entbehrlich."},"C":{"text":"PET/CT unmittelbar jetzt, um keine Zeit zu verlieren","rationale":"Zu früh durchgeführt liefert die PET falsch positive Ergebnisse durch die Entzündungsreaktion nach der Chemotherapie."},"D":{"text":"Zwei weitere Zyklen Chemotherapie zur Verkleinerung","rationale":"Ohne Nachweis vitalen Tumors nicht begründet und mit zusätzlicher Toxizität verbunden."}},"explanation":{"core":"Seminom und Nichtseminom werden nach Chemotherapie unterschiedlich behandelt. Beim Nichtseminom wird jedes Residuum ab etwa einem Zentimeter reseziert, weil Teratom möglich ist. Beim Seminom gibt es kein Teratom, weshalb unterhalb von drei Zentimetern beobachtet wird und darüber die PET nach frühestens sechs Wochen entscheidet.","teaching_point":"Beim Seminom entscheidet die PET, beim Nichtseminom das Skalpell."},"flag_note":null},"en":{"vignette":"38-year-old man with metastatic seminoma after completing chemotherapy. CT shows a residual retroperitoneal mass of 4.2 cm with normal markers. Chemotherapy ended three weeks ago.","lead_in":"How should management proceed?","options":{"A":{"text":"PET/CT no earlier than six weeks after treatment ends","rationale":"Above three centimetres PET has a high negative predictive value in seminoma residuals, but only with sufficient interval from chemotherapy, otherwise inflammatory false positives dominate. A negative scan leads to surveillance, a positive one to resection or biopsy. The interval is needed because post-chemotherapy inflammation otherwise produces false positives."},"B":{"text":"Immediate residual mass resection as in non-seminoma","rationale":"Seminoma residuals consist mostly of necrosis and fibrosis; surgery in the scarred field is technically difficult and usually unnecessary."},"C":{"text":"PET/CT right now, so as not to lose time","rationale":"Performed too early, PET yields false positives from the post-chemotherapy inflammatory reaction."},"D":{"text":"Two further cycles of chemotherapy to shrink the mass","rationale":"Unjustified without evidence of viable tumour and associated with additional toxicity."}},"explanation":{"core":"Seminoma and non-seminoma diverge after chemotherapy. In non-seminoma every residual above roughly one centimetre is resected because teratoma is possible. In seminoma there is no teratoma, so masses below three centimetres are observed and above that PET decides, no earlier than six weeks.","teaching_point":"In seminoma PET decides, in non-seminoma the scalpel."},"flag_note":null}}},{"id":"uro-hod-00014","version":1,"status":"published","taxonomy":{"subdomain":"Tumormarker","tags":["labordiagnostik","nachsorge"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Nach Ablatio bei Nichtseminom werden die Marker im Verlauf kontrolliert, um den Abfall zu beurteilen.","lead_in":"Welche Halbwertszeiten und welche Fehlerquellen sind zu beachten?","options":{"A":{"text":"AFP etwa ein Tag, beta-hCG etwa zwei Wochen","rationale":"Die Halbwertszeiten sind vertauscht, und die Niere ist nicht die typische Fehlerquelle."},"B":{"text":"AFP etwa fünf bis sieben Tage, beta-hCG ein bis drei Tage","rationale":"Ein zu langsamer Abfall gemessen an diesen Halbwertszeiten gilt als Therapieversagen. Deshalb müssen falsch positive Ursachen ausgeschlossen sein, bevor eskaliert wird. Falsch hohe AFP-Werte entstehen bei Leberschädigung, falsch hohe beta-hCG-Werte bei Hypogonadismus, durch Kreuzreaktion mit LH und bei Cannabiskonsum. Diese Ursachen sind auszuschließen, bevor wegen eines zu langsamen Abfalls eskaliert wird."},"C":{"text":"Beide Marker mit einer Halbwertszeit von etwa dreißig Tagen","rationale":"Damit wäre eine Verlaufsbeurteilung innerhalb der ersten Wochen unmöglich; die tatsächlichen Halbwertszeiten sind deutlich kürzer."},"D":{"text":"Halbwertszeiten ohne Bedeutung, nur der Absolutwert zählt","rationale":"Gerade die Abfallgeschwindigkeit ist prognostisch und therapeutisch relevant, unabhängig vom Ausgangswert."}},"explanation":{"core":"Die Marker beim Keimzelltumor liefern über ihre Kinetik mehr Information als über den Einzelwert. Ein Abfall langsamer als die Halbwertszeit spricht für verbliebene Tumorlast. Vor jeder Therapieeskalation sind die typischen Fehlerquellen zu prüfen, weil sonst gesunde Patienten unnötig chemotherapiert werden.","teaching_point":"Nicht der Wert zählt, sondern ob er schnell genug fällt."},"flag_note":null},"en":{"vignette":"After orchiectomy for non-seminoma, markers are followed to assess their decline.","lead_in":"Which half-lives and which sources of error must be considered?","options":{"A":{"text":"AFP about one day, beta-hCG about two weeks","rationale":"The half-lives are swapped, and the kidney is not the typical source of error."},"B":{"text":"AFP about five to seven days, beta-hCG one to three days","rationale":"A decline slower than these half-lives counts as treatment failure. False positive causes must therefore be excluded before escalating. Falsely high AFP arises with liver damage, falsely high beta-hCG with hypogonadism, cross-reaction with LH and cannabis use. These must be excluded before escalating treatment for a slow decline."},"C":{"text":"Both markers with a half-life of about thirty days","rationale":"That would make assessment within the first weeks impossible; the actual half-lives are much shorter."},"D":{"text":"Half-lives irrelevant; only the absolute value counts here","rationale":"The rate of decline is prognostically and therapeutically relevant, independently of the starting value."}},"explanation":{"core":"In germ cell tumours markers convey more through their kinetics than through single values. A decline slower than the half-life indicates residual tumour burden. Before escalating treatment the typical sources of error must be checked, otherwise healthy patients are chemotherapied unnecessarily.","teaching_point":"It is not the value that counts but whether it falls fast enough."},"flag_note":null}}},{"id":"uro-hod-00015","version":1,"status":"published","taxonomy":{"subdomain":"IGCCCG","tags":["pathologie","pharmakologie","dosierung","leitlinie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"klassifikation","citation":"IGCCCG-Klassifikation"}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"24-jähriger Patient mit Nichtseminom, ausgedehnten retroperitonealen Metastasen und zwei Lebermetastasen. AFP 12 000 ng/ml, beta-hCG 8000 IU/l, LDH deutlich erhöht. Lungenfunktion normal, ECOG 1.","lead_in":"Welche Prognosegruppe und welche Therapie?","options":{"A":{"text":"Gute Prognose; drei Zyklen BEP","rationale":"Lebermetastasen sind nicht pulmonale viszerale Metastasen und schließen die gute Prognosegruppe aus."},"B":{"text":"Intermediäre Prognose; drei Zyklen BEP","rationale":"Die Zyklenzahl passt nicht: Bereits die intermediäre Gruppe erhält vier Zyklen."},"C":{"text":"Gute Prognose wegen gonadalem Primärtumor; drei Zyklen BEP","rationale":"Der gonadale Ursprung ist eine Voraussetzung für die gute Gruppe, genügt aber nicht, wenn viszerale Metastasen oder sehr hohe Marker vorliegen."},"D":{"text":"Ungünstige Prognose; vier Zyklen BEP","rationale":"Nicht pulmonale viszerale Metastasen, ein mediastinaler Primärtumor oder sehr hohe Marker definieren beim Nichtseminom die ungünstige Gruppe, die vier Zyklen erhält. Ausschlaggebend sind die Lebermetastasen als nicht pulmonale viszerale Metastasen. Beim Nichtseminom definieren sie zusammen mit einem mediastinalen Primärtumor und sehr hohen Markern die ungünstige Gruppe."}},"explanation":{"core":"Die IGCCCG-Klassifikation stützt sich auf drei Achsen: Lokalisation des Primärtumors, Vorhandensein nicht pulmonaler viszeraler Metastasen und Markerhöhe. Beim Seminom gibt es nur eine gute und eine intermediäre Gruppe, eine ungünstige existiert nicht. Beim Nichtseminom bestimmt die Gruppe unmittelbar die Zyklenzahl.","teaching_point":"Leber, Knochen und Hirn sind viszeral. Lunge ist die Ausnahme, die nicht zählt."},"flag_note":null},"en":{"vignette":"24-year-old man with non-seminoma, extensive retroperitoneal metastases and two liver metastases. AFP 12,000 ng/ml, beta-hCG 8000 IU/l, LDH markedly raised. Lung function normal, ECOG 1.","lead_in":"Which prognostic group and which treatment?","options":{"A":{"text":"Good prognosis; three cycles of BEP","rationale":"Liver metastases are non-pulmonary visceral metastases and exclude the good prognosis group."},"B":{"text":"Intermediate prognosis; three cycles of BEP","rationale":"The cycle number does not fit: even the intermediate group receives four cycles."},"C":{"text":"Good prognosis given a gonadal primary; three cycles of BEP","rationale":"Gonadal origin is a prerequisite for the good group but does not suffice when visceral metastases or very high markers are present."},"D":{"text":"Poor prognosis; four cycles of BEP","rationale":"Non-pulmonary visceral metastases, a mediastinal primary or very high markers define the poor group in non-seminoma, which receives four cycles. The liver metastases are decisive as non-pulmonary visceral disease. In non-seminoma they define the poor group together with a mediastinal primary and very high markers."}},"explanation":{"core":"The IGCCCG classification rests on three axes: site of the primary, presence of non-pulmonary visceral metastases and marker level. Seminoma has only good and intermediate groups; a poor group does not exist. In non-seminoma the group directly determines the number of cycles.","teaching_point":"Liver, bone and brain are visceral. Lung is the exception that does not count."},"flag_note":null}}},{"id":"uro-hod-00016","version":1,"status":"published","taxonomy":{"subdomain":"Rezidivtherapie","tags":["pharmakologie","leitlinie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"29-jähriger Patient mit Nichtseminom, elf Monate nach vier Zyklen BEP erneuter Markeranstieg und neue pulmonale Herde. ECOG 0, Nierenfunktion normal.","lead_in":"Wie wird weiter behandelt?","options":{"A":{"text":"Wiederholung von BEP im gleichen Schema","rationale":"Die kumulative Bleomycindosis und die bereits gezeigte Resistenz sprechen dagegen."},"B":{"text":"Alleinige Resektion der pulmonalen Herde","rationale":"Bei steigenden Markern liegt eine systemische Erkrankung vor; die Operation allein greift zu kurz."},"C":{"text":"Cisplatinhaltige Salvage-Therapie im Zentrum","rationale":"Auch im Rezidiv besteht ein kurativer Anspruch. Die Wahl zwischen konventioneller und Hochdosistherapie richtet sich nach prognostischen Faktoren und wird an Zentren getroffen. Infrage kommen konventionell TIP oder VeIP sowie die Hochdosischemotherapie mit autologer Stammzelltransplantation. Die Auswahl richtet sich nach prognostischen Faktoren und wird an spezialisierten Zentren getroffen."},"D":{"text":"Best supportive care nach Rezidiv unter vier Zyklen","rationale":"Ein erheblicher Anteil der Patienten wird auch im Rezidiv noch geheilt."}},"explanation":{"core":"Das Rezidiv eines Keimzelltumors bleibt eine kurativ behandelbare Situation. Entscheidend sind die rasche Zuweisung an ein Zentrum mit Erfahrung, die richtige Auswahl zwischen konventioneller und Hochdosistherapie und die anschließende Resektion verbliebener Befunde nach Normalisierung der Marker.","teaching_point":"Rezidiv heißt beim Keimzelltumor Zentrum, nicht Palliativmedizin."},"flag_note":null},"en":{"vignette":"29-year-old man with non-seminoma, eleven months after four cycles of BEP, with a renewed marker rise and new pulmonary lesions. ECOG 0, normal renal function.","lead_in":"How should treatment proceed?","options":{"A":{"text":"Repeat BEP on the same schedule","rationale":"The cumulative bleomycin dose and the demonstrated resistance argue against it."},"B":{"text":"Resection of the pulmonary lesions alone","rationale":"Rising markers indicate systemic disease; surgery alone falls short."},"C":{"text":"Cisplatin-based salvage therapy at a centre","rationale":"Cure remains the goal at relapse. The choice between conventional and high-dose treatment follows prognostic factors and is made at expert centres. Options are conventional TIP or VeIP and high-dose chemotherapy with autologous stem cell rescue. The choice follows prognostic factors and is made at specialist centres."},"D":{"text":"Best supportive care after relapse on four cycles","rationale":"A substantial proportion of patients are still cured at relapse."}},"explanation":{"core":"Relapse of a germ cell tumour remains a curable situation. What matters is prompt referral to an experienced centre, the correct choice between conventional and high-dose treatment, and subsequent resection of residual lesions once markers have normalised.","teaching_point":"In germ cell tumours relapse means a specialist centre, not palliative care."},"flag_note":null}}},{"id":"uro-hod-00017","version":1,"status":"published","taxonomy":{"subdomain":"kontralaterale Biopsie","tags":["pathologie","leitlinie","praeoperativ"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"27-jähriger Patient mit Hodentumor rechts. Der linke Hoden misst sonographisch 9 ml und war in der Kindheit nicht deszendiert. Der Patient hat Kinderwunsch.","lead_in":"Welche Aussage zur kontralateralen Biopsie trifft zu?","options":{"A":{"text":"Anbieten, da Hodenvolumen und Anamnese das Risiko erhöhen","rationale":"Genau diese Risikofaktoren begründen das Angebot. Die Konsequenz ist erklärungsbedürftig, weil die Therapie der Vorstufe die Fertilität kostet und deshalb bei Kinderwunsch aufgeschoben werden kann. Kleines Hodenvolumen, junges Alter und Kryptorchismus in der Anamnese erhöhen das Risiko einer Keimzellneoplasie in situ. Bei positivem Befund stehen Bestrahlung und Überwachung zur Wahl, wobei die Bestrahlung die Fertilität aufhebt und deshalb bei Kinderwunsch aufgeschoben werden kann."},"B":{"text":"Bei jedem Hodentumor obligat, unabhängig vom Risiko","rationale":"Sie wird risikoadaptiert angeboten, nicht generell durchgeführt."},"C":{"text":"Obsolet, da die Keimzellneoplasie ohne Bedeutung ist","rationale":"Unbehandelt entwickelt sich daraus über Jahre in der Mehrzahl der Fälle ein invasiver Tumor."},"D":{"text":"Bei positivem Befund sofortige Orchiektomie der Gegenseite","rationale":"Damit wäre der Patient anorchid; Bestrahlung oder Überwachung erhalten das Organ und die Hormonproduktion zumindest teilweise."}},"explanation":{"core":"Die Keimzellneoplasie in situ ist die obligate Vorstufe der Keimzelltumoren. Beim kontralateralen Hoden ist sie in einem kleinen, aber relevanten Anteil vorhanden, häufiger bei kleinem Hodenvolumen, jungem Alter und Kryptorchismus. Die Entscheidung über die Biopsie und die Konsequenzen gehört zusammen mit der Fertilitätsberatung in dasselbe Gespräch.","teaching_point":"Die Behandlung der Vorstufe kostet die Fertilität. Deshalb erst beraten, dann biopsieren."},"flag_note":null},"en":{"vignette":"27-year-old man with a right testicular tumour. The left testis measures 9 ml on ultrasound and was undescended in childhood. He wishes to father children.","lead_in":"Which statement about contralateral biopsy is correct?","options":{"A":{"text":"Offer it, since volume and history raise the risk","rationale":"These risk factors are exactly what justifies the offer. The consequence needs explaining, because treating the precursor costs fertility and can therefore be deferred when children are wanted. Small testicular volume, young age and a history of cryptorchidism raise the risk of germ cell neoplasia in situ. If positive, radiotherapy and surveillance are the options, with radiotherapy abolishing fertility and therefore deferrable when children are wanted."},"B":{"text":"Mandatory in every testicular tumour, regardless of risk","rationale":"It is offered in a risk-adapted way, not performed universally."},"C":{"text":"Obsolete, since germ cell neoplasia has no significance","rationale":"Untreated, it progresses to invasive tumour in the majority of cases over years."},"D":{"text":"A positive result requires immediate contralateral orchiectomy","rationale":"That would render the patient anorchid; radiotherapy or surveillance preserve the organ and at least part of its hormone production."}},"explanation":{"core":"Germ cell neoplasia in situ is the obligate precursor of germ cell tumours. It is present in a small but relevant proportion of contralateral testes, more often with small volume, young age and cryptorchidism. The decision about biopsy and its consequences belongs in the same conversation as fertility counselling.","teaching_point":"Treating the precursor costs fertility. Counsel first, then biopsy."},"flag_note":null}}},{"id":"uro-hod-00018","version":1,"status":"published","taxonomy":{"subdomain":"organerhaltende Operation","tags":["operationstechnik","leitlinie"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"33-jähriger Patient mit Zustand nach Ablatio links vor sechs Jahren. Jetzt sonographisch eine 1,4 cm große Raumforderung im verbliebenen rechten Hoden. Testosteron und LH im Normbereich, Marker normal.","lead_in":"Welches Vorgehen ist zu erwägen?","options":{"A":{"text":"Ablatio des Resthodens mit Testosteronsubstitution","rationale":"Die Anorchie mit lebenslanger Substitution und Infertilität ist bei kleinem Tumor und erhaltener Funktion vermeidbar."},"B":{"text":"Organerhaltende Enukleation über inguinalen Zugang","rationale":"Bei Einzelhoden oder bilateralem Befall ist der Organerhalt etabliert, wenn der Tumor klein ist und die endokrine Funktion erhalten. Die begleitende Keimzellneoplasie in situ ist häufig und wird nachbehandelt oder überwacht. Voraussetzungen sind Einzelhoden oder beidseitiger Befall, ein Durchmesser unter etwa zwei Zentimetern und erhaltene endokrine Funktion. Während des Eingriffs erfolgen Schnellschnitt und Biopsien des angrenzenden Parenchyms, weil eine begleitende Keimzellneoplasie in situ häufig ist."},"C":{"text":"Perkutane Punktion zur Histologiegewinnung vorab","rationale":"Der skrotale Zugang ist beim Hodentumor kontraindiziert."},"D":{"text":"Primäre Chemotherapie ohne operative Sicherung","rationale":"Ohne Histologie fehlt die Grundlage jeder onkologischen Entscheidung."}},"explanation":{"core":"Der Organerhalt am Hoden ist die Ausnahme und an enge Bedingungen geknüpft: Einzelhoden oder bilateraler Tumor, Durchmesser unter etwa zwei Zentimetern, erhaltene endokrine Funktion und die Bereitschaft zu engmaschiger Nachsorge. Der inguinale Zugang bleibt zwingend, und die begleitende Vorstufe im Restparenchym muss adressiert werden.","teaching_point":"Organerhalt am Hoden nur bei Einzelhoden oder beidseitigem Tumor, und nie skrotal."},"flag_note":null},"en":{"vignette":"33-year-old man who underwent left orchiectomy six years ago. Ultrasound now shows a 1.4 cm mass in the remaining right testis. Testosterone and LH are normal, markers are normal.","lead_in":"Which approach should be considered?","options":{"A":{"text":"Orchiectomy of the remaining testis with replacement","rationale":"Anorchia with lifelong replacement and infertility is avoidable with a small tumour and preserved function."},"B":{"text":"Organ-sparing enucleation through an inguinal approach","rationale":"Organ preservation is established with a solitary testis or bilateral disease when the tumour is small and endocrine function preserved. Accompanying germ cell neoplasia in situ is common and is then treated or surveyed. Prerequisites are a solitary testis or bilateral disease, a diameter below roughly two centimetres and preserved endocrine function. Frozen section and biopsies of adjacent parenchyma are taken during surgery, because accompanying germ cell neoplasia in situ is common."},"C":{"text":"Percutaneous puncture to obtain histology beforehand","rationale":"The scrotal approach is contraindicated in testicular tumours."},"D":{"text":"Primary chemotherapy without surgical confirmation","rationale":"Without histology there is no basis for any oncological decision."}},"explanation":{"core":"Testis-sparing surgery is the exception and tied to strict conditions: solitary testis or bilateral tumour, diameter below roughly two centimetres, preserved endocrine function and willingness to accept close follow-up. The inguinal approach remains mandatory, and the accompanying precursor lesion in residual parenchyma must be addressed.","teaching_point":"Testis-sparing surgery only for a solitary testis or bilateral tumour, and never scrotal."},"flag_note":null}}},{"id":"uro-hod-00019","version":1,"status":"published","taxonomy":{"subdomain":"Therapietoxizität","tags":["nebenwirkungen","pharmakologie","praeoperativ"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"Ein Patient soll acht Monate nach drei Zyklen BEP eine Residualtumorresektion erhalten. Die Anästhesie fragt nach Besonderheiten der Vorbehandlung.","lead_in":"Worauf ist hinzuweisen?","options":{"A":{"text":"Nephrotoxizität des Etoposids mit nötiger Dosisanpassung","rationale":"Die Nierentoxizität geht vom Cisplatin aus, nicht vom Etoposid, und ist kein anästhesiologisches Kernproblem."},"B":{"text":"Kardiale Toxizität des Bleomycins mit Echokardiographie","rationale":"Bleomycin ist nicht primär kardiotoxisch; sein Zielorgan ist die Lunge."},"C":{"text":"Blutungsrisiko durch anhaltende Thrombozytopenie","rationale":"Acht Monate nach Therapieende ist die Hämatopoese in aller Regel erholt."},"D":{"text":"Pulmonale Toxizität des Bleomycins mit Sauerstoffgrenze","rationale":"Bleomycin sensibilisiert das Lungengewebe dauerhaft; hohe Sauerstoffkonzentrationen und Überwässerung können auch Monate später eine Lungenschädigung auslösen. Präoperativ wird die Lungenfunktion geprüft, intraoperativ die inspiratorische Sauerstofffraktion so niedrig wie möglich gehalten und eine Volumenüberladung vermieden. Das Risiko besteht lebenslang und nicht nur während der Therapie."}},"explanation":{"core":"Die Spätfolgen der Keimzelltumortherapie bestimmen die Betreuung über Jahrzehnte. Bleomycin hinterlässt ein Lungenrisiko, das bei jeder späteren Narkose zu berücksichtigen ist. Cisplatin hinterlässt Nephro-, Oto- und Neurotoxizität, Etoposid ein geringes Risiko sekundärer Leukämien.","teaching_point":"Nach Bleomycin gilt lebenslang: so wenig Sauerstoff wie möglich, so viel wie nötig."},"flag_note":null},"en":{"vignette":"A patient is scheduled for residual mass resection eight months after three cycles of BEP. The anaesthetist asks about relevant features of the prior treatment.","lead_in":"What must be pointed out?","options":{"A":{"text":"Nephrotoxicity of etoposide requiring dose adjustment now","rationale":"Renal toxicity comes from cisplatin, not etoposide, and is not the core anaesthetic issue."},"B":{"text":"Cardiac toxicity of bleomycin requiring echocardiography","rationale":"Bleomycin is not primarily cardiotoxic; its target organ is the lung."},"C":{"text":"Bleeding risk from persistent thrombocytopenia","rationale":"Eight months after treatment haematopoiesis has generally recovered."},"D":{"text":"Pulmonary toxicity of bleomycin with an oxygen limit","rationale":"Bleomycin sensitises lung tissue permanently; high oxygen concentrations and overhydration can trigger lung injury even months later. Lung function is checked preoperatively, the inspired oxygen fraction kept as low as possible intraoperatively and fluid overload avoided. The risk persists for life, not only during treatment."}},"explanation":{"core":"Late effects of germ cell tumour treatment shape care for decades. Bleomycin leaves a pulmonary risk that must be considered at every subsequent anaesthetic. Cisplatin leaves nephrotoxicity, ototoxicity and neurotoxicity, etoposide a small risk of secondary leukaemia.","teaching_point":"After bleomycin, lifelong: as little oxygen as possible, as much as necessary."},"flag_note":null}}},{"id":"uro-hod-00020","version":1,"status":"published","taxonomy":{"subdomain":"Langzeitnachsorge","tags":["nachsorge","labordiagnostik","nebenwirkungen"],"domain":"hodentumor"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Testicular Cancer","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-07","last_reviewed":"2026-09-07","expires":"2028-09-07"},"content":{"de":{"vignette":"36-jähriger Patient, sieben Jahre nach Ablatio und Chemotherapie bei Nichtseminom, tumorfrei. Er klagt über Antriebslosigkeit und Libidoverlust, hat 9 kg zugenommen, der Blutdruck liegt bei 148/94 mmHg.","lead_in":"Was gehört in die Langzeitnachsorge?","options":{"A":{"text":"Nur Markerkontrollen und CT, da nur das Rezidiv zählt","rationale":"Nach sieben Jahren ist das Rezidivrisiko gering, während die Spätfolgen an Bedeutung gewinnen."},"B":{"text":"Beendigung der Nachsorge, da die Heilung eingetreten ist","rationale":"Gerade die Spätfolgen erfordern eine über Jahrzehnte fortgesetzte, aber inhaltlich veränderte Betreuung."},"C":{"text":"Hormonstatus und kardiovaskuläre Risikofaktoren erfassen","rationale":"Antriebslosigkeit, Libidoverlust, Gewichtszunahme und Hypertonie passen zu Hypogonadismus und metabolischem Syndrom, beides bekannte Spätfolgen nach Chemotherapie und Verlust eines Hodens. Bestimmt werden Testosteron, LH und FSH zur Klärung eines Hypogonadismus, dazu Blutdruck, Lipide und Glukose. Zusätzlich ist auf Zweitmalignome nach Chemotherapie und Bestrahlung zu achten."},"D":{"text":"Psychotherapeutische Behandlung ohne Labordiagnostik","rationale":"Die psychische Belastung ist real, darf aber einen behandelbaren Hormonmangel nicht verdecken."}},"explanation":{"core":"Nach der Heilung eines Keimzelltumors verschiebt sich die Nachsorge vom Rezidiv zu den Spätfolgen. Relevant sind Hypogonadismus, metabolisches Syndrom, kardiovaskuläre Erkrankungen, Nephro-, Oto- und Neurotoxizität sowie Zweitmalignome nach Chemotherapie und Bestrahlung. Diese Patienten sind bei Diagnose jung und leben Jahrzehnte mit den Folgen.","teaching_point":"Nach fünf Jahren geht es nicht mehr um den Tumor, sondern um die Folgen seiner Behandlung."},"flag_note":null},"en":{"vignette":"36-year-old man, seven years after orchiectomy and chemotherapy for non-seminoma, disease-free. He reports low drive and loss of libido, has gained 9 kg, and his blood pressure is 148/94 mmHg.","lead_in":"What belongs in long-term follow-up?","options":{"A":{"text":"Markers and CT only, since only relapse matters","rationale":"After seven years relapse risk is low while late effects gain importance."},"B":{"text":"Discharge from follow-up, since cure has been achieved","rationale":"Late effects require care continued over decades, though different in content."},"C":{"text":"Assess hormone status and cardiovascular risk factors","rationale":"Low drive, loss of libido, weight gain and hypertension fit hypogonadism and metabolic syndrome, both recognised late effects after chemotherapy and loss of a testis. Testosterone, LH and FSH are measured to assess hypogonadism, together with blood pressure, lipids and glucose. Attention to second malignancies after chemotherapy and radiotherapy is added."},"D":{"text":"Psychotherapy without any laboratory investigation","rationale":"Psychological burden is real but must not mask a treatable hormone deficiency."}},"explanation":{"core":"After cure of a germ cell tumour, follow-up shifts from relapse to late effects. Relevant are hypogonadism, metabolic syndrome, cardiovascular disease, nephro-, oto- and neurotoxicity, and second malignancies after chemotherapy and radiotherapy. These patients are young at diagnosis and live with the consequences for decades.","teaching_point":"After five years it is no longer about the tumour but about the effects of its treatment."},"flag_note":null}}},{"id":"uro-utu-00001","version":1,"status":"published","taxonomy":{"subdomain":"organerhaltendes Vorgehen","tags":["leitlinie","endourologisch","nachsorge"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-05","last_reviewed":"2026-09-05","expires":"2028-09-05"},"content":{"de":{"vignette":"68-jähriger Patient mit unifokalem Tumor von 1,2 cm im distalen Ureter. Ureterorenoskopische Biopsie: Urothelkarzinom, Low Grade. Zytologie unauffällig, im CT-Urogramm keine Hinweise auf Invasion oder Lymphknotenbefall. Kontralaterale Niere normal, GFR 68 ml/min.","lead_in":"Welches Vorgehen ist leitliniengerecht?","options":{"A":{"text":"Beobachtung ohne Intervention mit halbjährlicher Bildgebung","rationale":"Auch Low-Grade-Tumoren des oberen Harntrakts wachsen und können entdifferenzieren; unbehandeltes Zuwarten ist keine Option."},"B":{"text":"Primäre systemische Chemotherapie vor jeder Lokaltherapie","rationale":"Beim nicht invasiven Low-Grade-Tumor besteht keine Indikation für eine Systemtherapie."},"C":{"text":"Organerhalt mit ureterorenoskopischer Ablation","rationale":"Unifokal, unter 2 cm, Low Grade, keine Invasionszeichen und unauffällige Zytologie definieren die Niedrigrisikogruppe, in der der Organerhalt onkologisch vertretbar ist. Voraussetzung ist eine strukturierte endoskopische Nachsorge, weil das gesamte Urothel erhalten bleibt und gefährdet ist."},"D":{"text":"Radikale Nephroureterektomie mit Blasenmanschette","rationale":"Das Verfahren der Wahl bei Hochrisikotumoren. Bei Niedrigrisikobefund bedeutet es den Verlust einer funktionsfähigen Niere ohne onkologischen Gewinn."}},"explanation":{"core":"Beim Urothelkarzinom des oberen Harntrakts wird die Risikogruppe aus Multifokalität, Größe, Grad, Zytologie und Invasionszeichen gebildet. Niedriges Risiko erlaubt den Organerhalt, verlangt aber eine engmaschige endoskopische Nachsorge und die Bereitschaft des Patienten dazu. Nach radikaler Nephroureterektomie ist zudem eine einmalige postoperative Blaseninstillation vorgesehen, um Blasenrezidive zu senken.","teaching_point":"Organerhalt beim UTUC ist an die Nachsorge gebunden. Wer sie nicht zusagen kann, ist kein Kandidat."},"flag_note":null},"en":{"vignette":"68-year-old man with a unifocal 1.2 cm tumour in the distal ureter. Ureteroscopic biopsy: urothelial carcinoma, low grade. Cytology unremarkable, CT urography shows no signs of invasion or nodal involvement. Contralateral kidney normal, GFR 68 ml/min.","lead_in":"Which approach is guideline-concordant?","options":{"A":{"text":"Observation without intervention and six-monthly imaging","rationale":"Low-grade upper tract tumours also grow and can dedifferentiate; untreated waiting is not an option."},"B":{"text":"Primary systemic chemotherapy before any local treatment","rationale":"There is no indication for systemic therapy in non-invasive low-grade disease."},"C":{"text":"Kidney-sparing ureteroscopic ablation of the tumour","rationale":"Unifocal, under 2 cm, low grade, no signs of invasion and unremarkable cytology define the low-risk group in which organ preservation is oncologically defensible. Structured endoscopic follow-up is the prerequisite, because the entire urothelium remains in place and at risk."},"D":{"text":"Radical nephroureterectomy with bladder cuff","rationale":"The procedure of choice in high-risk tumours. In low-risk disease it means losing a functioning kidney without oncological gain."}},"explanation":{"core":"In upper tract urothelial carcinoma the risk group is built from multifocality, size, grade, cytology and signs of invasion. Low risk permits organ preservation but requires close endoscopic follow-up and the patient's commitment to it. After radical nephroureterectomy a single postoperative intravesical instillation is also given to reduce bladder recurrences.","teaching_point":"Kidney-sparing management in UTUC is tied to follow-up. A patient who cannot commit to it is not a candidate."},"flag_note":null}}},{"id":"uro-utu-00002","version":1,"status":"published","taxonomy":{"subdomain":"Risikostratifizierung","tags":["leitlinie","pathologie","bildgebung"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"64-jährige Patientin mit zwei getrennten Tumoren im linken Nierenbecken von 1,1 und 2,6 cm. Die Zytologie aus dem oberen Harntrakt ist High Grade, im CT-Urogramm besteht eine Hydronephrose ohne eindeutige Invasion. Die Gegenniere ist normal.","lead_in":"Wie ist der Befund einzuordnen?","options":{"A":{"text":"Niedriges Risiko, da im CT keine Invasion nachweisbar ist","rationale":"Die fehlende Invasion im CT ist nur eines von mehreren Kriterien und wiegt die übrigen nicht auf."},"B":{"text":"Hohes Risiko wegen mehrerer erfüllter Kriterien","rationale":"Jedes dieser Merkmale allein begründet bereits die Hochrisikogruppe; hier liegen vier davon vor. Multifokalität, ein Durchmesser über zwei Zentimeter, High-Grade-Zytologie und Hydronephrose treffen hier zusammen. Jedes dieser Merkmale allein begründet bereits die Hochrisikogruppe."},"C":{"text":"Niedriges Risiko, weil die Gegenniere unauffällig ist","rationale":"Der Zustand der Gegenniere beeinflusst die Therapieentscheidung, nicht aber die Tumorrisikogruppe."},"D":{"text":"Ohne ureterorenoskopische Biopsie nicht bestimmbar","rationale":"Die Biopsie verfeinert die Einschätzung, ist aber bei dieser Konstellation für die Zuordnung nicht erforderlich."}},"explanation":{"core":"Die Risikoeinteilung beim Urothelkarzinom des oberen Harntrakts stützt sich auf Multifokalität, Größe über zwei Zentimeter, High-Grade-Zytologie oder -Biopsie, Hydronephrose, Invasionszeichen im CT und eine vorangegangene radikale Zystektomie. Bereits ein Merkmal genügt für die Hochrisikogruppe, und diese steuert die Entscheidung zwischen Organerhalt und radikaler Nephroureterektomie.","teaching_point":"Ein einziges Hochrisikomerkmal genügt. Die Kriterien werden nicht gegeneinander aufgerechnet."},"flag_note":null},"en":{"vignette":"64-year-old woman with two separate tumours in the left renal pelvis measuring 1.1 and 2.6 cm. Upper tract cytology is high grade, CT urography shows hydronephrosis without unequivocal invasion. The contralateral kidney is normal.","lead_in":"How should this be classified?","options":{"A":{"text":"Low risk, since CT shows no evidence of invasion","rationale":"Absence of invasion on CT is only one of several criteria and does not outweigh the others."},"B":{"text":"High risk because several criteria are met","rationale":"Each of these features alone already defines high risk; four are present here. Multifocality, diameter above two centimetres, high-grade cytology and hydronephrosis coincide here. Each feature alone already defines high risk."},"C":{"text":"Low risk, because the contralateral kidney is normal","rationale":"The state of the other kidney influences the treatment decision but not the tumour risk group."},"D":{"text":"Not classifiable without ureteroscopic biopsy","rationale":"Biopsy refines the assessment but is not required for classification in this constellation."}},"explanation":{"core":"Risk classification in upper tract urothelial carcinoma rests on multifocality, size above two centimetres, high-grade cytology or biopsy, hydronephrosis, signs of invasion on CT, and previous radical cystectomy. A single feature suffices for high risk, and this group drives the choice between organ preservation and radical nephroureterectomy.","teaching_point":"One high-risk feature is enough. The criteria are not weighed against each other."},"flag_note":null}}},{"id":"uro-utu-00003","version":1,"status":"published","taxonomy":{"subdomain":"Diagnostik","tags":["bildgebung","labordiagnostik","leitlinie"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"57-jähriger Raucher mit schmerzloser Makrohämaturie. Die Zystoskopie ist unauffällig, die Sonographie zeigt rechts eine diskrete Kelcherweiterung. Die Blasenzytologie ist positiv.","lead_in":"Welche Diagnostik führt weiter?","options":{"A":{"text":"Wiederholung der Zystoskopie in drei Monaten","rationale":"Eine positive Zytologie bei unauffälliger Blase verlangt die aktive Suche im oberen Harntrakt, nicht Zuwarten."},"B":{"text":"Sonographie der Nieren als alleinige Kontrolle","rationale":"Die Sonographie erkennt flache und kleine Tumoren des oberen Harntrakts nicht zuverlässig."},"C":{"text":"CT-Urographie mit selektiver Zytologie von oben","rationale":"Die CT-Urographie hat die höchste diagnostische Genauigkeit. Die selektive Zytologie lokalisiert die Quelle, und die Ureterorenoskopie klärt und stratifiziert, wenn beides nicht ausreicht. Die CT-Urographie ist die Standarduntersuchung. Die selektive Zytologie lokalisiert die Quelle; bei fortbestehender Unklarheit folgt die diagnostische Ureterorenoskopie mit Biopsie."},"D":{"text":"PET/CT zur Suche des unbekannten Primärtumors","rationale":"Für die Primärdiagnostik des oberen Harntrakts nicht etabliert und der CT-Urographie unterlegen."}},"explanation":{"core":"Positive Zytologie bei unauffälliger Blase lenkt den Verdacht auf den oberen Harntrakt oder auf ein Carcinoma in situ. Die Abklärung folgt einer Reihenfolge von der bildgebenden Übersicht über die selektive Zytologie bis zur Endoskopie. Die Ureterorenoskopie steht bewusst am Ende, weil sie das Blasenrezidivrisiko erhöht.","teaching_point":"Positive Zytologie plus leere Blase heißt: nach oben schauen."},"flag_note":null},"en":{"vignette":"57-year-old smoker with painless macroscopic haematuria. Cystoscopy is normal, ultrasound shows subtle right calyceal dilatation. Bladder cytology is positive.","lead_in":"Which investigations should follow?","options":{"A":{"text":"Repeat cystoscopy in three months","rationale":"Positive cytology with a normal bladder demands active search of the upper tract, not waiting."},"B":{"text":"Renal ultrasound as the only follow-up","rationale":"Ultrasound does not reliably detect flat or small upper tract tumours."},"C":{"text":"CT urography with selective upper tract cytology","rationale":"CT urography has the highest diagnostic accuracy. Selective cytology localises the source, and ureteroscopy clarifies and stratifies when neither suffices. CT urography is the standard investigation. Selective cytology localises the source; if uncertainty persists, diagnostic ureteroscopy with biopsy follows."},"D":{"text":"PET/CT to search for the unknown primary tumour","rationale":"Not established for primary upper tract diagnosis and inferior to CT urography."}},"explanation":{"core":"Positive cytology with a normal bladder points to the upper tract or to carcinoma in situ. The workup follows a sequence from cross-sectional imaging through selective cytology to endoscopy. Ureteroscopy deliberately comes last, because it increases the risk of bladder recurrence.","teaching_point":"Positive cytology plus an empty bladder means: look upstream."},"flag_note":null}}},{"id":"uro-utu-00004","version":1,"status":"published","taxonomy":{"subdomain":"Diagnostik","tags":["endourologisch","leitlinie","nachsorge"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Bei einem Patienten mit im CT-Urogramm eindeutigem, invasiv imponierendem Tumor des rechten Nierenbeckens und High-Grade-Zytologie wird die Indikation zur radikalen Nephroureterektomie gestellt. Ein Assistent schlägt vor, zuvor eine diagnostische Ureterorenoskopie mit Biopsie durchzuführen.","lead_in":"Wie ist dieser Vorschlag zu bewerten?","options":{"A":{"text":"Verzichtbar, da sie das Vorgehen nicht ändert","rationale":"Bildgebung und Zytologie sichern die Diagnose und die Hochrisikoeinstufung bereits. Die Endoskopie brächte keinen Zusatznutzen, würde aber den Eingriff verzögern und das Blasenrezidivrisiko erhöhen. Bildgebung und Zytologie sichern Diagnose und Hochrisikoeinstufung bereits. Die Endoskopie brächte keinen Zusatznutzen, würde den Eingriff verzögern und geht mit einem erhöhten Risiko für spätere Blasenrezidive einher."},"B":{"text":"Vor jeder Nephroureterektomie zwingend vorgeschrieben","rationale":"Sie ist indiziert, wenn die Diagnose oder die Risikogruppe unklar ist, nicht als Pflichtschritt."},"C":{"text":"Senkt das Blasenrezidivrisiko durch Spülung des Systems","rationale":"Das Gegenteil ist belegt: Die Manipulation erhöht die Rate späterer Blasenrezidive."},"D":{"text":"Durch eine perkutane Biopsie des Beckens zu ersetzen","rationale":"Der perkutane Zugang birgt das Risiko der Tumorzellverschleppung entlang des Stichkanals und ist beim Urothelkarzinom zu vermeiden."}},"explanation":{"core":"Die diagnostische Ureterorenoskopie ist wertvoll, aber nicht kostenlos: Sie verbessert die Risikoeinschätzung und ermöglicht den Organerhalt, erhöht aber nachweislich die Rate an Blasenrezidiven. Deshalb wird sie eingesetzt, wenn ihr Ergebnis die Therapie ändern kann, und weggelassen, wenn die Entscheidung ohnehin feststeht.","teaching_point":"Endoskopieren, wenn es die Entscheidung ändert. Sonst nicht."},"flag_note":null},"en":{"vignette":"In a patient with an unequivocal, apparently invasive right renal pelvic tumour on CT urography and high-grade cytology, radical nephroureterectomy is planned. A trainee suggests performing diagnostic ureteroscopy with biopsy first.","lead_in":"How should this suggestion be judged?","options":{"A":{"text":"Dispensable, since it does not change management","rationale":"Imaging and cytology already establish the diagnosis and high-risk classification. Endoscopy would add nothing while delaying surgery and raising bladder recurrence risk. Imaging and cytology already establish the diagnosis and high-risk classification. Endoscopy would add nothing, would delay surgery and carries an increased risk of later bladder recurrence."},"B":{"text":"Mandatory before every nephroureterectomy","rationale":"It is indicated when diagnosis or risk group is unclear, not as an obligatory step."},"C":{"text":"Lowers bladder recurrence risk by irrigating the system","rationale":"The opposite is documented: manipulation increases the rate of later bladder recurrences."},"D":{"text":"To be replaced by percutaneous biopsy of the pelvis","rationale":"The percutaneous route risks tumour seeding along the tract and is to be avoided in urothelial carcinoma."}},"explanation":{"core":"Diagnostic ureteroscopy is valuable but not free: it improves risk assessment and enables organ preservation, yet demonstrably increases bladder recurrence rates. It is therefore used when its result can change treatment and omitted when the decision is already settled.","teaching_point":"Scope when it changes the decision. Otherwise do not."},"flag_note":null}}},{"id":"uro-utu-00005","version":1,"status":"published","taxonomy":{"subdomain":"Nephroureterektomie","tags":["operationstechnik","leitlinie"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IIA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Radikale Nephroureterektomie rechts bei einem Hochrisikotumor des Nierenbeckens. Nach Entfernung von Niere und proximalem Ureter erwägt der Operateur, den distalen Ureterrest zu belassen, da die Präparation im kleinen Becken aufwendig ist.","lead_in":"Wie ist das zu bewerten?","options":{"A":{"text":"Vertretbar, wenn der Ureterstumpf geclippt wird","rationale":"Der Clip verhindert weder ein Rezidiv im belassenen Urothel noch dessen Progression."},"B":{"text":"Vertretbar, wenn adjuvante Chemotherapie folgt","rationale":"Die Systemtherapie ersetzt keine unvollständige Resektion des tumortragenden Organs."},"C":{"text":"Vertretbar, da der Stumpf kontrollierbar bleibt","rationale":"Der belassene Stumpf ist endoskopisch schlecht zugänglich und der Nachsorge weitgehend entzogen."},"D":{"text":"Nicht vertretbar; Ureter und Blasenmanschette müssen mit","rationale":"Im verbliebenen Ureterstumpf treten in einem erheblichen Anteil Rezidive auf, die dann schwer zugänglich sind. Die Blasenmanschette entfernt auch das intramurale Segment und das Ostium. Im belassenen Ureterstumpf treten in einem erheblichen Anteil Rezidive auf, die dann schwer zugänglich sind. Die Blasenmanschette entfernt auch das intramurale Segment und das Ostium."}},"explanation":{"core":"Das Urothel ist ein durchgehendes Feld, und jeder belassene Abschnitt bleibt gefährdet. Deshalb umfasst die radikale Nephroureterektomie Niere, gesamten Ureter und Blasenmanschette. Die Art der Blasenmanschettenbildung ist Gegenstand der Technik, ihr Weglassen dagegen nicht.","teaching_point":"Kein Ureterstumpf. Das intramurale Segment gehört mit heraus."},"flag_note":null},"en":{"vignette":"Right radical nephroureterectomy for a high-risk renal pelvic tumour. After removing the kidney and proximal ureter the surgeon considers leaving the distal ureteric remnant, since pelvic dissection is laborious.","lead_in":"How should this be judged?","options":{"A":{"text":"Acceptable if the ureteric stump is clipped","rationale":"A clip prevents neither recurrence in the retained urothelium nor its progression."},"B":{"text":"Acceptable if adjuvant chemotherapy follows","rationale":"Systemic therapy does not compensate for incomplete resection of the tumour-bearing organ."},"C":{"text":"Acceptable, since the stump remains checkable","rationale":"The retained stump is poorly accessible endoscopically and largely escapes surveillance."},"D":{"text":"Not acceptable; ureter and bladder cuff must come out","rationale":"Recurrences arise in a substantial proportion of retained stumps and are then hard to reach. The bladder cuff also removes the intramural segment and the orifice. Recurrences arise in a substantial proportion of retained stumps and are then hard to reach. The bladder cuff also removes the intramural segment and the orifice."}},"explanation":{"core":"The urothelium is a continuous field, and any retained segment remains at risk. Radical nephroureterectomy therefore comprises kidney, entire ureter and bladder cuff. How the cuff is fashioned is a matter of technique; omitting it is not.","teaching_point":"No ureteric stump. The intramural segment comes out too."},"flag_note":null}}},{"id":"uro-utu-00006","version":1,"status":"published","taxonomy":{"subdomain":"Lymphadenektomie","tags":["operationstechnik","leitlinie","pathologie"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":true},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Bei der Nephroureterektomie eines invasiven Tumors des linken Nierenbeckens soll eine Lymphadenektomie erfolgen.","lead_in":"Welches Ausräumungsgebiet ist zu wählen?","options":{"A":{"text":"Einheitlich das Becken beidseits, unabhängig von der Lage","rationale":"Pelvine Stationen sind Abflussgebiet des distalen Ureters, nicht des Nierenbeckens."},"B":{"text":"Keine Lymphadenektomie, da beim UTUC ohne Wert","rationale":"Sie verbessert die Stadienzuordnung und ist bei invasiven Tumoren mit einem Überlebensvorteil verknüpft."},"C":{"text":"Template abhängig von der Höhe des Tumors","rationale":"Der Lymphabfluss folgt der Höhe des Tumors. Ein starres Template verfehlt entweder die betroffenen Stationen oder räumt unnötig aus. Linkes Nierenbecken und proximaler Ureter drainieren paraaortal und hilär, rechts parakaval und interaortokaval, der distale Ureter in die ipsilateralen iliakalen Stationen."},"D":{"text":"Nur die im Bild vergrößerten Lymphknoten entfernen","rationale":"Ein Vorgehen nur nach Bildgebung übersieht den mikroskopischen Befall, der die Mehrzahl der positiven Fälle ausmacht."}},"explanation":{"core":"Der Lymphabfluss des oberen Harntrakts folgt segmentaler Logik: Das Nierenbecken drainiert hilär und in die großen Gefäßstationen der jeweiligen Seite, der distale Ureter in die iliakalen Stationen. Die Lymphadenektomie ist bei invasiven Tumoren Teil der Operation und liefert die Grundlage für die adjuvante Entscheidung.","teaching_point":"Die Höhe des Tumors bestimmt das Template, nicht die Gewohnheit."},"flag_note":null},"en":{"vignette":"During nephroureterectomy for an invasive tumour of the left renal pelvis, lymphadenectomy is planned.","lead_in":"Which template should be chosen?","options":{"A":{"text":"A uniform bilateral pelvic field regardless of site","rationale":"Pelvic stations drain the distal ureter, not the renal pelvis."},"B":{"text":"No lymphadenectomy, since it has no value in UTUC","rationale":"It improves staging and is associated with a survival benefit in invasive tumours."},"C":{"text":"A template determined by the level of the tumour","rationale":"Lymphatic drainage follows the level of the tumour. A rigid template either misses the involved stations or removes nodes unnecessarily. Left renal pelvis and proximal ureter drain para-aortic and hilar, the right side paracaval and interaortocaval, and the distal ureter to the ipsilateral iliac stations."},"D":{"text":"Remove only the nodes enlarged on imaging","rationale":"An imaging-only approach misses microscopic involvement, which accounts for most positive cases."}},"explanation":{"core":"Lymphatic drainage of the upper tract follows segmental logic: the renal pelvis drains to hilar and great-vessel stations on its own side, the distal ureter to the iliac stations. In invasive tumours lymphadenectomy is part of the operation and provides the basis for the adjuvant decision.","teaching_point":"The level of the tumour sets the template, not habit."},"flag_note":null}}},{"id":"uro-utu-00007","version":1,"status":"published","taxonomy":{"subdomain":"Blasenrezidivprophylaxe","tags":["pharmakologie","dosierung","leitlinie","nachsorge"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":3,"options":[{"key":"A","correct":false},{"key":"B","correct":true},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IA","certainty":"etabliert","flag":false},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"Zweiter postoperativer Tag nach radikaler Nephroureterektomie mit Blasenmanschette. Die Zystographie zeigt einen dichten Blasenverschluss ohne Extravasat.","lead_in":"Welche Maßnahme senkt das Risiko eines intravesikalen Rezidivs?","options":{"A":{"text":"Sechswöchige BCG-Induktion ab der zweiten Woche","rationale":"BCG ist für diese Indikation nicht belegt und im frisch operierten Situs mit einem erheblichen Risiko verbunden."},"B":{"text":"Einmalige intravesikale Frühinstillation nach der Operation","rationale":"Die einmalige Frühinstillation senkt die Rate intravesikaler Rezidive nachweislich. Voraussetzung ist der Ausschluss eines Extravasats. Gegeben wird ein Chemotherapeutikum, etwa Mitomycin C 40 mg, innerhalb weniger Tage und erst nach zystographisch dichtem Blasenverschluss."},"C":{"text":"Intravesikale Dauerprophylaxe über zwölf Monate","rationale":"Für ein solches Schema existiert in dieser Situation keine Evidenz."},"D":{"text":"Keine Instillation wegen geringen Blasenrezidivrisikos","rationale":"Intravesikale Rezidive treten bei einem erheblichen Anteil der Patienten auf und sind der häufigste Rezidivort überhaupt."}},"explanation":{"core":"Nach Entfernung des tumortragenden oberen Harntrakts bleibt die Blase das gefährdete Organ. Eine einzelne frühe Instillation nach gesichertem Blasenverschluss senkt die Rezidivrate deutlich und ist wenig aufwendig. Die anschließende Nachsorge stützt sich auf Zystoskopie und Schnittbildgebung.","teaching_point":"Eine Instillation, ein Zeitfenster, ein klarer Nutzen. Vorher Dichtigkeit prüfen."},"flag_note":null},"en":{"vignette":"Second postoperative day after radical nephroureterectomy with bladder cuff. Cystography shows a watertight bladder closure without extravasation.","lead_in":"Which measure reduces the risk of intravesical recurrence?","options":{"A":{"text":"Six-week BCG induction from the second week onwards","rationale":"BCG is not established for this indication and carries considerable risk in a freshly operated field."},"B":{"text":"A single early intravesical instillation after surgery","rationale":"The single early instillation demonstrably lowers the rate of intravesical recurrence. Exclusion of extravasation is the prerequisite. A chemotherapeutic agent such as mitomycin C 40 mg is given within a few days and only after cystography confirms a watertight bladder."},"C":{"text":"Continuous intravesical prophylaxis for twelve months","rationale":"No evidence supports such a schedule in this situation."},"D":{"text":"No instillation, given the low bladder recurrence risk","rationale":"Intravesical recurrences occur in a substantial proportion of patients and are the commonest site of recurrence overall."}},"explanation":{"core":"Once the tumour-bearing upper tract has been removed, the bladder remains the organ at risk. A single early instillation after confirmed watertight closure markedly lowers recurrence and costs little. Subsequent surveillance rests on cystoscopy and cross-sectional imaging.","teaching_point":"One instillation, one time window, one clear benefit. Check for leakage first."},"flag_note":null}}},{"id":"uro-utu-00008","version":1,"status":"published","taxonomy":{"subdomain":"adjuvante Therapie","tags":["pharmakologie","dosierung","leitlinie"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":4,"options":[{"key":"A","correct":false},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":true}],"evidence":{"level":"IB","certainty":"etabliert","flag":false},"sources":[{"type":"studie","citation":"POUT, Birtle et al., Lancet 2020"},{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2028-09-06"},"content":{"de":{"vignette":"68-jähriger Patient nach radikaler Nephroureterektomie. Histologie: Urothelkarzinom pT3 pN0, High Grade, R0. Die GFR beträgt sechs Wochen postoperativ 52 ml/min, ECOG 0, keine Neuropathie, keine Hörminderung.","lead_in":"Welche adjuvante Therapie ist zu empfehlen?","options":{"A":{"text":"Keine adjuvante Therapie, ausschließlich Nachsorge","rationale":"Bei pT3 High Grade besteht ein hohes Rezidivrisiko, und für die adjuvante Chemotherapie liegt ein randomisierter Nachweis vor."},"B":{"text":"Adjuvantes Pembrolizumab über ein Jahr geben","rationale":"Die Checkpointinhibition ist in dieser Situation nicht die durch POUT belegte Standardoption."},"C":{"text":"Adjuvante Bestrahlung des Nierenlagers anschließen","rationale":"Die Strahlentherapie hat hier keinen belegten Stellenwert."},"D":{"text":"Platinbasierte Chemotherapie über vier Zyklen","rationale":"Die POUT-Studie zeigte für dieses Vorgehen einen deutlichen Vorteil im krankheitsfreien Überleben. Das Zeitfenster und die nierenfunktionsabhängige Substanzwahl sind Teil des Protokolls. Begonnen wird innerhalb von 90 Tagen nach der Operation. Bei einer GFR unter 50 ml/min wird Carboplatin statt Cisplatin eingesetzt; beides ist Teil des POUT-Protokolls."}},"explanation":{"core":"Beim Urothelkarzinom des oberen Harntrakts ist die adjuvante Chemotherapie durch eine randomisierte Studie gestützt, was sie von vielen anderen adjuvanten Konzepten unterscheidet. Zwei praktische Punkte entscheiden über die Umsetzbarkeit: das Zeitfenster von 90 Tagen und die nach der Nephroureterektomie regelhaft reduzierte Nierenfunktion.","teaching_point":"Nach der Operation läuft die Uhr, und die GFR bestimmt das Platin."},"flag_note":null},"en":{"vignette":"68-year-old man after radical nephroureterectomy. Histology: urothelial carcinoma pT3 pN0, high grade, R0. Six weeks postoperatively the GFR is 52 ml/min; ECOG 0, no neuropathy, no hearing loss.","lead_in":"Which adjuvant treatment should be recommended?","options":{"A":{"text":"No adjuvant treatment, surveillance only","rationale":"pT3 high-grade disease carries a high recurrence risk, and randomised evidence supports adjuvant chemotherapy."},"B":{"text":"Give adjuvant pembrolizumab for one year","rationale":"Checkpoint inhibition is not the standard option supported by POUT in this situation."},"C":{"text":"Add adjuvant radiotherapy to the renal bed","rationale":"Radiotherapy has no established role here."},"D":{"text":"Platinum-based chemotherapy for four cycles","rationale":"The POUT trial showed a clear disease-free survival benefit for this approach. The time window and renal-function-dependent drug choice are part of the protocol. It starts within 90 days of surgery. With a GFR below 50 ml/min carboplatin replaces cisplatin; both are part of the POUT protocol."}},"explanation":{"core":"In upper tract urothelial carcinoma adjuvant chemotherapy is supported by a randomised trial, which distinguishes it from many other adjuvant concepts. Two practical points decide feasibility: the 90-day window and the renal function that is routinely reduced after nephroureterectomy.","teaching_point":"After surgery the clock is running, and the GFR chooses the platinum."},"flag_note":null}}},{"id":"uro-utu-00009","version":1,"status":"published","taxonomy":{"subdomain":"perioperatives Konzept","tags":["leitlinie","praeoperativ","labordiagnostik"],"domain":"utuc"},"type":"single_best_answer","difficulty_estimated":5,"options":[{"key":"A","correct":true},{"key":"B","correct":false},{"key":"C","correct":false},{"key":"D","correct":false}],"evidence":{"level":"IIB","certainty":"kontrovers","flag":true},"sources":[{"type":"leitlinie","code":"EAU","title":"EAU Guidelines on Upper Urinary Tract Urothelial Carcinoma","year":2026},{"type":"studie","citation":"POUT, Lancet 2020"}],"review":{"author":"EK","reviewer":null,"created":"2026-09-06","last_reviewed":"2026-09-06","expires":"2027-09-06"},"content":{"de":{"vignette":"62-jähriger Patient mit einem im CT invasiv imponierenden Tumor des rechten Nierenbeckens, High-Grade-Zytologie, klinisch cN0. Präoperative GFR 68 ml/min bei normaler Gegenniere. Im Tumorboard wird über neoadjuvante gegen adjuvante Chemotherapie diskutiert.","lead_in":"Welches Argument spricht am stärksten für das neoadjuvante Vorgehen?","options":{"A":{"text":"Die Nierenfunktion fällt nach der Operation regelhaft ab","rationale":"Der Verlust einer Niere senkt die GFR typischerweise um etwa ein Viertel. Wer präoperativ knapp über der Grenze liegt, unterschreitet sie danach häufig. Der Verlust einer Niere senkt die GFR typischerweise um etwa ein Viertel, sodass ein erheblicher Teil der Patienten postoperativ nicht mehr cisplatinfähig ist."},"B":{"text":"Randomisierte Studie mit Überlebensvorteil belegt es","rationale":"Ein solcher Nachweis liegt für das neoadjuvante Vorgehen bislang nicht vor; die randomisierte Evidenz betrifft die adjuvante Situation."},"C":{"text":"Die Chemotherapie ersetzt die Lymphadenektomie","rationale":"Die Lymphadenektomie bleibt unabhängig davon Teil der Operation bei invasiven Tumoren."},"D":{"text":"Das klinische Staging schließt Übertherapie aus","rationale":"Genau das Gegenteil trifft zu: Die präoperative Stadienzuordnung ist unsicher, was das wichtigste Argument gegen das neoadjuvante Vorgehen darstellt."}},"explanation":{"core":"Die Abwägung ist symmetrisch. Für die neoadjuvante Gabe spricht die bessere Nierenfunktion und damit die Cisplatinfähigkeit, gegen sie die unsichere präoperative Stadienzuordnung mit der Gefahr der Übertherapie. Für die adjuvante Gabe spricht die randomisierte Evidenz, gegen sie der häufige Funktionsverlust nach der Operation.","teaching_point":"Die Cisplatinfähigkeit ist vor der Operation am größten und danach oft verloren."},"flag_note":"Die neoadjuvante Chemotherapie beim Urothelkarzinom des oberen Harntrakts ist nicht durch eine abgeschlossene randomisierte Studie belegt und bleibt eine Einzelfallentscheidung im Tumorboard."},"en":{"vignette":"62-year-old man with a right renal pelvic tumour appearing invasive on CT, high-grade cytology, clinically cN0. Preoperative GFR is 68 ml/min with a normal contralateral kidney. The tumour board debates neoadjuvant versus adjuvant chemotherapy.","lead_in":"Which argument most strongly favours the neoadjuvant approach?","options":{"A":{"text":"Renal function regularly falls after the operation","rationale":"Losing a kidney typically reduces GFR by around a quarter. Patients just above the threshold before surgery often fall below it afterwards. Losing a kidney typically reduces GFR by around a quarter, so a substantial proportion of patients are no longer cisplatin-eligible postoperatively."},"B":{"text":"A randomised trial with a survival benefit proves it","rationale":"No such evidence yet exists for the neoadjuvant approach; the randomised evidence concerns the adjuvant setting."},"C":{"text":"Chemotherapy replaces the lymph node dissection","rationale":"Lymphadenectomy remains part of the operation in invasive tumours regardless."},"D":{"text":"Clinical staging rules out any overtreatment","rationale":"The opposite is true: preoperative staging is unreliable, which is the main argument against the neoadjuvant approach."}},"explanation":{"core":"The trade-off is symmetrical. In favour of neoadjuvant treatment: better renal function and therefore cisplatin eligibility. Against it: unreliable preoperative staging with the risk of overtreatment. In favour of adjuvant treatment: randomised evidence. Against it: the frequent loss of function after surgery.","teaching_point":"Cisplatin eligibility is at its highest before surgery and often lost afterwards."},"flag_note":"Neoadjuvant chemotherapy in upper tract urothelial carcinoma is not supported by a completed randomised trial and remains an individual tumour board decision."}}},{"id":"uro-utu-00010","version":1,"status":"published","taxonomy":{"subdomain":"hereditäre Formen"
